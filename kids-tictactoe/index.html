    font-display:swap;
  }

  :root{
    --bg:#7874FD;
    --cell:#9702D7;
    --bright:#E4E4E4;
    --ink:#202020;
    --ink-muted:rgba(32,32,32,0.4);
    --success:#04D052;
    --incorrect:#ED2B2E;
    --draw: var(--ink-muted);
    /* Figma frame: 1728x1117 */
    --hero-size: clamp(2.6rem, 13.3102vw, 230px);
    --board-size: min(76vmin, 76vw, 570px);
    --unit: 1.1574vw;
    --icon-size: clamp(44px, 8.912vw, 154px);
  }

  @media (min-width: 768px) and (max-width: 1023px) and (min-height: 501px){
    :root{
      --hero-size: clamp(90px, 14.4733vw, 150px);
      --unit: 2.3981vw;
      --icon-size: clamp(80px, 11.4824vw, 120px);
    }
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    position:relative;
    margin:0;
    height: var(--app-height, 100vh);
    background:var(--bg);
    color:var(--bright);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select:none;
    user-select:none;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action:manipulation;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  .num{
    font-family:'Spline Sans Mono', ui-monospace, 'SF Mono', monospace;
    font-variant-numeric: tabular-nums slashed-zero;
    font-feature-settings: "zero" 1;
    font-weight:400;
  }

  /* ---------- icon buttons (difficulty / back / refresh) ---------- */
  .icon-btn{
    appearance:none;
    background:none;
    border:none;
    cursor:pointer;
    width:var(--icon-size);
    height:var(--icon-size);
    aspect-ratio:1;
    border-radius:50%;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:none;
    transform: translateZ(0);
    -webkit-transform: translateZ(0);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .icon-btn:active{ transform: translateZ(0) scale(0.94); }
  .icon-btn svg{ width:100%; height:100%; display:block; }
  .icon-btn .fill-bg{ transition: fill 120ms ease; }

  .diff-group{ position:absolute; right:var(--unit); top:var(--unit); display:flex; gap:calc(var(--icon-size) * 0.1); z-index:2; }
  .diff-btn .fill-bg{ fill:var(--ink-muted); }
  .diff-btn.active .fill-bg{ fill:var(--bright); }

  .btn-row{ position:absolute; left:var(--unit); bottom:var(--unit); display:flex; gap:calc(var(--icon-size) * 0.1); z-index:2; }

  @media (min-width: 768px) and (max-width: 1023px) and (min-height: 501px){
    .diff-group, .btn-row{ gap: calc(var(--icon-size) * 0.1253); }
  }

  .controls-slider{ display:contents; }

  .score-row{
    position:absolute;
    right:var(--unit);
    bottom:var(--unit);
    z-index:2;
    display:flex;
    align-items:center;
    gap: calc(var(--icon-size) * 0.1);
  }
  .score-pill{
    width:var(--icon-size);
    height:var(--icon-size);
    aspect-ratio:1;
    border-radius:50%;
    background:var(--ink-muted);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background 150ms ease;
  }
  .score-pill .num{ color:var(--bright); font-size:calc(var(--icon-size) * 0.7676); transition:color 150ms ease; }
  .score-pill.active{ background:var(--bright); }
  .score-pill.active .num{ color:var(--ink); }

  .board-wrap{ position:relative; }
  .board-wrap.busy{ pointer-events:none; }
  .board{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    gap: calc(var(--board-size) * 0.026525);
    width:var(--board-size);
    height:var(--board-size);
  }
  .cell{
    appearance:none;
    border:none;
    padding:0;
    background:var(--cell);
    border-radius: calc(var(--board-size) * 0.026525);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .cell:active{ transform:scale(0.96); }
  .cell svg{ width:100%; height:100%; display:block; }

  @media (hover:hover) and (pointer:fine){
    .cell:hover{ transform:scale(1.035); }
  }

  .cell.fade{ background: var(--fade-color, var(--cell)); }

  @keyframes bounce-in{
    0%{ transform:scale(0); opacity:0; }
    100%{ transform:scale(var(--final-scale)); opacity:1; }
  }
  .yay-overlay{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    z-index:5;
    cursor:pointer;
    overflow:hidden;
  }
  .yay-overlay.show{ display:flex; }
  .yay-letter{
    display:inline-block;
    transform: translate(var(--tx), var(--ty)) rotate(var(--rot));
  }
  .yay-letter-inner{
    display:inline-block;
    color:var(--bright);
    font-size: calc(var(--hero-size) * 1.25);
    animation: bounce-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    animation-delay: var(--delay);
  }

  /* ---------- phone: single scrollable slider-menu bar ---------- */
  @media (max-width: 767px), (max-height: 500px){
    :root{
      --hero-size: clamp(2.6rem, 16.5587vw, 140px);
      --unit: 5.089vw;
      --icon-size: clamp(52px, 20.5344vw, 100px);
    }
    .controls-slider{
      display:flex;
      align-items:flex-end;
      gap: calc(var(--icon-size) * 0.1239);
      position:fixed;
      left:var(--unit);
      right:var(--unit);
      bottom:var(--unit);
      z-index:3;
      background: rgba(32,32,32,0.4);
      border-radius:999px;
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    .controls-slider::-webkit-scrollbar{ display:none; }
    .diff-group, .btn-row{ display:contents; }
    .score-row{ left:var(--unit); top:var(--unit); right:auto; bottom:auto; }
    body{
      padding-top: calc(var(--unit) * 2 + var(--icon-size));
      padding-bottom: calc(var(--unit) * 2 + var(--icon-size));
    }
  }

  @media (max-height: 500px) and (orientation: landscape){
    :root{
      --hero-size: clamp(2.2rem, 30vh, 140px);
      --unit: clamp(8px, 3.5vh, 14px);
      --icon-size: clamp(40px, 14vh, 64px);
    }
  }
</style>
</head>
<body>

  <div class="controls-slider" id="controlsSlider">
    <div class="diff-group" id="diffGroup">
      <button class="icon-btn diff-btn" data-tier="easy" aria-label="Easy">
        <svg viewBox="0 0 150 150"><path class="fill-bg" d="M75 8C37.9969 8 8 37.9969 8 75C8 112.003 37.9969 142 75 142C112.003 142 142 112.003 142 75L150 75C150 116.421 116.421 150 75 150C33.5786 150 -1.46777e-06 116.421 -3.27835e-06 75C-5.08894e-06 33.5786 33.5786 -1.46777e-06 75 -3.27835e-06C116.421 -5.08894e-06 150 33.5786 150 75L142 75C142 37.9969 112.003 8 75 8Z"/></svg>
      </button>
      <button class="icon-btn diff-btn" data-tier="medium" aria-label="Medium">
        <svg viewBox="0 0 150 150"><path class="fill-bg" d="M114 75C114 53.4609 96.5391 36 75 36C53.4609 36 36 53.4609 36 75C36 96.5391 53.4609 114 75 114V150C33.5786 150 0 116.421 0 75C0 33.5786 33.5786 0 75 0C116.421 0 150 33.5786 150 75C150 116.421 116.421 150 75 150V114C96.5391 114 114 96.5391 114 75Z"/></svg>
      </button>
      <button class="icon-btn diff-btn" data-tier="hard" aria-label="Hard">
        <svg viewBox="0 0 150 150"><circle class="fill-bg" cx="75" cy="75" r="75"/></svg>
      </button>
    </div>

    <div class="btn-row">
      <button class="icon-btn" id="backBtn" aria-label="Back">
        <svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="75" fill="var(--ink-muted)"/><path fill="var(--bright)" d="M36.0283 79.8692L33 77.207L35.8525 74.3565L66.2295 43.999L71.5732 49.3467L47.9971 72.9082L116 72.9082L116 80.1953L47.8467 80.1953L71.3975 100.906L66.4053 106.584L36.0283 79.8692Z"/></svg>
      </button>
      <button class="icon-btn" id="refreshBtn" aria-label="New game">
        <svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="75" fill="var(--ink-muted)"/><path fill="none" stroke="var(--bright)" stroke-width="8" d="M111.491 32.1671L112.864 53.5756L90.0895 53.5683"/><path fill="none" stroke="var(--bright)" stroke-width="7" d="M110.802 97.5619C106.102 105.702 98.8837 112.094 90.2343 115.774C81.5848 119.454 71.9735 120.223 62.8492 117.964C53.7249 115.705 45.5822 110.541 39.6485 103.251C33.7149 95.9607 30.312 86.9392 29.9527 77.5463C29.5935 68.1534 32.2974 58.8983 37.6569 51.1762C43.0164 43.454 50.7409 37.6834 59.666 34.7343C68.5911 31.7851 78.2331 31.8172 87.1383 34.8258C96.0436 37.8343 103.729 43.6563 109.037 51.4139"/></svg>
      </button>
    </div>
  </div>

  <div class="score-row" id="scoreRow">
    <div class="score-pill" id="scorePillX"><span class="num" id="scoreValX">0</span></div>
    <div class="score-pill"><span class="num">–</span></div>
    <div class="score-pill" id="scorePillO"><span class="num" id="scoreValO">0</span></div>
  </div>

  <div class="board-wrap" id="boardWrap">
    <div class="board" id="board"></div>
  </div>

  <div class="yay-overlay" id="yayOverlay"></div>

<script>
(function(){
  "use strict";

  var LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  var X_SVG = '<svg viewBox="0 0 199.175 199.175"><path fill="var(--bright)" d="M37.0514 48.4488L48.4467 37.0534L99.7259 88.3326L151.005 37.0534L162.4 48.4488L111.121 99.7279L162.4 151.007L151.005 162.402L99.7259 111.123L48.4467 162.402L37.0514 151.007L88.3305 99.7279L37.0514 48.4488Z"/></svg>';
  var O_SVG = '<svg viewBox="0 0 199.175 199.175"><circle cx="99.5874" cy="99.5869" r="58.5809" fill="none" stroke="var(--bright)" stroke-width="16.7374"/></svg>';

  var YAY_LETTERS = [
    { ch: 'y', rot: -16, scale: 1.05, tx: '0em',    ty: '0.18em'  },
    { ch: 'a', rot: 7,   scale: 1.3,  tx: '0.03em', ty: '-0.05em' },
    { ch: 'y', rot: -7,  scale: 1.75, tx: '0.06em', ty: '-0.38em' },
    { ch: '!', rot: -11, scale: 0.85, tx: '0.05em', ty: '0.55em'  }
  ];

  var WINS_TO_GO = 5;
  var BLOCK_CHANCE_EASY = 0.65;
  var BLOCK_CHANCE_MEDIUM = 0.85;
  var HARD_MISTAKE_CHANCE = 0.2;

  var state = {
    board: Array(9).fill(null),
    busy: false,
    over: false,
    difficulty: 'easy',
    scoreX: 0,
    scoreO: 0
  };

  var els = {
    board: document.getElementById('board'),
    boardWrap: document.getElementById('boardWrap'),
    yayOverlay: document.getElementById('yayOverlay'),
    diffGroup: document.getElementById('diffGroup'),
    backBtn: document.getElementById('backBtn'),
    refreshBtn: document.getElementById('refreshBtn'),
    scorePillX: document.getElementById('scorePillX'),
    scorePillO: document.getElementById('scorePillO'),
    scoreValX: document.getElementById('scoreValX'),
    scoreValO: document.getElementById('scoreValO')
  };

  var fadeTimer = null;
  var dismissTimer = null;

  function updateAppHeight(){
    var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty('--app-height', h + 'px');
  }
  updateAppHeight();
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', updateAppHeight);
    window.visualViewport.addEventListener('scroll', updateAppHeight);
  } else {
    window.addEventListener('resize', updateAppHeight);
  }

  function buildCells(){
    els.board.innerHTML = '';
    for(var i=0;i<9;i++){
      var cell = document.createElement('button');
      cell.className = 'cell';
      cell.dataset.i = i;
      cell.setAttribute('aria-label', 'Cell ' + (i+1));
      cell.addEventListener('click', onCellClick);
      els.board.appendChild(cell);
    }
  }

  function renderCell(i){
    var cell = els.board.children[i];
    var v = state.board[i];
    cell.innerHTML = v === 'X' ? X_SVG : v === 'O' ? O_SVG : '';
  }

  function getResult(board){
    for(var l=0;l<LINES.length;l++){
      var a=LINES[l][0], b=LINES[l][1], c=LINES[l][2];
      if(board[a] && board[a]===board[b] && board[a]===board[c]){
        return { winner: board[a], line: LINES[l] };
      }
    }
    if(board.every(function(v){ return v; })) return { winner:'draw', line:null };
    return { winner:null, line:null };
  }

  function emptyIndices(board){
    var out = [];
    for(var i=0;i<9;i++) if(!board[i]) out.push(i);
    return out;
  }

  function allIndices(){
    return [0,1,2,3,4,5,6,7,8];
  }

  function minimax(board, isMax){
    var res = getResult(board);
    if(res.winner === 'O') return { score: 10 };
    if(res.winner === 'X') return { score: -10 };
    if(res.winner === 'draw') return { score: 0 };
    var empties = emptyIndices(board);
    if(isMax){
      var best = { score: -Infinity, move: empties[0] };
      for(var i=0;i<empties.length;i++){
        var idx = empties[i];
        board[idx] = 'O';
        var r = minimax(board, false);
        board[idx] = null;
        if(r.score > best.score) best = { score:r.score, move:idx };
      }
      return best;
    } else {
      var bestMin = { score: Infinity, move: empties[0] };
      for(var j=0;j<empties.length;j++){
        var idx2 = empties[j];
        board[idx2] = 'X';
        var r2 = minimax(board, true);
        board[idx2] = null;
        if(r2.score < bestMin.score) bestMin = { score:r2.score, move:idx2 };
      }
      return bestMin;
    }
  }

  function computerMove(){
    var board = state.board.slice();
    var empties = emptyIndices(board);

    for(var i=0;i<empties.length;i++){
      var b = board.slice(); b[empties[i]] = 'O';
      if(getResult(b).winner === 'O') return empties[i];
    }

    if(state.difficulty === 'hard' && Math.random() >= HARD_MISTAKE_CHANCE){
      return minimax(board, true).move;
    }

    var blockChance = state.difficulty === 'easy' ? BLOCK_CHANCE_EASY : BLOCK_CHANCE_MEDIUM;
    if(Math.random() < blockChance){
      for(var j=0;j<empties.length;j++){
        var b2 = board.slice(); b2[empties[j]] = 'X';
        if(getResult(b2).winner === 'X') return empties[j];
      }
    }
    return empties[Math.floor(Math.random() * empties.length)];
  }

  function onCellClick(e){
    var i = Number(e.currentTarget.dataset.i);
    if(state.busy || state.over || state.board[i]) return;
    place(i, 'X');
    if(checkEnd()) return;
    state.busy = true;
    els.boardWrap.classList.add('busy');
    setTimeout(function(){
      var move = computerMove();
      place(move, 'O');
      state.busy = false;
      els.boardWrap.classList.remove('busy');
      checkEnd();
    }, 500 + Math.random() * 400);
  }

  function place(i, mark){
    state.board[i] = mark;
    renderCell(i);
  }

  function checkEnd(){
    var res = getResult(state.board);
    if(!res.winner) return false;
    state.over = true;
    if(res.winner === 'draw') runFade(allIndices(), '--draw', resetBoard);
    else if(res.winner === 'X') runFade(res.line, '--success', onWinResolved);
    else runFade(res.line, '--incorrect', onLoseResolved);
    return true;
  }

  function runFade(cells, colorVar, after){
    els.board.style.setProperty('--fade-color', 'var(' + colorVar + ')');
    cells.forEach(function(i){ els.board.children[i].classList.add('fade'); });
    fadeTimer = setTimeout(function(){
      cells.forEach(function(i){ els.board.children[i].classList.remove('fade'); });
      after();
    }, 1600);
  }

  function updateScoreDisplay(){
    els.scoreValX.textContent = state.scoreX;
    els.scoreValO.textContent = state.scoreO;
  }

  var scorePillTimer = null;

  function flashScorePill(pillEl){
    clearTimeout(scorePillTimer);
    pillEl.classList.add('active');
    scorePillTimer = setTimeout(function(){
      pillEl.classList.remove('active');
    }, 1600);
  }

  function onWinResolved(){
    state.scoreX += 1;
    updateScoreDisplay();
    flashScorePill(els.scorePillX);
    if(state.scoreX >= WINS_TO_GO) showYay();
    else resetBoard();
  }

  function onLoseResolved(){
    state.scoreO += 1;
    updateScoreDisplay();
    flashScorePill(els.scorePillO);
    resetBoard();
  }

  function showYay(){
    var html = '';
    for(var i=0;i<YAY_LETTERS.length;i++){
      var letter = YAY_LETTERS[i];
      var delay = (i * 0.15) + 's';
      html += '<span class="yay-letter" style="--tx:' + letter.tx + '; --ty:' + letter.ty + '; --rot:' + letter.rot + 'deg;">' +
        '<span class="num yay-letter-inner" style="--final-scale:' + letter.scale + '; --delay:' + delay + ';">' + letter.ch + '</span>' +
        '</span>';
    }
    els.yayOverlay.innerHTML = html;
    els.yayOverlay.classList.add('show');
    dismissTimer = setTimeout(finishMilestone, 3000);
  }

  function finishMilestone(){
    clearTimeout(scorePillTimer);
    els.yayOverlay.classList.remove('show');
    els.yayOverlay.innerHTML = '';
    state.scoreX = 0;
    state.scoreO = 0;
    updateScoreDisplay();
    els.scorePillX.classList.remove('active');
    els.scorePillO.classList.remove('active');
    resetBoard();
  }

  function resetBoard(){
    clearTimeout(dismissTimer);
    clearTimeout(fadeTimer);
    state.board = Array(9).fill(null);
    state.busy = false;
    state.over = false;
    els.boardWrap.classList.remove('busy');
    for(var i=0;i<9;i++){
      els.board.children[i].classList.remove('fade');
      renderCell(i);
    }
  }

  function restartRound(){
    clearTimeout(scorePillTimer);
    state.scoreX = 0;
    state.scoreO = 0;
    updateScoreDisplay();
    els.scorePillX.classList.remove('active');
    els.scorePillO.classList.remove('active');
    resetBoard();
  }

  els.yayOverlay.addEventListener('click', finishMilestone);
  els.refreshBtn.addEventListener('click', restartRound);
  els.backBtn.addEventListener('click', function(){ window.location.href = '../index.html'; });

  els.diffGroup.addEventListener('click', function(e){
    var btn = e.target.closest('.diff-btn');
    if(!btn) return;
    els.diffGroup.querySelectorAll('.diff-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    state.difficulty = btn.getAttribute('data-tier');
    resetBoard();
  });

  // First-visit only: gently peek-scroll the bottom slider tray so new users notice
  // it scrolls (there are more icons than fit on a phone screen), then ease back to
  // the correct resting view with the easy-difficulty icon as the leftmost icon.
  function introduceTraySlider(){
    var el = document.getElementById('controlsSlider');
    if (!el || window.innerWidth > 767) return;
    var STORAGE_KEY = 'tictactoeByEliel.traySliderIntroShown';
    try { if (localStorage.getItem(STORAGE_KEY)) return; } catch (e) {}
    var maxScroll = el.scrollWidth - el.clientWidth;
    if (maxScroll <= 0) return;
    var reveal = Math.min(maxScroll, el.clientWidth * 0.6);
    el.scrollLeft = reveal;
    var duration = 1800;
    var start = null;
    function easeInOutCubic(t){
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }
    function step(ts){
      if (start === null) start = ts;
      var elapsed = ts - start;
      if (elapsed >= duration) {
        el.scrollLeft = 0;
        try { localStorage.setItem(STORAGE_KEY, '1'); } catch (e) {}
        return;
      }
      el.scrollLeft = reveal * (1 - easeInOutCubic(elapsed / duration));
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  setTimeout(introduceTraySlider, 500);

  buildCells();
  els.diffGroup.querySelector('[data-tier="easy"]').classList.add('active');
  updateScoreDisplay();
  resetBoard();
})();
</script>

</body>
</html>
