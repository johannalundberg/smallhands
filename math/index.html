  :root{
    --bg:#9702D7;
    --bright:#E4E4E4;
    --ink:#202020;
    --ink-muted:rgba(32,32,32,0.4);
    --success:#04D052;
    --incorrect:#ED2B2E;
    /* Figma frame: 1728x1117 */
    --hero-size: clamp(2.6rem, 13.3102vw, 230px); /* 230px on the 1728-wide frame */
    --unit: 1.1574vw; /* 20px margin/gap on the 1728-wide frame */
    --icon-size: clamp(44px, 8.912vw, 154px);
  }

  /* iPad Pro portrait: icons and equation text run bigger relative to width than the desktop curve gives */
  /* min-height guard excludes a phone in landscape (width lands in this range but
     height is short, e.g. 844x390) — that should get the phone slider-menu layout
     below, not this iPad-tuned four-corner one, which assumes far more height. */
  @media (min-width: 768px) and (max-width: 1023px) and (min-height: 501px){
    :root{
      --hero-size: clamp(90px, 14.4733vw, 150px); /* 120.71px on the 834-wide frame */
      --unit: 2.3981vw; /* 20px on the 834-wide iPad portrait frame */
      --icon-size: clamp(80px, 11.4824vw, 120px); /* 95.77px on the 834-wide frame */
    }
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    position:relative;
    margin:0;
    height: var(--app-height, 100vh);
    background:var(--bg);
    color:var(--bright);
    -webkit-tap-highlight-color: transparent;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: background 80ms ease;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  .num{
    font-family:'Spline Sans Mono', ui-monospace, 'SF Mono', monospace;
    font-variant-numeric: tabular-nums slashed-zero;
    font-feature-settings: "zero" 1;
    font-weight:400;
  }

  /* ---------- icon buttons (operation / difficulty / refresh) ---------- */
  .icon-btn{
    appearance:none;
    background:none;
    border:none;
    cursor:pointer;
    width:var(--icon-size);
    height:var(--icon-size);
    aspect-ratio:1;
    border-radius:50%;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:none;
    /* Force a stable, dedicated GPU compositing layer from the start, instead of
       letting the browser promote/demote one inconsistently — a classic fix for
       intermittent stale-paint/clipping glitches on rounded elements in WebKit. */
    transform: translateZ(0);
    -webkit-transform: translateZ(0);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .icon-btn:active{ transform: translateZ(0) scale(0.94); }
  .icon-btn svg{ width:100%; height:100%; display:block; }
  .icon-btn .fill-bg{ transition: fill 120ms ease; }
  .icon-btn .fill-glyph{ transition: fill 150ms ease; }

  .op-group{ position:absolute; left:var(--unit); top:var(--unit); display:flex; gap:calc(var(--icon-size) * 0.1); z-index:2; }
  .op-btn .fill-bg{ fill:var(--ink-muted); }
  .op-btn .fill-glyph{ fill:var(--bright); }
  .op-btn.active .fill-bg{ fill:var(--bright); }
  .op-btn.active .fill-glyph{ fill:var(--ink); }

  .diff-group{ position:absolute; right:var(--unit); top:var(--unit); display:flex; gap:calc(var(--icon-size) * 0.1); z-index:2; }
  .diff-btn .fill-bg{ fill:var(--ink-muted); }
  .diff-btn.active .fill-bg{ fill:var(--bright); }

  .btn-row{ position:absolute; left:var(--unit); bottom:var(--unit); display:flex; gap:calc(var(--icon-size) * 0.1); z-index:2; }

  /* iPad portrait: icon-group gap is proportionally wider than the desktop ratio */
  /* min-height guard excludes a phone in landscape (width lands in this range but
     height is short, e.g. 844x390) — that should get the phone slider-menu layout
     below, not this iPad-tuned four-corner one, which assumes far more height. */
  @media (min-width: 768px) and (max-width: 1023px) and (min-height: 501px){
    .op-group, .diff-group, .btn-row{ gap: calc(var(--icon-size) * 0.1253); }
  }

  .controls-slider{ display:contents; }

  .progress-dots{
    position:absolute;
    right:var(--unit);
    bottom:var(--unit);
    z-index:2;
    display:flex;
    align-items:center;
    gap: calc(var(--icon-size) * 0.08);
  }
  .progress-dots .dot{
    width: calc(var(--icon-size) * 0.25);
    height: calc(var(--icon-size) * 0.25);
    border-radius:50%;
    background: var(--ink-muted);
    transition: background 150ms ease;
  }
  .progress-dots .dot.done{ background: var(--bright); }

  .celebration{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1;
  }
  .celebration-face{
    width:min(70vmin, 700px);
    height:auto;
    animation: bounce-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  @keyframes bounce-in{
    0%{ transform: scale(0); opacity:0; }
    100%{ transform: scale(var(--final-scale)); opacity:1; }
  }

  /* equation: Figma width 1188px height 327px, centered on both axes of the 1728x1117 frame */
  .equation-tap{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap: calc(var(--unit) * 2); }
  @media (min-width: 480px){
    .equation-tap{ flex-direction:row; flex-wrap:wrap; gap: calc(var(--unit) * 3); }
  }
  /* submit button: always pinned above the bottom icon row (btn-row on tablet/desktop,
     the slider tray on phone), never beside the equation */
  .submit-btn{
    position:absolute;
    left:var(--unit);
    bottom: calc(var(--unit) * 2 + var(--icon-size));
    z-index:4;
  }
  .submit-btn:active{ transform: translateZ(0) scale(0.94); }
  @media (min-width: 1200px){
    .submit-btn{ display:none; }
  }
  .equation-row{ position:relative; display:inline-block; }
  .equation{
    display:flex;
    align-items:baseline;
    flex-wrap:nowrap;
    justify-content:center;
    gap:0.15em;
    font-size: calc(var(--hero-size) * var(--eq-scale, 1));
    line-height:1.4864;
    color:var(--bright);
    max-width:94vw;
    transition: color 80ms ease;
  }
  .answer-slots{ display:inline-flex; }
  .answer-digit{ display:inline-block; min-width:0.62em; text-align:center; }
  .answer-digit.placeholder{ visibility:hidden; }
  .answer-digit.cursor{
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink{
    50%{ opacity:0; }
  }
  .answer-input{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    opacity:0;
    border:none;
    padding:0;
    margin:0;
    font-size:16px;
    cursor:text;
  }

  .submit-btn .fill-bg{ fill:var(--bright); }
  .submit-btn .fill-glyph{ fill:var(--ink); }
  .submit-btn:disabled{ opacity:0.4; cursor:default; }
  .submit-btn:disabled:active{ transform: translateZ(0); }

  /* ---------- phone: single scrollable slider-menu bar ---------- */
  /* max-height clause catches a phone in landscape (width alone would otherwise put
     it in the iPad-tuned tablet breakpoint above) — matches on width OR shortness. */
  @media (max-width: 767px), (max-height: 500px){
    :root{
      --hero-size: clamp(2.6rem, 16.5587vw, 140px); /* 65.08px on the 393px phone frame */
      --unit: 5.089vw; /* 20px on the 393px phone frame */
      --icon-size: clamp(52px, 20.5344vw, 100px); /* 80.71px on the 393px phone frame */
    }
    /* Idle: equation is dead-centered by body's own flex centering (untouched), submit
       button floats independently above the slider tray, left-aligned with it. */
    .submit-btn{
      position:absolute;
      left:var(--unit);
      bottom: calc(var(--unit) * 2 + var(--icon-size));
      top:auto;
      transform: translateZ(0);
    }
    .submit-btn:active{ transform: translateZ(0) scale(0.94); }
    /* Typing: let body's own flex-centering (below) place this, same mechanism as
       idle — reserving space below the equation for the button so the pair centers
       as a group. The button stays position:absolute in both states (never switches
       schemes) — aspect-ratio on .icon-btn now guarantees its rendered size exactly
       matches --icon-size, so this reservation can't under/overshoot the real size. */
    .equation-tap.active{
      position:relative;
      width:100%;
      z-index:4;
      padding-bottom: calc(var(--unit) + var(--icon-size));
    }
    .equation-tap.active .submit-btn{
      bottom:0;
    }
    /* position:fixed (not absolute) so it stays anchored to the true viewport,
       ignoring the keyboard-aware shrinking body height — it simply sits behind the
       keyboard when one is open, rather than trying to track above it. */
    .controls-slider{
      display:flex;
      align-items:flex-end;
      gap: calc(var(--icon-size) * 0.1239);
      position:fixed;
      left:var(--unit);
      right:var(--unit);
      bottom:var(--unit);
      z-index:3;
      background: rgba(32,32,32,0.4);
      border-radius:999px;
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    .controls-slider::-webkit-scrollbar{ display:none; }
    .op-group, .diff-group, .btn-row{ display:contents; }
    .progress-dots{ left:var(--unit); top:var(--unit); right:auto; bottom:auto; }
    /* Reserve room at the top for the progress dots in both states, so centering
       the remaining space always centers the equation below the dots.
       Idle: also reserve room at the bottom for the slider tray + independently-
       floating submit button. Typing: the tray is hidden behind the keyboard now
       (position:fixed, ignores the keyboard-aware body height), and the submit
       button's own space is reserved inside .equation-tap itself — so body only
       needs a small buffer to clear the keyboard, not the whole tray+button stack. */
    body{
      padding-top: calc(var(--unit) * 2 + var(--icon-size) * 0.25);
      padding-bottom: calc(var(--unit) * 3 + var(--icon-size) * 2);
    }
    body:has(.equation-tap.active){
      padding-bottom: calc(var(--unit) * 1.5);
    }
  }

  /* Phone in landscape: the sizing above is all vw-based (tuned for a tall portrait
     phone), so on a short, wide landscape screen it overshoots badly — the reserved
     top+bottom padding alone can exceed the entire viewport height. Switch to
     vh-based sizing here so everything scales against the constrained dimension. */
  @media (max-height: 500px) and (orientation: landscape){
    :root{
      --hero-size: clamp(2.2rem, 30vh, 140px);
      --unit: clamp(8px, 3.5vh, 14px);
      --icon-size: clamp(40px, 14vh, 64px);
    }
  }

  /* No game here is designed to work in phone landscape — rather than a half-broken
     cramped layout, block it outright with a plain "please rotate" screen. Matches
     the same phone-landscape condition already used elsewhere (a landscape tablet has
     enough height to stay excluded and keeps its normal, working layout). */
  .rotate-block{
    display:none;
    position:fixed;
    inset:0;
    background:var(--incorrect);
    z-index:9999;
    align-items:center;
    justify-content:center;
  }
  .rotate-block svg{ width:min(50vh, 320px); height:auto; }
  @media (max-height: 500px) and (orientation: landscape){
    .rotate-block{ display:flex; }
  }
</style>

<script>
(function(){
  "use strict";

  var TIER_MAX = { easy: 25, medium: 50, hard: 100 };

  var ROUND_SIZE = 10;
  var MAX_ATTEMPTS = 3;

  var state = {
    a: 0, b: 0, op: '+', answerValue: 0,
    input: '',
    activeOp: 'add',
    difficulty: 'easy',
    progress: 0,
    attempts: 0,
    busy: false
  };

  var els = {
    numA: document.getElementById('numA'),
    numB: document.getElementById('numB'),
    opSign: document.getElementById('opSign'),
    answerSlots: document.getElementById('answerSlots'),
    answerInput: document.getElementById('answerInput'),
    equation: document.getElementById('equation'),
    equationTap: document.querySelector('.equation-tap'),
    opGroup: document.getElementById('opGroup'),
    diffGroup: document.getElementById('diffGroup'),
    refreshBtn: document.getElementById('refreshBtn'),
    backBtn: document.getElementById('backBtn'),
    progressDots: document.querySelectorAll('#progressDots .dot'),
    celebration: document.getElementById('celebration'),
    submitBtn: document.getElementById('submitBtn'),
    controlsSlider: document.getElementById('controlsSlider')
  };

  var flashTimer = null;

  // Prevent icon buttons from stealing focus from the answer field, so the
  // on-screen keyboard stays open across submissions instead of closing and
  // failing to reopen (iOS/Android won't reliably reopen it from a delayed
  // programmatic focus() call outside a direct user gesture).
  // Uses 'mousedown' rather than 'pointerdown': preventDefault on pointerdown
  // is specced to also suppress the synthetic click that follows a touch tap,
  // which silently broke every icon button on touchscreens. Cancelling the
  // later 'mousedown' compatibility event still blocks the focus-shift
  // without swallowing the click.
  // Only guarded while the keyboard is actually open: the answer input stays
  // "focused" even after the keyboard is dismissed via its own hide control
  // (no blur fires), so if this kept blocking the focus-shift afterwards too,
  // the next tray tap would land as a touch on a still-focused input and iOS
  // would silently resurrect the keyboard — snapping the equation/submit
  // button into the typing layout for no visible reason.
  document.addEventListener('mousedown', function(e){
    if (e.target.closest('.icon-btn') && isKeyboardOpen()) {
      e.preventDefault();
    }
  });

  // document.activeElement alone can't tell us whether the on-screen keyboard is
  // actually visible: tapping an icon button never blurs the answer input (by design,
  // see the mousedown handler below), so it stays the "active element" forever once
  // focused once, even after the keyboard has been dismissed. Compare the live visual
  // viewport height against the tallest height seen so far with no keyboard open.
  // This can't just be captured once at load: mobile browsers grow/shrink their own
  // chrome (URL bar collapsing on scroll, etc.) well after the page loads, and a
  // stale baseline can then read as "keyboard open" from browser-chrome changes alone
  // — which was intermittently re-applying the typing-state layout after a plain tap
  // on a tray icon, with the keyboard already closed.
  var noKeyboardHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  function isKeyboardOpen(){
    if (!window.visualViewport) return false;
    return (noKeyboardHeight - window.visualViewport.height) > 150;
  }

  function updateAppHeight(){
    var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    if (h > noKeyboardHeight) noKeyboardHeight = h;
    document.documentElement.style.setProperty('--app-height', h + 'px');
  }
  updateAppHeight();
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', updateAppHeight);
    window.visualViewport.addEventListener('scroll', updateAppHeight);
  } else {
    window.addEventListener('resize', updateAppHeight);
  }

  // Rotating out of the phone-landscape rotate-block and back to portrait can
  // leave iOS's WebKit engine (Safari, Chrome, any iOS browser — Apple requires
  // them all to use it) rendering at the previous orientation's zoom/scale, so
  // the layout comes back oversized and spills past the screen edge. Toggling
  // the viewport meta wasn't enough to unstick it, so instead: reload outright
  // the moment the device leaves that blocked landscape state. A fresh load
  // can't inherit a stuck scale — there's nothing left to get stuck.
  var landscapeBlockMQ = window.matchMedia('(max-height:500px) and (orientation:landscape)');
  var wasInLandscapeBlock = landscapeBlockMQ.matches;
  function onLandscapeBlockChange(e){
    if (wasInLandscapeBlock && !e.matches) {
      location.reload();
    }
    wasInLandscapeBlock = e.matches;
  }
  if (landscapeBlockMQ.addEventListener) {
    landscapeBlockMQ.addEventListener('change', onLandscapeBlockChange);
  } else if (landscapeBlockMQ.addListener) {
    landscapeBlockMQ.addListener(onLandscapeBlockChange); // older Safari
  }

  // iOS's own "hide keyboard" control dismisses the keyboard without blurring the
  // input, so the focus/blur listeners below never fire and the layout stays stuck
  // in the typing state. Re-sync it directly off actual keyboard visibility whenever
  // the viewport changes, so it snaps back to the idle layout regardless of how the
  // keyboard was dismissed.
  function syncEquationActiveState(){
    els.equationTap.classList.toggle('active', isKeyboardOpen());
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', syncEquationActiveState);
  }

  function randInt(min, max){
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function newProblem(){
    var max = TIER_MAX[state.difficulty];
    var a, b, answer, op;

    if (state.activeOp === 'add') {
      op = '+';
      a = randInt(1, max - 1);
      b = randInt(1, max - a);
      answer = a + b;
    } else if (state.activeOp === 'sub') {
      op = '−';
      a = randInt(1, max);
      b = randInt(1, a);
      answer = a - b;
    } else if (state.activeOp === 'mul') {
      op = '×';
      var capA = Math.min(12, max);
      a = randInt(1, capA);
      var capB = Math.min(12, Math.floor(max / a));
      b = randInt(1, capB);
      answer = a * b;
    } else {
      op = '÷';
      var divisor = randInt(1, Math.min(12, max));
      var capQ = Math.min(12, Math.floor(max / divisor));
      var quotient = randInt(1, capQ);
      a = divisor * quotient;
      b = divisor;
      answer = quotient;
    }

    state.a = a; state.b = b; state.answerValue = answer;
    state.op = op;
    state.input = '';
    state.attempts = 0;
    els.answerInput.value = '';
    els.answerInput.maxLength = String(state.answerValue).length;
    render();
    if (isKeyboardOpen()) focusInput();
  }

  function focusInput(){
    try { els.answerInput.focus({ preventScroll: true }); } catch (e) { els.answerInput.focus(); }
  }

  function updateProgressDots(){
    els.progressDots.forEach(function(dot, i){
      dot.classList.toggle('done', i < state.progress);
    });
  }

  function restartRound(){
    state.progress = 0;
    updateProgressDots();
    newProblem();
  }

  function render(){
    els.numA.textContent = state.a;
    els.numB.textContent = state.b;
    els.opSign.textContent = state.op;

    var digitCount = String(state.answerValue).length;
    var cursorIndex = state.input.length;
    var html = '';
    for (var i = 0; i < digitCount; i++) {
      var ch = state.input.charAt(i);
      if (ch) {
        html += '<span class="num answer-digit">' + ch + '</span>';
      } else if (i === cursorIndex) {
        html += '<span class="num answer-digit cursor">_</span>';
      } else {
        html += '<span class="num answer-digit placeholder">_</span>';
      }
    }
    els.answerSlots.innerHTML = html;
    updateProgressDots();

    els.opGroup.querySelectorAll('.op-btn').forEach(function(btn){
      var op = btn.getAttribute('data-op');
      btn.classList.toggle('active', state.activeOp === op);
    });
    els.diffGroup.querySelectorAll('.diff-btn').forEach(function(btn){
      var tier = btn.getAttribute('data-tier');
      btn.classList.toggle('active', state.difficulty === tier);
    });

    els.submitBtn.disabled = state.busy || state.input.length === 0;
    fitEquationText();
  }

  // Occasionally a particular number combination renders wider than the equation's
  // own 94vw cap, which used to wrap it onto a second line. Instead, shrink it down
  // in small steps only as far as needed to fit on one line — most equations never
  // trigger this and render at full size exactly as before.
  function fitEquationText(){
    var el = els.equation;
    var maxWidth = window.innerWidth * 0.94;
    var scale = 1;
    el.style.setProperty('--eq-scale', scale);
    while (el.scrollWidth > maxWidth && scale > 0.5) {
      scale -= 0.02;
      el.style.setProperty('--eq-scale', scale);
    }
  }

  els.answerInput.addEventListener('input', function(){
    var digits = els.answerInput.value.replace(/[^0-9]/g, '');
    var maxLen = String(state.answerValue).length;
    if (digits.length > maxLen) digits = digits.slice(0, maxLen);
    state.input = digits;
    if (els.answerInput.value !== digits) els.answerInput.value = digits;
    render();
  });

  els.equation.addEventListener('click', focusInput);

  els.answerInput.addEventListener('focus', function(){
    els.equationTap.classList.add('active');
  });
  els.answerInput.addEventListener('blur', function(){
    els.equationTap.classList.remove('active');
  });

  function flashCorrect(){
    state.busy = true;
    clearTimeout(flashTimer);
    document.body.style.background = 'var(--success)';
    flashTimer = setTimeout(function(){
      state.progress += 1;
      updateProgressDots();
      if (state.progress >= ROUND_SIZE) {
        showCelebration();
      } else {
        document.body.style.background = '';
        state.busy = false;
        newProblem();
      }
    }, 700);
  }

  var CELEBRATION_FACE_SVG = '<svg class="celebration-face" viewBox="0 0 786.799 291.08" style="--final-scale:1;">' +
    '<path fill="var(--bright)" d="M583 101C583 127.56 578.2 152.2 568.6 174.92C558.68 197.96 545.08 218.12 527.8 235.4C510.2 253 489.88 266.6 466.84 276.2C443.8 286.12 419.16 291.08 392.92 291.08C366.36 291.08 341.72 286.12 319 276.2C295.96 266.6 275.8 253 258.52 235.4C240.92 218.12 227.32 197.96 217.72 174.92C207.8 152.2 202.84 127.56 202.84 101L223 101C223 124.68 227.48 146.76 236.44 167.24C245.08 187.72 257.24 205.64 272.92 221C288.28 236.68 306.2 248.84 326.68 257.48C347.16 266.44 369.24 270.92 392.92 270.92C416.6 270.92 438.68 266.44 459.16 257.48C479.64 248.84 497.72 236.68 513.4 221C528.76 205.64 540.92 187.72 549.88 167.24C558.52 146.76 562.84 124.68 562.84 101L583 101Z"/>' +
    '<path fill="var(--bright)" d="M751.759 72.96C741.999 72.96 733.679 69.6 726.799 62.88C720.079 56.16 716.719 47.44 716.719 36.72C716.719 25.84 720.079 17.04 726.799 10.32C733.679 3.44001 741.999 0 751.759 0C761.519 0 769.759 3.44001 776.479 10.32C783.359 17.04 786.799 25.84 786.799 36.72C786.799 47.44 783.359 56.16 776.479 62.88C769.759 69.6 761.519 72.96 751.759 72.96Z"/>' +
    '<path fill="var(--bright)" d="M35.04 72.96C25.28 72.96 16.96 69.6 10.08 62.88C3.36002 56.16 0 47.44 0 36.72C0 25.84 3.36002 17.04 10.08 10.32C16.96 3.44001 25.28 0 35.04 0C44.8 0 53.04 3.44001 59.76 10.32C66.64 17.04 70.08 25.84 70.08 36.72C70.08 47.44 66.64 56.16 59.76 62.88C53.04 69.6 44.8 72.96 35.04 72.96Z"/>' +
    '</svg>';

  function showCelebration(){
    els.celebration.innerHTML = CELEBRATION_FACE_SVG;
    els.equationTap.style.display = 'none';
    els.celebration.style.display = 'flex';
    flashTimer = setTimeout(function(){
      els.celebration.style.display = 'none';
      els.equationTap.style.display = '';
      document.body.style.background = '';
      state.progress = 0;
      state.busy = false;
      newProblem();
    }, 3000);
  }

  function flashIncorrect(){
    state.busy = true;
    clearTimeout(flashTimer);
    document.body.style.background = 'var(--incorrect)';
    flashTimer = setTimeout(function(){
      document.body.style.background = '';
      state.busy = false;
      if (state.attempts >= MAX_ATTEMPTS) {
        newProblem();
      } else {
        state.input = '';
        els.answerInput.value = '';
        render();
        focusInput();
      }
    }, 700);
  }

  function submitAnswer(){
    if (state.busy || state.input.length === 0) return;
    var guess = parseInt(state.input, 10);
    if (guess === state.answerValue) {
      flashCorrect();
    } else {
      state.attempts += 1;
      flashIncorrect();
    }
  }

  els.answerInput.addEventListener('keydown', function(e){
    if (e.key !== 'Enter') return;
    e.preventDefault();
    submitAnswer();
  });

  els.submitBtn.addEventListener('click', submitAnswer);

  els.opGroup.addEventListener('click', function(e){
    var btn = e.target.closest('.op-btn');
    if (!btn) return;
    var op = btn.getAttribute('data-op');
    if (op === state.activeOp) return; // already selected — don't reset the current problem
    state.activeOp = op;
    newProblem();
  });

  els.diffGroup.addEventListener('click', function(e){
    var btn = e.target.closest('.diff-btn');
    if (!btn) return;
    var tier = btn.getAttribute('data-tier');
    if (tier === state.difficulty) return; // already selected — don't reset the current problem
    state.difficulty = tier;
    newProblem();
  });

  els.refreshBtn.addEventListener('click', restartRound);
  els.backBtn.addEventListener('click', function(){ window.location.href = '../index.html'; });

  // First-visit only: gently peek-scroll the bottom slider tray so new users notice
  // it scrolls (there are more icons than fit on a phone screen), then ease back to
  // the correct resting view with + as the leftmost icon.
  function introduceTraySlider(){
    var el = els.controlsSlider;
    if (!el || window.innerWidth > 767) return;
    var STORAGE_KEY = 'math.traySliderIntroShown';
    try { if (localStorage.getItem(STORAGE_KEY)) return; } catch (e) {}
    var maxScroll = el.scrollWidth - el.clientWidth;
    if (maxScroll <= 0) return;
    var reveal = Math.min(maxScroll, el.clientWidth * 0.6);
    el.scrollLeft = reveal;
    var duration = 1800;
    var start = null;
    function easeInOutCubic(t){
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }
    function step(ts){
      if (start === null) start = ts;
      var elapsed = ts - start;
      if (elapsed >= duration) {
        el.scrollLeft = 0;
        try { localStorage.setItem(STORAGE_KEY, '1'); } catch (e) {}
        return;
      }
      el.scrollLeft = reveal * (1 - easeInOutCubic(elapsed / duration));
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  setTimeout(introduceTraySlider, 500);

  newProblem();
})();
</script>
