<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Play and Learn</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root{
    --hub-bg:#212121;
    --tile-bg:rgba(0,0,0,0.5);
    --tt-cell-bg:#707EFF;
    --math-badge:#9702D7;
    --dots-badge:#DA2296;
    --glyph:#E4E4E4;
    --win:#04D052;
    --tile-gap:10px;
  }

  @media (min-width:1367px){
    :root{ --tile-gap:20px; }
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    position:relative;
    margin:0;
    min-height: var(--app-height, 100vh);
    background:var(--hub-bg);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select:none;
    user-select:none;
    padding: 20px;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  .tiles{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:var(--tile-gap);
  }
  @media (min-width:768px) and (max-width:1023px) and (min-height:501px){
    .tiles{ grid-template-columns:repeat(4, 1fr); }
  }
  @media (min-width:1024px) and (max-width:1366px) and (min-height:500px){
    .tiles{ grid-template-columns:repeat(5, 1fr); }
  }
  @media (min-width:1367px){
    .tiles{ grid-template-columns:repeat(auto-fill, minmax(321px, 1fr)); }
  }
  /* Phone landscape: several rounds of trying to reflow the grid to fit (4 columns,
     then 3) each fixed one overflow only to reveal another (vertical, then
     horizontal) that couldn't be confirmed fixed without a real device to test on.
     Matches the game sub-pages' approach instead: don't try to fit the grid at all,
     just block the view with a plain "please rotate" screen. */
  .rotate-block{
    display:none;
    position:fixed;
    inset:0;
    background:#ED2B2E;
    z-index:9999;
    align-items:center;
    justify-content:center;
  }
  .rotate-block svg{ width:min(50vh, 320px); height:auto; }
  @media (max-height:500px) and (min-width:500px) and (orientation:landscape){
    .rotate-block{ display:flex; }
  }

  .tile{
    aspect-ratio:1 / 1;
    border-radius:3.1024%;
    background:var(--tile-bg);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  a.tile{
    cursor:pointer;
    text-decoration:none;
    transition:transform 120ms ease;
  }
  a.tile:active{ transform:scale(0.96); }
  @media (hover:hover) and (pointer:fine){
    a.tile:hover{ transform:scale(1.035); }
  }

  .badge{
    position:relative;
    width:62.057%;
    height:62.057%;
  }
  .badge svg{ position:absolute; inset:0; margin:auto; display:block; opacity:0; }

  .math-badge{ background:var(--math-badge); border-radius:50%; }
  .math-badge svg{ width:100%; height:100%; }

  .dots-badge{ background:var(--dots-badge); border-radius:2.655%; }
  .dots-badge svg{ width:100%; height:100%; opacity:1; }
  .dots-badge .dot{ fill:var(--glyph); }
  .dots-badge .connect-line{ stroke:var(--glyph); stroke-width:2; }
  .dots-badge .ring{ fill:none; stroke:var(--glyph); transform-box:fill-box; transform-origin:center; animation: ring-breathe 1.8s ease-in-out infinite; }
  .dots-badge .ring.outer{ animation-delay:0.3s; }

  @keyframes ring-breathe{
    0%,100%{ opacity:0.9; transform:scale(1); }
    50%{ opacity:0.5; transform:scale(1.12); }
  }

  /* Previews connecting A -> B -> C, matching the real game's moveCurrentMarker():
     the ring marks the dot just reached (not the next target), and it snaps there
     — no sliding — at the exact same moment that dot's connecting line starts
     drawing in, running in parallel with it rather than waiting for the line to
     finish. Loop resets straight back to A at the end. */
  .dots-badge .connect-line.seg-ab{ stroke-dasharray:148; animation: dots-draw-ab 4.5s ease-in-out infinite; }
  .dots-badge .connect-line.seg-bc{ stroke-dasharray:96; animation: dots-draw-bc 4.5s ease-in-out infinite; }
  .dots-badge .ring-group{ animation: dots-ring-move 4.5s step-end infinite; }

  @keyframes dots-draw-ab{
    0%, 4%{ stroke-dashoffset:148; }
    22%, 100%{ stroke-dashoffset:0; }
  }
  @keyframes dots-draw-bc{
    0%, 48%{ stroke-dashoffset:96; }
    66%, 100%{ stroke-dashoffset:0; }
  }
  @keyframes dots-ring-move{
    0%{ transform:translate(0,0); }
    4%{ transform:translate(125px,79px); }
    48%{ transform:translate(45px,132px); }
    100%{ transform:translate(45px,132px); }
  }

  .puzzle-badge .pz-frame{ position:absolute; inset:0; width:100%; height:100%; display:block; opacity:0; animation: pz-fade3 4.5s ease-in-out infinite; }
  .puzzle-badge .pz-frame:nth-child(1){ animation-delay:0s; }
  .puzzle-badge .pz-frame:nth-child(2){ animation-delay:-1.5s; }
  .puzzle-badge .pz-frame:nth-child(3){ animation-delay:-3s; }

  @keyframes pz-fade3{
    0%{ opacity:1; }
    28%{ opacity:1; }
    33%{ opacity:0; }
    95%{ opacity:0; }
    100%{ opacity:1; }
  }

  @keyframes fade4{
    0%{ opacity:1; }
    20%{ opacity:1; }
    25%{ opacity:0; }
    95%{ opacity:0; }
    100%{ opacity:1; }
  }
  .math-badge svg{ animation: fade4 4.8s ease-in-out infinite; }
  .math-badge svg:nth-child(2){ animation-delay:-1.2s; }
  .math-badge svg:nth-child(3){ animation-delay:-2.4s; }
  .math-badge svg:nth-child(4){ animation-delay:-3.6s; }

  .mini-board{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    gap: 2.6525%;
    width:62.057%;
    height:62.057%;
  }
  .mini-cell{
    background:var(--tt-cell-bg);
    border-radius: 8.404%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .mini-cell svg{ width:100%; height:100%; display:block; }

  @keyframes tt-o3-appear{
    0%{ opacity:0; }
    28%{ opacity:0; }
    33%{ opacity:1; }
    100%{ opacity:1; }
  }
  @keyframes tt-x8-appear{
    0%{ opacity:0; }
    61%{ opacity:0; }
    66%{ opacity:1; }
    100%{ opacity:1; }
  }
  @keyframes tt-diag-win-bg{
    0%{ background-color:var(--tt-cell-bg); }
    61%{ background-color:var(--tt-cell-bg); }
    66%{ background-color:var(--win); }
    100%{ background-color:var(--win); }
  }
  .mc-diag-bg{ animation: tt-diag-win-bg 4.5s ease-in-out infinite; }
  .mc-o3-appear{ opacity:0; animation: tt-o3-appear 4.5s ease-in-out infinite; }
  .mc-x8-appear{ opacity:0; animation: tt-x8-appear 4.5s ease-in-out infinite; }

  /* Previews the core memory-match mechanic: two tiles flip over at once to
     reveal they're NOT a matching pair (different glyphs), then flip back down. */
  .memory-badge{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    grid-template-rows:repeat(2, 1fr);
    gap: 4%;
  }
  .mem-cell{ position:relative; border-radius:14%; background:#F37745; }
  .mem-cell.mem-flip{ background:none; perspective:300px; }
  .mem-inner{
    position:absolute; inset:0;
    transform-style:preserve-3d;
    animation-duration: 4.5s;
    animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);
    animation-iteration-count: infinite;
  }
  /* Flip one tile up, then the other shortly after — like actually picking two
     tiles in the game, not both at once — hold both revealed together (so the
     mismatch reads clearly), then flip both back down together. */
  .mem-flip-a .mem-inner{ animation-name: mem-flip-a; }
  .mem-flip-b .mem-inner{ animation-name: mem-flip-b; }
  .mem-face{
    position:absolute; inset:0;
    border-radius:14%;
    backface-visibility:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .mem-face.back{ background:#F37745; }
  .mem-face.front{ transform:rotateY(180deg); }
  /* Overrides every property the generic .badge svg rule sets (position/inset/
     margin/opacity, meant for the math-badge's fade sequence) — it cascades onto
     any svg inside .badge, including this one, and would otherwise leave the
     glyph permanently invisible and stripped out of flow. */
  .mem-face.front svg{ position:static; inset:auto; margin:0; opacity:1; display:block; width:56%; height:56%; }

  @keyframes mem-flip-a{
    0%, 4%{ transform:rotateY(0deg); }
    20%, 68%{ transform:rotateY(180deg); }
    86%, 100%{ transform:rotateY(0deg); }
  }
  @keyframes mem-flip-b{
    0%, 22%{ transform:rotateY(0deg); }
    38%, 68%{ transform:rotateY(180deg); }
    86%, 100%{ transform:rotateY(0deg); }
  }

  /* Othello: the green cells and black gap-lines (matching the exported badge
     assets, Figma node 45:2489) stay completely solid/static — only the two
     discs that actually change (top-left, bottom-right — white at the real
     game's start, per newBoard()) animate, flipping from white to black in
     sequence (same rotateY technique as the real game) before snapping back to
     the opening on loop. The other two (top-right, bottom-left — black from the
     start) never change, so they're just plain static circles. */
  .othello-badge{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    grid-template-rows:repeat(2, 1fr);
    gap:2px;
    background:#000;
  }
  .oth-cell{ background:#04D052; display:flex; align-items:center; justify-content:center; }
  .oth-disc-static{ width:88.7%; aspect-ratio:1; border-radius:50%; background:#111111; }
  .oth-disc-flip{ position:relative; width:88.7%; aspect-ratio:1; perspective:300px; }
  .oth-disc-flip-inner{
    position:absolute; inset:0;
    transform-style:preserve-3d;
    animation-duration:4.5s;
    animation-timing-function:cubic-bezier(0.45, 0.05, 0.55, 0.95);
    animation-iteration-count:infinite;
  }
  .oth-disc-tl .oth-disc-flip-inner{ animation-name:oth-flip-tl; }
  .oth-disc-br .oth-disc-flip-inner{ animation-name:oth-flip-br; }
  .oth-disc-face{ position:absolute; inset:0; border-radius:50%; backface-visibility:hidden; }
  .oth-disc-face.white{ background:#E4E4E4; }
  .oth-disc-face.black{ background:#111111; transform:rotateY(180deg); }

  /* Top-left flips first (opening -> three captured), bottom-right flips later
     (three captured -> full sweep); both hold black the rest of the loop, then
     the animation's own loop restart snaps each straight back to white. */
  @keyframes oth-flip-tl{
    0%, 32%{ transform:rotateY(0deg); }
    38%, 100%{ transform:rotateY(180deg); }
  }
  @keyframes oth-flip-br{
    0%, 64%{ transform:rotateY(0deg); }
    70%, 100%{ transform:rotateY(180deg); }
  }
</style>
</head>
<body>

        <div class="mini-cell mc-diag-bg"><svg viewBox="0 0 63.13 63.13"><path fill="var(--glyph)" d="M11.7441 15.3563L15.3559 11.7444L31.6092 27.9977L47.8625 11.7444L51.4744 15.3563L35.2211 31.6096L51.4744 47.8629L47.8625 51.4747L31.6092 35.2214L15.3559 51.4747L11.7441 47.8629L27.9974 31.6096L11.7441 15.3563Z"/></svg></div>

<script>
(function(){
  "use strict";
  function updateAppHeight(){
    var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty('--app-height', h + 'px');
  }
  updateAppHeight();
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', updateAppHeight);
    window.visualViewport.addEventListener('scroll', updateAppHeight);
  } else {
    window.addEventListener('resize', updateAppHeight);
  }

  // Rotating out of the phone-landscape rotate-block and back to portrait can
  // leave iOS's WebKit engine (Safari, Chrome, any iOS browser — Apple requires
  // them all to use it) rendering at the previous orientation's zoom/scale, so
  // the grid comes back oversized and spills past the screen edge. Toggling the
  // viewport meta wasn't enough to unstick it, so instead: reload outright the
  // moment the device leaves that blocked landscape state. A fresh load can't
  // inherit a stuck scale — there's nothing left to get stuck.
  var landscapeBlockMQ = window.matchMedia('(max-height:500px) and (min-width:500px) and (orientation:landscape)');
  var wasInLandscapeBlock = landscapeBlockMQ.matches;
  function onLandscapeBlockChange(e){
    if (wasInLandscapeBlock && !e.matches) {
      location.reload();
    }
    wasInLandscapeBlock = e.matches;
  }
  if (landscapeBlockMQ.addEventListener) {
    landscapeBlockMQ.addEventListener('change', onLandscapeBlockChange);
  } else if (landscapeBlockMQ.addListener) {
    landscapeBlockMQ.addListener(onLandscapeBlockChange); // older Safari
  }
})();
</script>
