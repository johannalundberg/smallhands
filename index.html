<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kids Learning</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root{
    --hub-bg:#212121;
    --tile-bg:rgba(0,0,0,0.5);
    --tt-cell-bg:#707EFF;
    --math-badge:#9702D7;
    --dots-badge:#DA2296;
    --glyph:#E4E4E4;
    --win:#04D052;
    --tile-gap:10px;
  }

  @media (min-width:1367px){
    :root{ --tile-gap:20px; }
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    position:relative;
    margin:0;
    min-height: var(--app-height, 100vh);
    background:var(--hub-bg);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select:none;
    user-select:none;
    padding: 20px;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  .tiles{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:var(--tile-gap);
  }
  @media (min-width:768px) and (max-width:1023px) and (min-height:501px){
    .tiles{ grid-template-columns:repeat(4, 1fr); }
  }
  @media (min-width:1024px) and (max-width:1366px) and (min-height:500px){
    .tiles{ grid-template-columns:repeat(5, 1fr); }
  }
  @media (min-width:1367px){
    .tiles{ grid-template-columns:repeat(auto-fill, minmax(321px, 1fr)); }
  }
  /* Phone landscape: several rounds of trying to reflow the grid to fit (4 columns,
     then 3) each fixed one overflow only to reveal another (vertical, then
     horizontal) that couldn't be confirmed fixed without a real device to test on.
     Matches the game sub-pages' approach instead: don't try to fit the grid at all,
     just block the view with a plain "please rotate" screen. */
  .rotate-block{
    display:none;
    position:fixed;
    inset:0;
    background:#ED2B2E;
    z-index:9999;
    align-items:center;
    justify-content:center;
  }
  .rotate-block svg{ width:min(50vh, 320px); height:auto; }
  @media (max-height:500px) and (orientation:landscape){
    .rotate-block{ display:flex; }
  }

  .tile{
    aspect-ratio:1 / 1;
    border-radius:3.1024%;
    background:var(--tile-bg);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  a.tile{
    cursor:pointer;
    text-decoration:none;
    transition:transform 120ms ease;
  }
  a.tile:active{ transform:scale(0.96); }
  @media (hover:hover) and (pointer:fine){
    a.tile:hover{ transform:scale(1.035); }
  }

  .badge{
    position:relative;
    width:62.057%;
    height:62.057%;
  }
  .badge svg{ position:absolute; inset:0; margin:auto; display:block; opacity:0; }

  .math-badge{ background:var(--math-badge); border-radius:50%; }
  .math-badge svg{ width:100%; height:100%; }

  .dots-badge{ background:var(--dots-badge); border-radius:2.655%; }
  .dots-badge svg{ width:100%; height:100%; opacity:1; }
  .dots-badge .dot{ fill:var(--glyph); }
  .dots-badge .connect-line{ stroke:var(--glyph); stroke-width:2; }
  .dots-badge .ring{ fill:none; stroke:var(--glyph); transform-box:fill-box; transform-origin:center; animation: ring-breathe 1.8s ease-in-out infinite; }
  .dots-badge .ring.outer{ animation-delay:0.3s; }

  @keyframes ring-breathe{
    0%,100%{ opacity:0.9; transform:scale(1); }
    50%{ opacity:0.5; transform:scale(1.12); }
  }

  .puzzle-badge .pz-frame{ position:absolute; inset:0; width:100%; height:100%; display:block; opacity:0; animation: pz-fade3 4.5s ease-in-out infinite; }
  .puzzle-badge .pz-frame:nth-child(1){ animation-delay:0s; }
  .puzzle-badge .pz-frame:nth-child(2){ animation-delay:-1.5s; }
  .puzzle-badge .pz-frame:nth-child(3){ animation-delay:-3s; }

  @keyframes pz-fade3{
    0%{ opacity:1; }
    28%{ opacity:1; }
    33%{ opacity:0; }
    95%{ opacity:0; }
    100%{ opacity:1; }
  }

  @keyframes fade4{
    0%{ opacity:1; }
    20%{ opacity:1; }
    25%{ opacity:0; }
    95%{ opacity:0; }
    100%{ opacity:1; }
  }
  .math-badge svg{ animation: fade4 4.8s ease-in-out infinite; }
  .math-badge svg:nth-child(2){ animation-delay:-1.2s; }
  .math-badge svg:nth-child(3){ animation-delay:-2.4s; }
  .math-badge svg:nth-child(4){ animation-delay:-3.6s; }

  .mini-board{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    gap: 2.6525%;
    width:62.057%;
    height:62.057%;
  }
  .mini-cell{
    background:var(--tt-cell-bg);
    border-radius: 8.404%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .mini-cell svg{ width:100%; height:100%; display:block; }

  @keyframes tt-o3-appear{
    0%{ opacity:0; }
    28%{ opacity:0; }
    33%{ opacity:1; }
    100%{ opacity:1; }
  }
  @keyframes tt-x8-appear{
    0%{ opacity:0; }
    61%{ opacity:0; }
    66%{ opacity:1; }
    100%{ opacity:1; }
  }
  @keyframes tt-diag-win-bg{
    0%{ background-color:var(--tt-cell-bg); }
    61%{ background-color:var(--tt-cell-bg); }
    66%{ background-color:var(--win); }
    100%{ background-color:var(--win); }
  }
  .mc-diag-bg{ animation: tt-diag-win-bg 4.5s ease-in-out infinite; }
  .mc-o3-appear{ opacity:0; animation: tt-o3-appear 4.5s ease-in-out infinite; }
  .mc-x8-appear{ opacity:0; animation: tt-x8-appear 4.5s ease-in-out infinite; }
</style>
</head>
<body>

<script>
(function(){
  "use strict";
  function updateAppHeight(){
    var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty('--app-height', h + 'px');
  }
  updateAppHeight();
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', updateAppHeight);
    window.visualViewport.addEventListener('scroll', updateAppHeight);
  } else {
    window.addEventListener('resize', updateAppHeight);
  }

  // iOS Safari can get stuck rendering at the previous orientation's zoom/scale
  // after rotating back (a long-standing WebKit bug tied to user-scalable=no in
  // the viewport meta) — nudging the viewport meta's content forces it to
  // recompute layout at the correct scale. Listens on visualViewport's own
  // resize, not just orientationchange, since that event alone isn't reliably
  // firing (or firing late enough) on every device to catch this.
  var viewportOriginalContent = null;
  function fixOrientationZoom(){
    var viewport = document.querySelector('meta[name="viewport"]');
    if (!viewport) return;
    // captured once — re-reading the attribute on each call would risk capturing
    // an already-toggled value as "original" if two triggers overlap, permanently
    // stranding the page with user-scalable=yes
    if (viewportOriginalContent === null) viewportOriginalContent = viewport.getAttribute('content');
    viewport.setAttribute('content', viewportOriginalContent + ', user-scalable=yes');
    setTimeout(function(){
      viewport.setAttribute('content', viewportOriginalContent);
    }, 300);
  }
  window.addEventListener('orientationchange', fixOrientationZoom);
  if (window.visualViewport) {
    var orientationFixTimer = null;
    window.visualViewport.addEventListener('resize', function(){
      clearTimeout(orientationFixTimer);
      orientationFixTimer = setTimeout(fixOrientationZoom, 100);
    });
  }
})();
</script>
