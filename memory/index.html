<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Memory</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<style>
  :root{
    --bg:#3632F6;
    --bright:#E4E4E4;
    --ink:#202020;
    --ink-muted:rgba(32,32,32,0.4);
    --success:#04D052;
    --incorrect:#ED2B2E;
    --unit: 1.1574vw;
    --icon-size: clamp(44px, 8.912vw, 154px);
    --tile-gap: 12px; /* fallback only — JS recomputes this per board build to match Figma's ratio */
    /* Vertical space reserved above/below the grid for the icon rows — equal on
       desktop (diff-group top-right, btn-row bottom-left both take one band), but
       overridden asymmetrically on the phone tray breakpoint below, where only the
       bottom has anything in it. */
    --v-reserve-top: calc(var(--icon-size) + 2 * var(--unit));
    --v-reserve-bottom: calc(var(--icon-size) + 2 * var(--unit));
  }

  @media (min-width: 768px) and (max-width: 1023px) and (min-height: 501px){
    :root{
      --unit: 2.3981vw;
      --icon-size: clamp(80px, 11.4824vw, 120px);
    }
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    position:relative;
    margin:0;
    height: var(--app-height, 100vh);
    background:var(--bg);
    color:var(--bright);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select:none;
    user-select:none;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action:manipulation;
    transition: background 80ms ease;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  /* ---------- icon buttons (difficulty / back / refresh) ---------- */
  .icon-btn{
    appearance:none;
    background:none;
    border:none;
    cursor:pointer;
    width:var(--icon-size);
    height:var(--icon-size);
    aspect-ratio:1;
    border-radius:50%;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:none;
    transform: translateZ(0);
    -webkit-transform: translateZ(0);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    transition: transform 120ms ease;
  }
  .icon-btn:active{ transform: translateZ(0) scale(0.94); }
  @media (hover:hover) and (pointer:fine){
    .icon-btn:hover{ transform: translateZ(0) scale(1.035); }
  }
  .icon-btn svg{ width:100%; height:100%; display:block; }
  .icon-btn .fill-bg{ transition: fill 120ms ease; }

  .diff-group{ position:absolute; right:var(--unit); top:var(--unit); display:flex; gap:calc(var(--icon-size) * 0.1); z-index:2; }
  .diff-btn .fill-bg{ fill:var(--ink-muted); }
  .diff-btn.active .fill-bg{ fill:var(--bright); }

  .btn-row{ position:absolute; left:var(--unit); bottom:var(--unit); display:flex; gap:calc(var(--icon-size) * 0.1); z-index:2; }

  @media (min-width: 768px) and (max-width: 1023px) and (min-height: 501px){
    .diff-group, .btn-row{ gap: calc(var(--icon-size) * 0.1253); }
  }

  .controls-slider{ display:contents; }

  @keyframes bounce-in{
    0%{ transform:scale(0); opacity:0; }
    100%{ transform:scale(var(--final-scale)); opacity:1; }
  }
  .celebration{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:4;
  }
  .celebration-face{
    width:min(70vmin, 700px);
    height:auto;
    animation: bounce-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  /* ---------- the memory-match grid ---------- */
  .board-wrap{ width:100%; display:flex; align-items:center; justify-content:center; }
  .tile-grid{
    display:grid;
    grid-template-columns:repeat(var(--cols), 1fr);
    gap:var(--tile-gap);
    /* Fill as much of the reserved vertical space as possible: cap height to the
       viewport minus --v-reserve-top/bottom, then convert that height budget to a
       width via the tier's own aspect ratio — whichever of that, 94vw, or the
       outer safety cap is smallest wins. */
    width:min(94vw, calc((var(--app-height, 100vh) - var(--v-reserve-top) - var(--v-reserve-bottom)) * var(--aspect)), var(--grid-max));
  }
  .tile{
    position:relative;
    aspect-ratio:1;
    cursor:pointer;
    perspective:600px;
    transition: opacity 300ms ease, transform 300ms ease;
  }
  /* A matched pair clears away entirely a beat after the match (see onTileClick)
     so only the tiles still in play stay on screen, instead of sitting there
     dimmed as done. */
  .tile.gone{ opacity:0; transform:scale(0.8); pointer-events:none; }
  /* Found-a-pair feedback: bounce up bigger then settle, the same spring feel
     as the icon buttons growing on hover, just more pronounced. */
  .tile.pop{ animation: tile-pop 420ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes tile-pop{
    0%{ transform:scale(1); }
    45%{ transform:scale(1.18); }
    75%{ transform:scale(0.96); }
    100%{ transform:scale(1); }
  }
  .tile-inner{
    position:absolute; inset:0;
    transform-style:preserve-3d;
    transition: transform 550ms cubic-bezier(0.34, 1.2, 0.64, 1);
  }
  .tile.open .tile-inner, .tile.matched .tile-inner{ transform:rotateY(180deg); }
  .tile-face{
    position:absolute; inset:0;
    border-radius:14%;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  /* card back: flat placeholder orange (matches the Figma sketch) on every
     tile until it's flipped — the actual pair art only exists on the front
     face, so nothing here can leak which tile is which before a player picks it. */
  .tile-face.back{ background:#F37745; }
  .tile-face.front{ transform:rotateY(180deg); }

  .tile-shape{ position:relative; width:62%; height:62%; background:currentColor; }
  .shape-circle{ border-radius:50%; }
  .shape-square{ border-radius:18%; }
  .shape-triangle{ clip-path:polygon(50% 4%, 96% 96%, 4% 96%); }
  .shape-diamond{ clip-path:polygon(50% 2%, 98% 50%, 50% 98%, 2% 50%); }
  .shape-star{ clip-path:polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
  .shape-blob1{ border-radius:60% 40% 55% 45% / 55% 45% 60% 40%; }
  .shape-blob2{ border-radius:40% 60% 45% 55% / 60% 40% 55% 45%; }

  /* Placeholder "face" while the real tile art is being drawn — a pair of eyes
     that blink lazily whenever the tile is actually visible to a player (open
     or already matched). Paused while hidden so nothing wastes cycles or peeks
     through the back face. */
  .tile-eyes{ position:absolute; top:36%; left:0; right:0; display:flex; justify-content:center; gap:18%; }
  .tile-eye{
    width:14%;
    aspect-ratio:1;
    border-radius:50%;
    background:var(--ink);
    transform-origin:center;
    animation: tile-blink 4.2s ease-in-out infinite;
    animation-play-state:paused;
  }
  .tile.open .tile-eye, .tile.matched .tile-eye{ animation-play-state:running; }
  @keyframes tile-blink{
    0%, 92%, 100%{ transform:scaleY(1); }
    96%{ transform:scaleY(0.12); }
  }

  /* ---------- finished pair art (robot / snail / dino) ---------- */
  .tile-face.front svg{ width:100%; height:100%; display:block; }
  /* Adjacent 1x1 grid squares (antennae, legs, stalks) can show a hairline seam
     from anti-aliasing at the shared sub-pixel edge -- crisp (non-anti-aliased)
     edges remove it, and suit these blocky pixel-art shapes better anyway.
     Left off circles/paths so eyes and rounded bodies stay smoothly curved. */
  .tile-face.front svg rect{ shape-rendering:crispEdges; }
  @keyframes frameA{ 0%,49%{ opacity:1; } 50%,100%{ opacity:0; } }
  @keyframes frameB{ 0%,49%{ opacity:0; } 50%,100%{ opacity:1; } }
  .frame-a{ animation: frameA 0.7s steps(1) infinite; }
  .frame-b{ animation: frameB 0.7s steps(1) infinite; }
  /* Same idea as the placeholder eyes above: only animate while the tile is
     actually face-up, so a full board isn't cycling 28 animations at once. */
  .frame-a, .frame-b{ animation-play-state:paused; }
  .tile.open .frame-a, .tile.open .frame-b,
  .tile.matched .frame-a, .tile.matched .frame-b{ animation-play-state:running; }

  /* ---------- phone: single scrollable slider-menu bar ---------- */
  @media (max-width: 767px), (max-height: 500px){
    :root{
      --unit: 5.089vw;
      --icon-size: clamp(52px, 20.5344vw, 100px);
      /* Only the bottom has anything in it here (the tray) — reserve just a small
         breathing margin up top instead of a whole matching icon-sized band, so
         the grid centers between the true top of the screen and the tray, not
         the middle of the viewport. */
      --v-reserve-top: var(--unit);
      --v-reserve-bottom: calc(var(--unit) * 2 + var(--icon-size));
    }
    .controls-slider{
      display:flex;
      align-items:flex-end;
      gap: calc(var(--icon-size) * 0.1239);
      position:fixed;
      left:var(--unit);
      right:var(--unit);
      bottom:var(--unit);
      z-index:3;
      background: rgba(32,32,32,0.4);
      border-radius:999px;
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    .controls-slider::-webkit-scrollbar{ display:none; }
    .diff-group, .btn-row{ display:contents; }
    body{
      padding-top: var(--v-reserve-top);
      padding-bottom: var(--v-reserve-bottom);
    }
  }

  @media (max-height: 500px) and (min-width: 500px) and (orientation: landscape){
    :root{
      --unit: clamp(8px, 3.5vh, 14px);
      --icon-size: clamp(40px, 14vh, 64px);
    }
  }

  /* No game here is designed to work in phone landscape — rather than a half-broken
     cramped layout, block it outright with a plain "please rotate" screen. Matches
     the same phone-landscape condition already used elsewhere (a landscape tablet has
     enough height to stay excluded and keeps its normal, working layout). */
  .rotate-block{
    display:none;
    position:fixed;
    inset:0;
    background:var(--incorrect);
    z-index:9999;
    align-items:center;
    justify-content:center;
  }
  .rotate-block svg{ width:min(50vh, 320px); height:auto; }
  @media (max-height: 500px) and (min-width: 500px) and (orientation: landscape){
    .rotate-block{ display:flex; }
  }
</style>
</head>
<body>

  <div class="rotate-block">
    <svg viewBox="0 0 786.799 291.08">
      <g transform="translate(0,392.08) scale(1,-1)">
        <path fill="var(--bright)" d="M583 101C583 127.56 578.2 152.2 568.6 174.92C558.68 197.96 545.08 218.12 527.8 235.4C510.2 253 489.88 266.6 466.84 276.2C443.8 286.12 419.16 291.08 392.92 291.08C366.36 291.08 341.72 286.12 319 276.2C295.96 266.6 275.8 253 258.52 235.4C240.92 218.12 227.32 197.96 217.72 174.92C207.8 152.2 202.84 127.56 202.84 101L223 101C223 124.68 227.48 146.76 236.44 167.24C245.08 187.72 257.24 205.64 272.92 221C288.28 236.68 306.2 248.84 326.68 257.48C347.16 266.44 369.24 270.92 392.92 270.92C416.6 270.92 438.68 266.44 459.16 257.48C479.64 248.84 497.72 236.68 513.4 221C528.76 205.64 540.92 187.72 549.88 167.24C558.52 146.76 562.84 124.68 562.84 101L583 101Z"/>
      </g>
      <path fill="var(--bright)" d="M751.759 72.96C741.999 72.96 733.679 69.6 726.799 62.88C720.079 56.16 716.719 47.44 716.719 36.72C716.719 25.84 720.079 17.04 726.799 10.32C733.679 3.44001 741.999 0 751.759 0C761.519 0 769.759 3.44001 776.479 10.32C783.359 17.04 786.799 25.84 786.799 36.72C786.799 47.44 783.359 56.16 776.479 62.88C769.759 69.6 761.519 72.96 751.759 72.96Z"/>
      <path fill="var(--bright)" d="M35.04 72.96C25.28 72.96 16.96 69.6 10.08 62.88C3.36002 56.16 0 47.44 0 36.72C0 25.84 3.36002 17.04 10.08 10.32C16.96 3.44001 25.28 0 35.04 0C44.8 0 53.04 3.44001 59.76 10.32C66.64 17.04 70.08 25.84 70.08 36.72C70.08 47.44 66.64 56.16 59.76 62.88C53.04 69.6 44.8 72.96 35.04 72.96Z"/>
    </svg>
  </div>

  <div class="controls-slider" id="controlsSlider">
    <div class="diff-group" id="diffGroup">
      <button class="icon-btn diff-btn" data-tier="easy" aria-label="Easy">
        <svg viewBox="0 0 150 150"><path class="fill-bg" d="M75 8C37.9969 8 8 37.9969 8 75C8 112.003 37.9969 142 75 142C112.003 142 142 112.003 142 75L150 75C150 116.421 116.421 150 75 150C33.5786 150 -1.46777e-06 116.421 -3.27835e-06 75C-5.08894e-06 33.5786 33.5786 -1.46777e-06 75 -3.27835e-06C116.421 -5.08894e-06 150 33.5786 150 75L142 75C142 37.9969 112.003 8 75 8Z"/></svg>
      </button>
      <button class="icon-btn diff-btn" data-tier="medium" aria-label="Medium">
        <svg viewBox="0 0 150 150"><path class="fill-bg" d="M114 75C114 53.4609 96.5391 36 75 36C53.4609 36 36 53.4609 36 75C36 96.5391 53.4609 114 75 114V150C33.5786 150 0 116.421 0 75C0 33.5786 33.5786 0 75 0C116.421 0 150 33.5786 150 75C150 116.421 116.421 150 75 150V114C96.5391 114 114 96.5391 114 75Z"/></svg>
      </button>
      <button class="icon-btn diff-btn" data-tier="hard" aria-label="Hard">
        <svg viewBox="0 0 150 150"><circle class="fill-bg" cx="75" cy="75" r="75"/></svg>
      </button>
    </div>

    <div class="btn-row">
      <button class="icon-btn" id="backBtn" aria-label="Back">
        <svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="75" fill="var(--ink-muted)"/><path fill="var(--bright)" d="M36.0283 79.8692L33 77.207L35.8525 74.3565L66.2295 43.999L71.5732 49.3467L47.9971 72.9082L116 72.9082L116 80.1953L47.8467 80.1953L71.3975 100.906L66.4053 106.584L36.0283 79.8692Z"/></svg>
      </button>
      <button class="icon-btn" id="refreshBtn" aria-label="New game">
        <svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="75" fill="var(--ink-muted)"/><path fill="none" stroke="var(--bright)" stroke-width="8" d="M111.491 32.1671L112.864 53.5756L90.0895 53.5683"/><path fill="none" stroke="var(--bright)" stroke-width="7" d="M110.802 97.5619C106.102 105.702 98.8837 112.094 90.2343 115.774C81.5848 119.454 71.9735 120.223 62.8492 117.964C53.7249 115.705 45.5822 110.541 39.6485 103.251C33.7149 95.9607 30.312 86.9392 29.9527 77.5463C29.5935 68.1534 32.2974 58.8983 37.6569 51.1762C43.0164 43.454 50.7409 37.6834 59.666 34.7343C68.5911 31.7851 78.2331 31.8172 87.1383 34.8258C96.0436 37.8343 103.729 43.6563 109.037 51.4139"/></svg>
      </button>

  </div>

  <div class="board-wrap" id="boardWrap">
    <div class="tile-grid" id="tileGrid"></div>
  </div>

  <div class="celebration" id="celebration"></div>

<script>
(function(){
  "use strict";

  // mobileWidthPct caps the grid width to this percent of the viewport on the
  // phone breakpoint specifically (Figma phone frames 39:318/39:950/39:1110)
  // — easy's tiles read noticeably smaller there, medium slightly smaller, hard
  // is unrestricted (already right, per Johanna).
  var TIERS = {
    easy:   { cols:4, rows:2, maxW:847, mobileWidthPct:58 },
    medium: { cols:6, rows:3, maxW:1200, mobileWidthPct:83 },
    hard:   { cols:7, rows:4, maxW:1200, mobileWidthPct:null }
  };

  // Placeholder pair art for the pairs that don't have finished artwork yet: a
  // flat CSS shape (no SVG assets to swap later) plus a pair of eyes that
  // blink while the tile is face-up. 7 shapes x up to 2 colors each covers all
  // remaining pairs the hardest tier needs without repeating a shape+color combo.
  var SHAPES = ['circle', 'square', 'triangle', 'diamond', 'star', 'blob1', 'blob2'];
  var COLORS = ['#F37745', '#04D052', '#FFC93C', '#4FD3DA', '#B98BF2', '#FF6F91', '#8CE38C',
                '#F2789F', '#5FB0FF', '#FFA94D', '#6EE7B7', '#C084FC', '#FDBA74', '#67E8F9'];

  // Finished pair art: hand-drawn, animated SVGs on a 20x20 grid (one Figma
  // square = one unit), each on its own assigned background color. Every
  // shape is exact Figma source geometry, not an approximation -- where a
  // pair genuinely animates between two hand-authored states (not a uniform
  // transform), both frames are drawn in full and swapped with a hard cut via
  // the .frame-a/.frame-b classes above, since nothing simpler stays exact to
  // both. FILL is the icon's foreground; var(--bg) is swapped for the tile's
  // own background color below so an eye/cutout reads as "see-through".
  var ICON_FILL = '#181818';
  function iconSvg(inner){ return '<svg viewBox="0 0 20 20">' + inner + '</svg>'; }

  var REAL_ICONS = [
    { name: 'robot', bg: '#707EFF', svg: iconSvg(
      '<rect fill="' + ICON_FILL + '" x="3" y="7" width="14" height="9" rx="0.8"/>' +
      '<rect fill="' + ICON_FILL + '" x="8" y="6" width="1" height="1"/>' +
      '<rect fill="' + ICON_FILL + '" x="11" y="6" width="1" height="1"/>' +
      '<rect fill="' + ICON_FILL + '" x="12" y="5" width="1" height="1"/>' +
      '<rect fill="' + ICON_FILL + '" x="13" y="4" width="1" height="1"/>' +
      '<rect fill="' + ICON_FILL + '" x="14" y="3" width="1" height="1"/>' +
      '<g class="frame-a">' +
        '<rect fill="' + ICON_FILL + '" x="7" y="5" width="1" height="1"/>' +
        '<rect fill="' + ICON_FILL + '" x="6" y="4" width="1" height="1"/>' +
        '<rect fill="' + ICON_FILL + '" x="5" y="3" width="1" height="1"/>' +
      '</g>' +
      '<g class="frame-b">' +
        '<rect fill="' + ICON_FILL + '" x="9" y="5" width="1" height="1"/>' +
        '<rect fill="' + ICON_FILL + '" x="10" y="4" width="1" height="1"/>' +
        '<rect fill="' + ICON_FILL + '" x="11" y="3" width="1" height="1"/>' +
      '</g>' +
      '<circle fill="#FFFFFF" cx="7.5" cy="11.5" r="1.5"/>' +
      '<circle fill="#FFFFFF" cx="12.5" cy="11.5" r="1.5"/>'
    ) },
    { name: 'snail', bg: '#E4E4E4', svg: iconSvg(
      '<circle fill="' + ICON_FILL + '" cx="13.5" cy="10.5" r="5.5"/>' +
      '<circle fill="var(--bg)" cx="13.5" cy="10.5" r="1.5"/>' +
      '<rect fill="' + ICON_FILL + '" x="2" y="15" width="17" height="4" rx="1"/>' +
      '<rect fill="' + ICON_FILL + '" x="5" y="14" width="1" height="1"/>' +
      '<circle fill="#FFFFFF" cx="4" cy="16.5" r="0.5"/>' +
      '<g class="frame-a">' +
        '<rect fill="' + ICON_FILL + '" x="3" y="14" width="1" height="1.2"/>' +
        '<rect fill="' + ICON_FILL + '" x="5" y="13" width="1" height="1"/>' +
        '<rect fill="' + ICON_FILL + '" x="5" y="12" width="1" height="1"/>' +
        '<rect fill="' + ICON_FILL + '" x="2" y="13" width="1" height="1"/>' +
        '<rect fill="' + ICON_FILL + '" x="1" y="12" width="1" height="1"/>' +
      '</g>' +
      '<g class="frame-b">' +
        '<rect fill="' + ICON_FILL + '" x="3" y="14" width="1" height="1.2"/>' +
        '<rect fill="' + ICON_FILL + '" x="6" y="13" width="1" height="1"/>' +
        '<rect fill="' + ICON_FILL + '" x="7" y="12" width="1" height="1"/>' +
        '<rect fill="' + ICON_FILL + '" x="3" y="13" width="1" height="1.1"/>' +
        '<rect fill="' + ICON_FILL + '" x="3" y="12" width="1" height="1.1"/>' +
      '</g>'
    ) },
    { name: 'dino', bg: '#A7CF56', svg: iconSvg(
      '<path fill="' + ICON_FILL + '" d="M19,5 C19,5.55229 18.5523,6 18,6 L8,6 L8,2 C8,1.44772 8.44771,1 9,1 L18,1 C18.5523,1 19,1.44772 19,2 L19,5 Z"/>' +
      '<rect fill="' + ICON_FILL + '" x="13" y="7" width="4" height="1" rx="0.5"/>' +
      '<rect fill="' + ICON_FILL + '" x="8" y="5" width="6" height="3"/>' +
      '<rect fill="' + ICON_FILL + '" x="8" y="7.5" width="5" height="5"/>' +
      '<rect fill="' + ICON_FILL + '" x="7" y="8" width="5" height="5"/>' +
      '<rect fill="' + ICON_FILL + '" x="6" y="9" width="5" height="5"/>' +
      '<path fill="' + ICON_FILL + '" d="M12,15 C12,15.5523 11.5523,16 11,16 L5,16 L5,10 L12,10 L12,15 Z"/>' +
      '<path fill="' + ICON_FILL + '" d="M8,16 L4,16 C3.44771,16 3,15.5523 3,15 L3,11 L8,11 L8,16 Z"/>' +
      '<rect fill="' + ICON_FILL + '" x="1" y="10" width="2" height="3"/>' +
      '<rect fill="' + ICON_FILL + '" x="1" y="9" width="1" height="3"/>' +
      '<rect fill="' + ICON_FILL + '" x="2" y="11" width="2" height="2"/>' +
      '<rect fill="' + ICON_FILL + '" x="13" y="10" width="3" height="1"/>' +
      '<rect fill="' + ICON_FILL + '" x="15" y="11" width="1" height="1"/>' +
      '<circle fill="#FFFFFF" cx="11" cy="3" r="1"/>' +
      '<g class="frame-a">' +
        '<rect fill="' + ICON_FILL + '" x="3" y="17" width="3" height="1"/>' +
        '<rect fill="' + ICON_FILL + '" x="4" y="15.85" width="3" height="1.15"/>' +
        '<rect fill="' + ICON_FILL + '" x="3" y="18" width="1" height="1"/>' +
        '<rect fill="' + ICON_FILL + '" x="3" y="19" width="1" height="1"/>' +
        '<rect fill="' + ICON_FILL + '" x="4" y="19" width="1" height="1"/>' +
        '<rect fill="' + ICON_FILL + '" x="8" y="15" width="1" height="2"/>' +
        '<rect fill="' + ICON_FILL + '" x="9" y="15" width="1" height="2"/>' +
        '<rect fill="' + ICON_FILL + '" x="9" y="17" width="1" height="1"/>' +
        '<rect fill="' + ICON_FILL + '" x="9" y="18" width="1" height="1"/>' +
        '<rect fill="' + ICON_FILL + '" x="10" y="18" width="1" height="1"/>' +
      '</g>' +
      '<g class="frame-b">' +
        '<rect fill="' + ICON_FILL + '" x="4" y="15.2" width="3" height="1.8"/>' +
        '<rect fill="' + ICON_FILL + '" x="4" y="17" width="2" height="1"/>' +
        '<rect fill="' + ICON_FILL + '" x="4" y="18" width="1" height="1"/>' +
        '<rect fill="' + ICON_FILL + '" x="4" y="19" width="1" height="1"/>' +
        '<rect fill="' + ICON_FILL + '" x="5" y="19" width="1" height="1"/>' +
        '<rect fill="' + ICON_FILL + '" x="8" y="15.85" width="1" height="1.15"/>' +
        '<rect fill="' + ICON_FILL + '" x="9" y="15.85" width="1" height="1.15"/>' +
        '<rect fill="' + ICON_FILL + '" x="9" y="17" width="1" height="1"/>' +
        '<rect fill="' + ICON_FILL + '" x="10" y="17" width="1" height="1"/>' +
        '<rect fill="' + ICON_FILL + '" x="10" y="18" width="1" height="1"/>' +
        '<rect fill="' + ICON_FILL + '" x="11" y="18" width="1" height="1"/>' +
      '</g>'
    ) }
  ];

  function pairArt(i){
    if (i < REAL_ICONS.length) return { icon: REAL_ICONS[i] };
    return { shape: SHAPES[i % SHAPES.length], color: COLORS[i % COLORS.length] };
  }

  var state = {
    difficulty: 'easy',
    open: [],
    matched: 0,
    pairsNeeded: 4,
    busy: false
  };

  var els = {
    grid: document.getElementById('tileGrid'),
    boardWrap: document.getElementById('boardWrap'),
    celebration: document.getElementById('celebration'),
    diffGroup: document.getElementById('diffGroup'),
    backBtn: document.getElementById('backBtn'),
    refreshBtn: document.getElementById('refreshBtn'),
    controlsSlider: document.getElementById('controlsSlider')
  };

  function updateAppHeight(){
    var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty('--app-height', h + 'px');
  }
  updateAppHeight();
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', updateAppHeight);
    window.visualViewport.addEventListener('scroll', updateAppHeight);
  } else {
    window.addEventListener('resize', updateAppHeight);
  }

  // Rotating out of the phone-landscape rotate-block and back to portrait can
  // leave iOS's WebKit engine (Safari, Chrome, any iOS browser — Apple requires
  // them all to use it) rendering at the previous orientation's zoom/scale, so
  // the layout comes back oversized and spills past the screen edge. Reload
  // outright the moment the device leaves that blocked landscape state — a
  // fresh load can't inherit a stuck scale.
  var landscapeBlockMQ = window.matchMedia('(max-height:500px) and (min-width:500px) and (orientation:landscape)');
  var wasInLandscapeBlock = landscapeBlockMQ.matches;
  function onLandscapeBlockChange(e){
    if (wasInLandscapeBlock && !e.matches) {
      location.reload();
    }
    wasInLandscapeBlock = e.matches;
  }
  if (landscapeBlockMQ.addEventListener) {
    landscapeBlockMQ.addEventListener('change', onLandscapeBlockChange);
  } else if (landscapeBlockMQ.addListener) {
    landscapeBlockMQ.addListener(onLandscapeBlockChange); // older Safari
  }

  function shuffle(arr){
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  function makeTile(pairId){
    var art = pairArt(pairId);
    var tile = document.createElement('div');
    tile.className = 'tile';
    tile.dataset.pair = pairId;

    var inner = document.createElement('div');
    inner.className = 'tile-inner';

    var back = document.createElement('div');
    back.className = 'tile-face back';

    var front = document.createElement('div');
    front.className = 'tile-face front';

    if (art.icon) {
      front.style.background = art.icon.bg;
      front.innerHTML = art.icon.svg.replace(/var\(--bg\)/g, art.icon.bg);
    } else {
      front.style.color = art.color;

      var shape = document.createElement('div');
      shape.className = 'tile-shape shape-' + art.shape;

      var eyes = document.createElement('div');
      eyes.className = 'tile-eyes';
      var delay = ((pairId * 0.53) % 4).toFixed(2) + 's';
      for (var e = 0; e < 2; e++) {
        var eye = document.createElement('div');
        eye.className = 'tile-eye';
        eye.style.animationDelay = delay;
        eyes.appendChild(eye);
      }

      front.appendChild(shape);
      front.appendChild(eyes);
    }

    inner.appendChild(back);
    inner.appendChild(front);
    tile.appendChild(inner);

    tile.addEventListener('click', function(){ onTileClick(tile); });
    return tile;
  }

  // Matches the phone-slider-menu breakpoint below — on a narrow/short screen the
  // grid swaps to a portrait shape (more rows, fewer columns) per the updated phone
  // sketches, so tiles can grow to fill the tall narrow viewport instead of staying
  // landscape-shaped and leaving empty space above/below.
  var mobileMQ = window.matchMedia('(max-width: 767px), (max-height: 500px)');

  function buildBoard(){
    var tier = TIERS[state.difficulty];
    var cols = tier.cols, rows = tier.rows;
    if (mobileMQ.matches) { cols = tier.rows; rows = tier.cols; }
    var total = cols * rows;
    state.pairsNeeded = total / 2;
    state.open = [];
    state.matched = 0;
    state.busy = false;

    var ids = [];
    for (var p = 0; p < state.pairsNeeded; p++) { ids.push(p); ids.push(p); }
    shuffle(ids);

    els.grid.style.setProperty('--cols', cols);
    els.grid.style.setProperty('--aspect', cols / rows);
    var gridMax = tier.maxW;
    if (mobileMQ.matches && tier.mobileWidthPct) {
      gridMax = Math.min(gridMax, window.innerWidth * (tier.mobileWidthPct / 100));
    }
    els.grid.style.setProperty('--grid-max', gridMax + 'px');

    // Match the Figma sketch's gap-to-tile-size ratio (~8%) exactly at every tier and
    // breakpoint, rather than a flat gap that balloons proportionally on tiers with
    // smaller tiles. The grid's own width is fixed independently of gap (set purely by
    // the --v-reserve/aspect formula above), so it can be measured first and solved
    // backwards for the tile size a given gap would leave: cols*tile + (cols-1)*gap =
    // containerWidth, and gap = GAP_RATIO*tile.
    var GAP_RATIO = 0.08;
    var containerWidth = els.grid.getBoundingClientRect().width;
    var tileSize = containerWidth / (cols + GAP_RATIO * (cols - 1));
    els.grid.style.setProperty('--tile-gap', (tileSize * GAP_RATIO) + 'px');

    els.grid.innerHTML = '';
    for (var t = 0; t < total; t++) {
      els.grid.appendChild(makeTile(ids[t]));
    }
  }

  function onTileClick(tile){
    if (state.busy) return;
    if (tile.classList.contains('open') || tile.classList.contains('matched')) return;

    tile.classList.add('open');
    state.open.push(tile);
    if (state.open.length < 2) return;

    state.busy = true;
    var a = state.open[0], b = state.open[1];
    if (a.dataset.pair === b.dataset.pair) {
      a.classList.add('matched');
      b.classList.add('matched');
      a.classList.remove('open');
      b.classList.remove('open');
      a.classList.add('pop');
      b.classList.add('pop');
      setTimeout(function(){ a.classList.remove('pop'); b.classList.remove('pop'); }, 420);
      state.open = [];
      state.matched += 1;
      state.busy = false;
      var isFinalPair = state.matched >= state.pairsNeeded;
      // Give the player a beat to see the matched pair bounce before it clears
      // away, leaving only the still-unmatched tiles on screen.
      setTimeout(function(){
        a.classList.add('gone');
        b.classList.add('gone');
        if (isFinalPair) showCelebration();
      }, 750);
    } else {
      setTimeout(function(){
        a.classList.remove('open');
        b.classList.remove('open');
        state.open = [];
        state.busy = false;
      }, 1200);
    }
  }

  var CELEBRATION_FACE_SVG = '<svg class="celebration-face" viewBox="0 0 786.799 291.08" style="--final-scale:1;">' +
    '<path fill="var(--bright)" d="M583 101C583 127.56 578.2 152.2 568.6 174.92C558.68 197.96 545.08 218.12 527.8 235.4C510.2 253 489.88 266.6 466.84 276.2C443.8 286.12 419.16 291.08 392.92 291.08C366.36 291.08 341.72 286.12 319 276.2C295.96 266.6 275.8 253 258.52 235.4C240.92 218.12 227.32 197.96 217.72 174.92C207.8 152.2 202.84 127.56 202.84 101L223 101C223 124.68 227.48 146.76 236.44 167.24C245.08 187.72 257.24 205.64 272.92 221C288.28 236.68 306.2 248.84 326.68 257.48C347.16 266.44 369.24 270.92 392.92 270.92C416.6 270.92 438.68 266.44 459.16 257.48C479.64 248.84 497.72 236.68 513.4 221C528.76 205.64 540.92 187.72 549.88 167.24C558.52 146.76 562.84 124.68 562.84 101L583 101Z"/>' +
    '<path fill="var(--bright)" d="M751.759 72.96C741.999 72.96 733.679 69.6 726.799 62.88C720.079 56.16 716.719 47.44 716.719 36.72C716.719 25.84 720.079 17.04 726.799 10.32C733.679 3.44001 741.999 0 751.759 0C761.519 0 769.759 3.44001 776.479 10.32C783.359 17.04 786.799 25.84 786.799 36.72C786.799 47.44 783.359 56.16 776.479 62.88C769.759 69.6 761.519 72.96 751.759 72.96Z"/>' +
    '<path fill="var(--bright)" d="M35.04 72.96C25.28 72.96 16.96 69.6 10.08 62.88C3.36002 56.16 0 47.44 0 36.72C0 25.84 3.36002 17.04 10.08 10.32C16.96 3.44001 25.28 0 35.04 0C44.8 0 53.04 3.44001 59.76 10.32C66.64 17.04 70.08 25.84 70.08 36.72C70.08 47.44 66.64 56.16 59.76 62.88C53.04 69.6 44.8 72.96 35.04 72.96Z"/>' +
    '</svg>';

  function showCelebration(){
    document.body.style.background = 'var(--success)';
    els.celebration.innerHTML = CELEBRATION_FACE_SVG;
    els.boardWrap.style.display = 'none';
    els.celebration.style.display = 'flex';
    setTimeout(function(){
      els.celebration.style.display = 'none';
      els.boardWrap.style.display = '';
      document.body.style.background = '';
      buildBoard();
    }, 3000);
  }

  els.diffGroup.addEventListener('click', function(e){
    var btn = e.target.closest('.diff-btn');
    if (!btn) return;
    state.difficulty = btn.dataset.tier;
    els.diffGroup.querySelectorAll('.diff-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    buildBoard();
  });
  els.refreshBtn.addEventListener('click', buildBoard);
  els.backBtn.addEventListener('click', function(){ window.location.href = '../index.html'; });

  // Re-lay the grid in the right orientation if the viewport crosses the
  // mobile breakpoint (rotating a real device, or resizing a window).
  if (mobileMQ.addEventListener) {
    mobileMQ.addEventListener('change', buildBoard);
  } else if (mobileMQ.addListener) {
    mobileMQ.addListener(buildBoard); // older Safari
  }

  els.diffGroup.querySelector('[data-tier="easy"]').classList.add('active');
  buildBoard();
})();
</script>
</body>
</html>
