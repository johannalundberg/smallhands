  :root{
    --bg:#DA2296;
    --bright:#E4E4E4;
    --ink:#202020;
    --ink-muted:rgba(32,32,32,0.4);
    --success:#04D052;
    --incorrect:#ED2B2E;
    --line-complete:#111111;
    /* Figma frame: 1728x1117 */
    --hero-size: clamp(2.6rem, 13.3102vw, 230px);
    --unit: 1.1574vw;
    --icon-size: clamp(44px, 8.912vw, 154px);
    --canvas-size: min(88vmin, 88vw, 820px);
  }

  @media (min-width: 768px) and (max-width: 1023px) and (min-height: 501px){
    :root{
      --hero-size: clamp(90px, 14.4733vw, 150px);
      --unit: 2.3981vw;
      --icon-size: clamp(80px, 11.4824vw, 120px);
    }
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    position:relative;
    margin:0;
    height: var(--app-height, 100vh);
    background:var(--bg);
    color:var(--bright);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select:none;
    user-select:none;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action:manipulation;
    transition: background 80ms ease;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  .num{
    font-family:'Spline Sans Mono', ui-monospace, 'SF Mono', monospace;
    font-variant-numeric: tabular-nums slashed-zero;
    font-feature-settings: "zero" 1;
    font-weight:400;
  }

  /* ---------- icon buttons (difficulty / back / refresh) ---------- */
  .icon-btn{
    appearance:none;
    background:none;
    border:none;
    cursor:pointer;
    width:var(--icon-size);
    height:var(--icon-size);
    aspect-ratio:1;
    border-radius:50%;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:none;
    transform: translateZ(0);
    -webkit-transform: translateZ(0);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .icon-btn:active{ transform: translateZ(0) scale(0.94); }
  .icon-btn svg{ width:100%; height:100%; display:block; }
  .icon-btn .fill-bg{ transition: fill 120ms ease; }

  .diff-group{ position:absolute; right:var(--unit); top:var(--unit); display:flex; gap:calc(var(--icon-size) * 0.1); z-index:2; }
  .diff-btn .fill-bg{ fill:var(--ink-muted); }
  .diff-btn.active .fill-bg{ fill:var(--bright); }

  .btn-row{ position:absolute; left:var(--unit); bottom:var(--unit); display:flex; gap:calc(var(--icon-size) * 0.1); z-index:2; }

  @media (min-width: 768px) and (max-width: 1023px) and (min-height: 501px){
    .diff-group, .btn-row{ gap: calc(var(--icon-size) * 0.1253); }
  }

  .controls-slider{ display:contents; }

  /* ---------- the connect-the-dots canvas ---------- */
  .dots-canvas-wrap{ position:relative; width:var(--canvas-size); height:var(--canvas-size); }
  .dots-canvas{ width:100%; height:100%; display:block; overflow:visible; }

  /* Dot, gap, rings and number are all literal Figma pixel values (12px dot,
     8px gap, 20px/26px bullseye rings, 28px type) — fixed regardless of the
     canvas's viewBox zoom, matching design exactly rather than scaling with it. */
  .dots-labels{ position:absolute; inset:0; pointer-events:none; }
  .dot-point{
    position:absolute;
    display:flex;
    align-items:center;
    gap:8px;
    padding:16px;
    margin:-16px;
    /* without this, the -50% in the translate below is measured against the
       border box (content + the 16px hit-area padding), overshooting the
       vertical centering by exactly that padding. */
    transform-box: content-box;
    pointer-events:auto;
    cursor:pointer;
    transition:opacity 300ms ease;
  }
  .dot-point.reveal-hide{ opacity:0; pointer-events:none; }

  .dot-bullet-wrap{ position:relative; flex:none; width:12px; height:12px; }
  .dot-bullet{ width:12px; height:12px; border-radius:50%; background:var(--bright); transition:background 150ms ease; }
  .dot-point.wrong .dot-bullet{ background:var(--incorrect); }

  .dot-label{ font-size:28px; color:var(--bright); white-space:nowrap; transition:color 150ms ease; }
  .dot-point.wrong .dot-label{ color:var(--incorrect); }

  /* bullseye marker on the dot the child most recently connected — shows
     where they are now, without giving away which number comes next. */
  .target-ring{
    position:absolute; top:50%; left:50%;
    border-radius:50%;
    border:1px solid var(--bright);
    transform:translate(-50%,-50%);
    animation: ring-breathe 1.8s ease-in-out infinite;
  }
  .target-ring.r1{ width:20px; height:20px; }
  .target-ring.r2{ width:26px; height:26px; animation-delay:0.3s; }

  @keyframes ring-breathe{
    0%,100%{ opacity:0.9; transform:translate(-50%,-50%) scale(1); }
    50%{ opacity:0.5; transform:translate(-50%,-50%) scale(1.12); }
  }

  .dot-line{ stroke:var(--bright); fill:none; stroke-width:2; stroke-linecap:round; vector-effect:non-scaling-stroke; transition: stroke-dashoffset 350ms ease, stroke 900ms ease; }
  .dot-line.complete{ stroke:var(--line-complete); }

  /* ---------- phone: single scrollable slider-menu bar ---------- */
  @media (max-width: 767px), (max-height: 500px){
    :root{
      --hero-size: clamp(2.6rem, 16.5587vw, 140px);
      --unit: 5.089vw;
      --icon-size: clamp(52px, 20.5344vw, 100px);
    }
    .controls-slider{
      display:flex;
      align-items:flex-end;
      gap: calc(var(--icon-size) * 0.1239);
      position:fixed;
      left:var(--unit);
      right:var(--unit);
      bottom:var(--unit);
      z-index:3;
      background: rgba(32,32,32,0.4);
      border-radius:999px;
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    .controls-slider::-webkit-scrollbar{ display:none; }
    .diff-group, .btn-row{ display:contents; }
    body{
      padding-top: calc(var(--unit) * 2 + var(--icon-size));
      padding-bottom: calc(var(--unit) * 2 + var(--icon-size));
    }
  }

  @media (max-height: 500px) and (orientation: landscape){
    :root{
      --hero-size: clamp(2.2rem, 30vh, 140px);
      --unit: clamp(8px, 3.5vh, 14px);
      --icon-size: clamp(40px, 14vh, 64px);
    }
  }

  /* No game here is designed to work in phone landscape — rather than a half-broken
     cramped layout, block it outright with a plain "please rotate" screen. Matches
     the same phone-landscape condition already used elsewhere (a landscape tablet has
     enough height to stay excluded and keeps its normal, working layout). */
  .rotate-block{
    display:none;
    position:fixed;
    inset:0;
    background:var(--incorrect);
    z-index:9999;
    align-items:center;
    justify-content:center;
  }
  .rotate-block svg{ width:min(50vh, 320px); height:auto; }
  @media (max-height: 500px) and (orientation: landscape){
    .rotate-block{ display:flex; }
  }
</style>
</head>
<body>

  <div class="rotate-block">

  <div class="dots-canvas-wrap">
    <svg class="dots-canvas" id="dotsSvg" viewBox="0 0 200 200"></svg>
    <div class="dots-labels" id="dotsLabels"></div>
  </div>

<script>
(function(){
  "use strict";

  // Every shape is a closed loop of [x,y] points in a shared 0-200 viewBox,
  // numbered in the order a child should tap them. Tapping the last point
  // also draws the closing segment back to point 1.
  var SHAPES = {
    easy: [
      { points: [[171,91],[176,114],[173,137],[164,158],[148,176],[128,188],[105,193],[82,191],[60,182],[42,167],[30,147],[24,124],[26,101],[34,79],[54,62],[86,75],[93,22],[123,25],[138,46],[152,67]] }, // juicy apple
      { points: [[137,176],[118,188],[96,193],[73,191],[52,183],[35,168],[23,149],[17,127],[19,105],[27,84],[48,69],[59,42],[81,32],[104,55],[124,66],[152,60],[181,74],[179,104],[185,132],[156,161]] }, // cute rubber ducky
      { points: [[128,86],[163,85],[192,105],[163,125],[127,126],[139,158],[128,192],[100,171],[88,137],[61,158],[26,159],[37,125],[66,104],[37,85],[26,51],[61,52],[91,72],[100,39],[128,18],[139,52]] }, // simple starfish
      { points: [[145,94],[188,105],[143,122],[171,157],[124,144],[127,189],[97,151],[73,189],[70,140],[29,157],[55,116],[12,105],[57,88],[29,53],[76,66],[73,21],[103,59],[127,21],[130,70],[171,53]] }, // smiling sun
      { points: [[25,170],[50,186],[85,192],[115,190],[145,182],[175,163],[183,141],[189,119],[172,95],[150,65],[125,38],[100,20],[72,12],[85,40],[100,135],[65,60],[58,92],[50,130],[23,130],[12,150]] }, // classic sailboat
      { points: [[100,175],[32,159],[10,149],[22,128],[6,110],[26,96],[18,72],[42,68],[44,43],[68,49],[80,27],[100,42],[120,27],[132,49],[156,43],[158,68],[182,72],[174,96],[194,110],[178,128],[190,149],[168,159]] }, // slice of pizza
      { points: [[178,100],[165,121],[163,146],[140,155],[124,174],[100,168],[76,174],[60,155],[37,146],[35,121],[22,100],[35,79],[37,54],[60,45],[76,26],[100,32],[124,26],[140,45],[163,54],[165,79]] }, // bouncy beach ball
      { points: [[100,194],[76,191],[53,181],[34,166],[19,147],[9,124],[6,100],[9,76],[19,53],[34,34],[53,19],[76,9],[100,6],[89,31],[81,53],[77,76],[75,100],[77,124],[81,147],[89,169]] }, // crescent moon
      { points: [[20,92],[14,60],[20,35],[40,18],[65,8],[100,5],[135,8],[160,18],[180,35],[186,60],[180,92],[145,92],[126,112],[132,135],[128,163],[112,183],[88,183],[72,163],[74,112],[55,92]] }, // chubby mushroom
      { points: [[100,190],[128,168],[148,145],[170,127],[178,105],[179,82],[173,59],[161,40],[144,24],[123,14],[100,8],[77,14],[56,24],[39,40],[27,59],[21,82],[22,105],[30,127],[52,145],[72,168]] }, // single scoop ice cream
      { points: [[156,100],[148,128],[157,152],[129,150],[105,156],[90,187],[75,156],[49,149],[32,126],[24,100],[13,77],[46,77],[28,50],[53,45],[77,37],[100,43],[121,15],[129,57],[147,71],[188,79]] }, // cute little fish
      { points: [[22,95],[5,112],[27,122],[17,143],[40,145],[38,169],[61,163],[67,185],[86,172],[100,191],[114,172],[133,185],[139,163],[162,169],[160,145],[183,143],[173,122],[195,112],[178,95],[100,108]] }, // slice of watermelon
      { points: [[48,114],[32,95],[32,70],[62,63],[84,68],[89,42],[100,9],[111,42],[116,68],[138,63],[168,70],[168,95],[152,114],[134,129],[122,149],[121,193],[97,185],[74,181],[78,149],[66,129]] }, // classic tulip
      { points: [[100,15],[125,32],[141,53],[157,77],[166,103],[162,125],[187,156],[161,154],[134,157],[112,159],[100,180],[88,159],[66,157],[39,154],[13,156],[38,125],[34,103],[43,77],[59,53],[75,32]] }, // simple rocket ship
      { points: [[85,159],[64,151],[46,136],[34,117],[29,94],[32,71],[41,50],[57,34],[77,23],[100,19],[123,23],[143,34],[159,50],[168,71],[171,94],[166,117],[154,136],[136,151],[115,159],[100,182]] }, // playful balloon
      { points: [[39,89],[18,52],[60,53],[78,39],[100,35],[122,39],[140,53],[182,52],[161,89],[164,111],[180,129],[156,132],[142,150],[123,164],[100,190],[77,164],[58,150],[35,155],[44,132],[36,111]] }, // teddy bear face
      { points: [[126,188],[146,163],[128,144],[148,120],[156,98],[150,72],[172,50],[150,36],[130,26],[112,10],[94,26],[72,36],[48,50],[70,72],[66,98],[58,120],[76,144],[56,163],[76,188],[101,178]] }, // cupcake with cherry
      { points: [[28,142],[48,118],[36,90],[58,88],[70,112],[78,78],[92,60],[115,52],[138,60],[152,78],[162,108],[182,118],[188,140],[182,162],[163,142],[144,162],[110,162],[86,162],[67,142],[48,162]] }, // basic car outline
      { points: [[66,46],[72,9],[100,45],[128,9],[134,46],[155,59],[170,80],[174,105],[170,130],[157,153],[137,169],[114,172],[100,150],[86,172],[63,169],[43,153],[30,130],[26,105],[30,80],[45,59]] }, // simple ladybug
      { points: [[168,65],[152,95],[191,113],[148,119],[156,152],[137,166],[113,175],[89,175],[67,168],[46,154],[32,135],[48,105],[9,87],[52,81],[44,48],[63,34],[87,25],[111,25],[133,32],[154,46]] } // wrapped candy
    ],
    medium: [
      { points: [[100,10],[119.98,72.5],[185.6,72.2],[132.3,110.5],[152.9,172.8],[100,134],[47.1,172.8],[67.7,110.5],[14.4,72.2],[80,72.5]] }, // 5-point star
      { points: [[20,100],[45,70],[90,58],[108,35],[125,68],[175,45],[140,100],[175,155],[122,128],[100,155],[78,132],[45,130]] }, // fish
      { points: [[100,175],[148,132],[172,92],[152,55],[118,48],[100,78],[82,48],[48,55],[28,92],[52,132]] } // heart
    ],
    hard: [
      { points: [[100,8],[114,35],[122,62],[122,110],[122,140],[152,182],[130,168],[118,195],[100,165],[82,195],[70,168],[48,182],[78,140],[78,110],[78,62],[86,35]] }, // rocket
      { points: [[30,170],[170,170],[170,110],[155,75],[141,110],[127,55],[113,110],[100,35],[87,110],[73,55],[59,110],[45,75],[30,110]] }, // crown
      { points: [[20,185],[20,100],[37.5,75],[55,100],[55,130],[85,130],[85,160],[115,160],[115,130],[145,130],[145,100],[162.5,75],[180,100],[180,185]] } // castle
    ]
  };

  var NS = 'http://www.w3.org/2000/svg';

  var state = {
    difficulty: 'easy',
    shapeCursor: { easy: 0, medium: 0, hard: 0 },
    points: [],
    next: 0,
    busy: false
  };

  var els = {
    svg: document.getElementById('dotsSvg'),
    labels: document.getElementById('dotsLabels'),
    diffGroup: document.getElementById('diffGroup'),
    backBtn: document.getElementById('backBtn'),
    refreshBtn: document.getElementById('refreshBtn'),
    controlsSlider: document.getElementById('controlsSlider')
  };

  function updateAppHeight(){
    var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty('--app-height', h + 'px');
  }
  updateAppHeight();
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', updateAppHeight);
    window.visualViewport.addEventListener('scroll', updateAppHeight);
  } else {
    window.addEventListener('resize', updateAppHeight);
  }

  // iOS Safari can get stuck rendering at the previous orientation's zoom/scale
  // after rotating back (a long-standing WebKit bug tied to user-scalable=no in
  // the viewport meta) — nudging the viewport meta's content on orientationchange
  // forces it to recompute layout at the correct scale.
  function fixOrientationZoom(){
    var viewport = document.querySelector('meta[name="viewport"]');
    if (!viewport) return;
    var original = viewport.getAttribute('content');
    viewport.setAttribute('content', original + ', user-scalable=yes');
    setTimeout(function(){
      viewport.setAttribute('content', original);
    }, 300);
  }
  window.addEventListener('orientationchange', fixOrientationZoom);

  function svgEl(name, attrs){
    var el = document.createElementNS(NS, name);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  function pickNextShape(){
    var pool = SHAPES[state.difficulty];
    var cursor = state.shapeCursor[state.difficulty] % pool.length;
    state.shapeCursor[state.difficulty] = cursor + 1;
    return pool[cursor];
  }

  function newShape(){
    state.points = pickNextShape().points;
    state.next = 0;
    state.busy = false;
    els.svg.innerHTML = '';
    els.labels.innerHTML = '';
    for (var j = 0; j < state.points.length; j++) {
      els.labels.appendChild(makePoint(state.points[j], j));
    }
  }

  function makeLine(a, b){
    // vector-effect:non-scaling-stroke renders stroke-dasharray in real screen
    // pixels rather than viewBox units, so the draw-in length must be converted
    // to match — otherwise it repeats as a dashed pattern instead of one solid dash.
    var len = Math.hypot(b[0] - a[0], b[1] - a[1]);
    var scale = els.svg.getBoundingClientRect().width / 200;
    var pxLen = len * scale;
    var line = svgEl('line', {
      class: 'dot-line',
      x1: a[0], y1: a[1], x2: b[0], y2: b[1],
      'stroke-dasharray': pxLen, 'stroke-dashoffset': pxLen
    });
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ line.setAttribute('stroke-dashoffset', 0); });
    });
    return line;
  }

  function makePoint(p, index){
    var row = document.createElement('div');
    row.className = 'dot-point';
    row.dataset.index = index;
    row.style.left = (p[0] / 200 * 100) + '%';
    row.style.top = (p[1] / 200 * 100) + '%';
    // -6px = half the 12px dot, so the dot's center lands exactly on the point
    // (left/top alone would place the dot's left edge there instead).
    row.style.transform = 'translate(-6px, -50%)';

    var bulletWrap = document.createElement('div');
    bulletWrap.className = 'dot-bullet-wrap';
    var bullet = document.createElement('div');
    bullet.className = 'dot-bullet';
    bulletWrap.appendChild(bullet);

    var label = document.createElement('span');
    label.className = 'dot-label num';
    label.textContent = index + 1;

    row.appendChild(bulletWrap);
    row.appendChild(label);
    row.addEventListener('click', function(){ onDotTap(index); });
    return row;
  }

  function onDotTap(index){
    if (state.busy) return;
    if (index === state.next) {
      connectDot();
    } else {
      flashWrong(index);
    }
  }

  function flashWrong(index){
    var row = els.labels.querySelector('.dot-point[data-index="' + index + '"]');
    if (!row) return;
    row.classList.add('wrong');
    setTimeout(function(){ row.classList.remove('wrong'); }, 250);
  }

  function connectDot(){
    var justConnected = state.next;
    var previousCurrent = state.next - 1; // -1 means no dot was current yet

    state.next += 1;

    if (previousCurrent >= 0) {
      els.svg.appendChild(makeLine(state.points[previousCurrent], state.points[justConnected]));
    }
    moveCurrentMarker(previousCurrent, justConnected);

    if (state.next >= state.points.length) {
      els.svg.appendChild(makeLine(state.points[state.points.length - 1], state.points[0])); // closing segment
      onShapeComplete();
    }
  }

  // Moves the bullseye ring to the dot the child just connected, leaving every
  // earlier dot/line untouched so nothing re-plays its draw-in animation.
  function moveCurrentMarker(oldIndex, newIndex){
    if (oldIndex >= 0) {
      var oldWrap = els.labels.querySelector('.dot-point[data-index="' + oldIndex + '"] .dot-bullet-wrap');
      if (oldWrap) oldWrap.querySelectorAll('.target-ring').forEach(function(r){ r.remove(); });
    }
    var newWrap = els.labels.querySelector('.dot-point[data-index="' + newIndex + '"] .dot-bullet-wrap');
    if (!newWrap) return;
    var r1 = document.createElement('div');
    r1.className = 'target-ring r1';
    var r2 = document.createElement('div');
    r2.className = 'target-ring r2';
    newWrap.insertBefore(r2, newWrap.firstChild);
    newWrap.insertBefore(r1, newWrap.firstChild);
  }

  function onShapeComplete(){
    state.busy = true;
    document.body.style.background = 'var(--success)';
    els.labels.querySelectorAll('.dot-point').forEach(function(row){ row.classList.add('reveal-hide'); });
    els.svg.querySelectorAll('.dot-line').forEach(function(line){ line.classList.add('complete'); });
    setTimeout(function(){
      document.body.style.background = '';
      newShape();
    }, 2400);
  }

  els.diffGroup.addEventListener('click', function(e){
    var btn = e.target.closest('.diff-btn');
    if (!btn) return;
    var tier = btn.getAttribute('data-tier');
    if (tier === state.difficulty) return; // already selected — don't reset the current puzzle
    els.diffGroup.querySelectorAll('.diff-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    state.difficulty = tier;
    newShape();
  });

  els.refreshBtn.addEventListener('click', newShape);
  els.backBtn.addEventListener('click', function(){ window.location.href = '../index.html'; });

  // First-visit only: gently peek-scroll the bottom slider tray so new users notice
  // it scrolls (there are more icons than fit on a phone screen), then ease back to
  // the correct resting view with the easy-difficulty icon as the leftmost icon.
  function introduceTraySlider(){
    var el = els.controlsSlider;
    if (!el || window.innerWidth > 767) return;
    var STORAGE_KEY = 'dots.traySliderIntroShown';
    try { if (localStorage.getItem(STORAGE_KEY)) return; } catch (e) {}
    var maxScroll = el.scrollWidth - el.clientWidth;
    if (maxScroll <= 0) return;
    var reveal = Math.min(maxScroll, el.clientWidth * 0.6);
    el.scrollLeft = reveal;
    var duration = 1800;
    var start = null;
    function easeInOutCubic(t){
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }
    function step(ts){
      if (start === null) start = ts;
      var elapsed = ts - start;
      if (elapsed >= duration) {
        el.scrollLeft = 0;
        try { localStorage.setItem(STORAGE_KEY, '1'); } catch (e) {}
        return;
      }
      el.scrollLeft = reveal * (1 - easeInOutCubic(elapsed / duration));
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  setTimeout(introduceTraySlider, 500);

  els.diffGroup.querySelector('[data-tier="easy"]').classList.add('active');
  newShape();
})();
</script>

</body>
