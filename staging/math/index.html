<style>
  @font-face{
    font-family:'Spline Sans Mono';
    src: url('../../fonts/SplineSansMono.woff2') format('woff2');
    font-weight:400;
    font-style:normal;
  }

  :root{
    --bg:#8104C9;
    --bright:#E4E4E4;
    --ink:#202020;
    --ink-muted:rgba(32,32,32,0.4);
    --success:#04BA50;
    --incorrect:#EE3B3B;
    /* Figma frame: 1728x1117 */
    --hero-size: clamp(2.6rem, 13.3102vw, 230px); /* 230px on the 1728-wide frame */
    --unit: 1.1574vw; /* 20px margin/gap on the 1728-wide frame */
    --icon-size: clamp(44px, 8.912vw, 154px);
  }

  /* iPad Pro portrait: icons and equation text run bigger relative to width than the desktop curve gives */
  /* min-height guard excludes a phone in landscape (width lands in this range but
     height is short, e.g. 844x390) — that should get the phone slider-menu layout
     below, not this iPad-tuned four-corner one, which assumes far more height. */
  @media (min-width: 768px) and (max-width: 1023px) and (min-height: 501px){
    :root{
      --hero-size: clamp(90px, 14.4733vw, 150px); /* 120.71px on the 834-wide frame */
      --unit: 2.3981vw; /* 20px on the 834-wide iPad portrait frame */
      --icon-size: clamp(80px, 11.4824vw, 120px); /* 95.77px on the 834-wide frame */
    }
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; overflow:hidden; }
  body{
    position:relative;
    margin:0;
    height: var(--app-height, 100vh);
    background:var(--bg);
    color:var(--bright);
    -webkit-tap-highlight-color: transparent;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: background 80ms ease, padding-bottom 250ms ease;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  .num{
    font-family:'Spline Sans Mono', ui-monospace, 'SF Mono', monospace;
    font-variant-numeric: tabular-nums slashed-zero;
    font-feature-settings: "zero" 1;
    font-weight:400;
  }

  /* ---------- icon buttons (operation / difficulty / refresh) ---------- */
  .icon-btn{
    appearance:none;
    background:none;
    border:none;
    cursor:pointer;
    width:var(--icon-size);
    height:var(--icon-size);
    aspect-ratio:1;
    border-radius:50%;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:none;
    /* Force a stable, dedicated GPU compositing layer from the start, instead of
       letting the browser promote/demote one inconsistently — a classic fix for
       intermittent stale-paint/clipping glitches on rounded elements in WebKit. */
    transform: translateZ(0);
    -webkit-transform: translateZ(0);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    transition: transform 120ms ease;
  }
  .icon-btn:active{ transform: translateZ(0) scale(0.94); }
  @media (hover:hover) and (pointer:fine){
    .icon-btn:hover{ transform: translateZ(0) scale(1.035); }
  }
  .icon-btn svg{ width:100%; height:100%; display:block; }
  .icon-btn .fill-bg{ transition: fill 120ms ease; }
  .icon-btn .fill-glyph{ transition: fill 150ms ease; }

  .op-group{ position:absolute; left:var(--unit); top:var(--unit); display:flex; gap:calc(var(--icon-size) * 0.1); z-index:2; }
  .op-btn .fill-bg{ fill:var(--ink-muted); }
  .op-btn .fill-glyph{ fill:var(--bright); }
  .op-btn.active .fill-bg{ fill:var(--bright); }
  .op-btn.active .fill-glyph{ fill:var(--ink); }

  .diff-group{ position:absolute; right:var(--unit); top:var(--unit); display:flex; gap:calc(var(--icon-size) * 0.1); z-index:2; }
  .diff-btn .fill-bg{ fill:var(--ink-muted); }
  .diff-btn.active .fill-bg{ fill:var(--bright); }

  .btn-row{ position:absolute; left:var(--unit); bottom:var(--unit); display:flex; gap:calc(var(--icon-size) * 0.1); z-index:2; }

  /* iPad portrait: icon-group gap is proportionally wider than the desktop ratio */
  /* min-height guard excludes a phone in landscape (width lands in this range but
     height is short, e.g. 844x390) — that should get the phone slider-menu layout
     below, not this iPad-tuned four-corner one, which assumes far more height. */
  @media (min-width: 768px) and (max-width: 1023px) and (min-height: 501px){
    .op-group, .diff-group, .btn-row{ gap: calc(var(--icon-size) * 0.1253); }
  }

  .controls-slider{ display:contents; }

  .progress-dots{
    position:absolute;
    right:var(--unit);
    bottom:var(--unit);
    z-index:2;
    display:flex;
    align-items:center;
    gap: calc(var(--icon-size) * 0.08);
  }
  .progress-dots .dot{
    width: calc(var(--icon-size) * 0.25);
    height: calc(var(--icon-size) * 0.25);
    border-radius:50%;
    background: var(--ink-muted);
    transition: background 150ms ease;
  }
  .progress-dots .dot.done{ background: var(--bright); }

  .celebration{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1;
  }
  .celebration-face{
    width:min(70vmin, 700px);
    height:auto;
    animation: bounce-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  @keyframes bounce-in{
    0%{ transform: scale(0); opacity:0; }
    100%{ transform: scale(var(--final-scale)); opacity:1; }
  }

  /* ---------- the sum ----------
     On a full-width light purple band across the top third, in black (taller only
     if the sum needs it; Figma equation: 1188x327 on the 1728x1117 frame). The sum sits below the top corner icons on
     iPad/desktop and below the progress dots on phones (see there). */
  :root{
    --band:#D3A8FF; /* light purple, her pick 2026-11-01 (orange felt too intense) */
    --top-reserve: calc(var(--unit) * 2 + var(--icon-size));
    --band-h: max(calc(var(--app-height, 100vh) / 3), calc(var(--top-reserve) + var(--hero-size) * 1.4864 + var(--unit) * 2));
  }
  .equation-row{
    position:fixed;
    top:0; left:0; right:0;
    height:var(--band-h);
    padding-top:var(--top-reserve);
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--band);
    z-index:1;
    transition: background 80ms ease;
  }
  /* A right or wrong answer turns the whole screen green/red, band included. */
  body.flashing .equation-row{ background:transparent; }
  .equation{
    display:flex;
    align-items:baseline;
    flex-wrap:nowrap;
    justify-content:center;
    gap:0.15em;
    font-size: calc(var(--hero-size) * var(--eq-scale, 1));
    line-height:1.4864;
    color:#000;
    max-width:94vw;
  }
  .answer-slots{ display:inline-flex; }
  .answer-digit{ display:inline-block; min-width:0.62em; text-align:center; }
  .answer-digit.placeholder{ visibility:hidden; }
  .answer-digit.cursor{
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink{
    50%{ opacity:0; }
  }
  /* iPad/desktop: the top icons sit on the band, where a light "selected"
     circle would vanish -- selected goes black there. */
  @media (min-width: 768px) and (min-height: 501px){
    .op-btn.active .fill-bg,
    .diff-btn.active .fill-bg{ fill:#202020; }
    .op-btn.active .fill-glyph{ fill:var(--bright); }
  }

  /* ---------- number pad ----------
     The site's own buttons instead of the phone's keyboard, so the back
     button and the rest of the icons stay where they are in every game. The
     answer is checked as soon as every blank is filled. Digits in black
     (the same share of the circle as Sudoku's).
     Upright screens: a 3x4 grid like a calculator. Wide screens: one row,
     1-9 then 0 like a keyboard's number row, then delete. */
  :root{
    /* Keys as big as the icon buttons, with the tray's gap between them
       (0.1239 of a key), as far as there's room: one row of 11 keys and 10
       gaps has to fit the width, and fit between the band and the bottom
       icons. */
    --key: max(44px, min(
      var(--icon-size),
      calc((100vw - var(--unit) * 4) / 12.24),
      calc(var(--app-height, 100vh) - var(--band-h) - var(--unit) * 6 - var(--icon-size))
    ));
  }
  /* The pad centres in the purple between the band and the bottom icons. */
  body{
    padding-top:var(--band-h);
    padding-bottom:calc(var(--unit) * 2 + var(--icon-size));
  }
  .equation-tap{ display:flex; align-items:center; justify-content:center; }
  .num-pad{
    display:grid;
    grid-template-columns: repeat(11, var(--key));
    gap: calc(var(--key) * 0.1239);
  }
  .pad-spacer{ display:none; }
  .icon-btn.pad-key{ width:var(--key); height:var(--key); }
  .pad-key .fill-bg{ fill:var(--band); }
  .pad-key .digit{
    fill:#000;
    font-family:'Spline Sans Mono', ui-monospace, 'SF Mono', monospace;
    font-weight:400;
    font-size:95px; /* the same share of the circle as Sudoku's digits */
    font-feature-settings:"zero" 1;
    text-anchor:middle;
    dominant-baseline:central;
  }
  /* Backspace, after Apple's: a short, almost square tag pointing left
     with a cross in it, a fine line, sharp corners and square ends. */
  .pad-key .del-glyph{ fill:none; stroke:#000; stroke-width:8; }

  /* Upright screens (phones, iPad portrait): the sum in light type on
     Math's own purple, as it always was, and the keys on a dark panel (Memory's
     background) filling the rest of the screen, so the purple sum is the
     focus -- as Memory's buttons: black see-through circles, with digits in
     Math's light purple.
     1 2 3 / 4 5 6 / 7 8 9 / _ 0 delete, like a calculator, each key as big
     as the corner icons when there's room: 4 keys and 3 gaps = 4.37 keys
     tall. */
  @media (orientation: portrait){
    :root{
      --key: max(44px, min(
        var(--icon-size),
        calc((var(--app-height, 100vh) - var(--band-h) - var(--unit) * 6 - var(--icon-size)) / 4.37)
      ));
    }
    .equation-row{ background:transparent; }
    .equation{ color:var(--bright); }
    .op-btn.active .fill-bg,
    .diff-btn.active .fill-bg{ fill:var(--bright); }
    .op-btn.active .fill-glyph{ fill:var(--ink); }
    .equation-tap{
      position:fixed;
      top:var(--band-h); left:0; right:0; bottom:0;
      padding-bottom:calc(var(--unit) * 2 + var(--icon-size));
      background:#212121;
      transition: background 80ms ease;
    }
    body.flashing .equation-tap{ background:transparent; }
    .pad-key .fill-bg{ fill:rgba(0,0,0,0.4); }
    .pad-key .digit{ fill:var(--band); }
    .pad-key .del-glyph{ stroke:var(--band); }
    .num-pad{ grid-template-columns: repeat(3, var(--key)); }
    .pad-spacer{ display:block; }
  }

  /* iPad landscape and computers: side by side instead, like a calculator --
     the sum on a light purple panel down the left half, the pad as a 3x4
     grid in the purple on the right. (A band across the top took half these
     screens, since the sum has to sit below the row of top icons.) */
  @media (orientation: landscape) and (min-width: 768px) and (min-height: 501px){
    :root{
      --key: max(44px, min(
        var(--icon-size),
        calc((50vw - var(--unit) * 4) / 3.25),
        calc((var(--app-height, 100vh) - var(--unit) * 10 - var(--icon-size) * 2) / 4.37)
      ));
    }
    .equation-row{ right:50%; bottom:0; height:auto; padding-top:0; }
    .equation{ font-size: calc(var(--hero-size) * 0.7 * var(--eq-scale, 1)); }
    body{ padding:0 0 0 50%; }
    .num-pad{ grid-template-columns: repeat(3, var(--key)); }
    .pad-spacer{ display:block; }
    /* Only the sign buttons sit on the panel now; difficulty is back on the
       purple, where selected is light as in every game. */
    .diff-btn.active .fill-bg{ fill:var(--bright); }
  }

  /* Computers with a mouse or trackpad: no number keys -- children type on
     the keyboard, as Math always worked there (the hard-to-leave problem
     was the phone's keyboard, never a computer's). The sum sits on a light
     purple band across the middle, with the usual corner icons on the
     purple above and below it. Touch screens of any size keep the keys. */
  @media (hover: hover) and (pointer: fine) and (min-width: 768px) and (min-height: 501px){
    .num-pad{ display:none; }
    .equation-row{
      top:50%; right:0; bottom:auto;
      height:calc(var(--hero-size) * 1.4864 + var(--unit) * 4);
      padding-top:0;
      transform:translateY(-50%);
    }
    .equation{ font-size: calc(var(--hero-size) * var(--eq-scale, 1)); }
    body{ padding:0; }
    .equation-row{ background:var(--band); }
    .equation{ color:#000; }
    .equation-tap{ position:static; padding:0; background:none; }
    .op-btn.active .fill-bg,
    .diff-btn.active .fill-bg{ fill:var(--bright); }
    .op-btn.active .fill-glyph{ fill:var(--ink); }
  }

  /* ---------- phone: single scrollable slider-menu bar ---------- */
  /* max-height clause catches a phone in landscape (width alone would otherwise put
     it in the iPad-tuned tablet breakpoint above) — matches on width OR shortness. */
  @media (max-width: 767px), (max-height: 500px){
    /* Touch has no hover, so desktop's grow-on-hover feedback never fires
       here -- darken on tap instead, so pressing any icon button is
       actually visible. (The icons inside the tray deliberately don't grow:
       the tray itself is the thing that grows, see .controls-slider:active.) */
    .icon-btn:active{ transform: translateZ(0); filter: brightness(0.7); }
    :root{
      --hero-size: clamp(2.6rem, 16.5587vw, 140px); /* 65.08px on the 393px phone frame */
      --unit: 5.089vw; /* 20px on the 393px phone frame */
      --icon-size: clamp(52px, 20.5344vw, 100px); /* 80.71px on the 393px phone frame */
      /* The sum starts below the progress dots, not a row of icons, and
         takes only the room it needs: the 3x4 keys (as big as the tray's
         buttons where they fit, smaller on shorter phones) get the rest,
         and the sum's purple grows on phones tall enough for full-size
         keys. */
      --top-reserve: calc(var(--unit) * 2 + var(--icon-size) * 0.25);
      --band-min: calc(var(--top-reserve) + var(--hero-size) * 1.4864 + var(--unit) * 1.5);
      --key: max(44px, min(
        var(--icon-size),
        calc((var(--app-height, 100vh) - var(--band-min) - var(--unit) * 5 - var(--icon-size)) / 4.37)
      ));
      --band-h: max(var(--band-min), calc(var(--app-height, 100vh) - var(--unit) * 5 - var(--icon-size) - var(--key) * 4.37));
    }
    .controls-slider{
      display:flex;
      align-items:flex-end;
      gap: calc(var(--icon-size) * 0.1239);
      position:fixed;
      left:var(--unit);
      right:var(--unit);
      bottom:var(--unit);
      z-index:3;
      background: rgba(32,32,32,0.4);
      border-radius:999px;
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    .controls-slider::-webkit-scrollbar{ display:none; }
    /* Press feedback for the tray itself, like the icons and tiles: it grows
       slightly while touched (:active also matches while any button inside it
       is held, so tapping an icon gives both). */
    .controls-slider{ transition: transform 120ms ease; }
    .controls-slider:active{ transform: scale(1.03); }
    .op-group, .diff-group, .btn-row{ display:contents; }
    .progress-dots{ left:var(--unit); top:var(--unit); right:auto; bottom:auto; }
    /* Measured from the tray's top edge, so the dark above and below the
       keys comes out even. */
    .equation-tap{ padding-bottom: calc(var(--unit) + var(--icon-size)); }
    /* The tray sits on the dark panel: Memory's tray and button colours,
       which show there (Math's own see-through grey disappears on it). */
    :root{ --ink-muted: rgba(0,0,0,0.4); }
    .controls-slider{ background: rgba(0,0,0,0.2); }
    /* Light parts in Math's light purple, like the keys. */
    .controls-slider .fill-glyph{ fill:var(--band); }
    .controls-slider path[fill="var(--bright)"]{ fill:var(--band); }
    .controls-slider path[stroke="var(--bright)"]{ stroke:var(--band); }
    .op-btn.active .fill-bg,
    .diff-btn.active .fill-bg{ fill:var(--band); }
    .op-btn.active .fill-glyph{ fill:var(--ink); }
  }

  /* Phone in landscape: the sizing above is all vw-based (tuned for a tall portrait
     phone), so on a short, wide landscape screen it overshoots badly — the reserved
     top+bottom padding alone can exceed the entire viewport height. Switch to
     vh-based sizing here so everything scales against the constrained dimension. */
  @media (max-height: 500px) and (min-width: 500px) and (orientation: landscape){
    :root{
      --hero-size: clamp(2.2rem, 30vh, 140px);
      --unit: clamp(8px, 3.5vh, 14px);
      --icon-size: clamp(40px, 14vh, 64px);
    }
  }

  /* No game here is designed to work in phone landscape — rather than a half-broken
     cramped layout, block it outright with a plain "please rotate" screen. Matches
     the same phone-landscape condition already used elsewhere (a landscape tablet has
     enough height to stay excluded and keeps its normal, working layout).
     The min-width guards against a false positive from the on-screen keyboard: opening
     it shrinks the visual viewport's height (not its width), and on a narrow-enough
     portrait phone that alone can flip CSS's width>height "orientation:landscape" test
     true without the device actually rotating — instantly covering the answer input
     with this block the moment it's tapped. Real landscape phones are all well past
     500px wide; a keyboard-shrunk portrait viewport never is. */
  .rotate-block{
    display:none;
    position:fixed;
    top: calc(-1 * env(safe-area-inset-top, 0px));
    right: calc(-1 * env(safe-area-inset-right, 0px));
    bottom: calc(-1 * env(safe-area-inset-bottom, 0px));
    left: calc(-1 * env(safe-area-inset-left, 0px));
    background:var(--incorrect);
    z-index:9999;
    align-items:center;
    justify-content:center;
  }
  .rotate-block svg{ width:min(50vh, 320px); height:auto; }
  @media (max-height: 500px) and (min-width: 500px) and (orientation: landscape){
    .rotate-block{ display:flex; }
  }
  /* No double-tap zoom anywhere. touch-action doesn't reach into a scrolling
     element (the mobile tray scrolls sideways), so the tray needs its own:
     two quick taps on the level buttons there zoomed the whole page in, and
     with zoom otherwise locked there was no way back out. */
  html, body, .controls-slider{ touch-action:manipulation; }

<body>

  <div class="rotate-block">
    <!-- Pixel-art sad face (Figma node 198:1914), matching the site's other
         lose-state faces, in place of the old curved-path frown. -->
    <svg viewBox="0 0 973 366">
      <circle fill="var(--ink)" cx="65" cy="65" r="65"/>
      <circle fill="var(--ink)" cx="908" cy="65" r="65"/>
      <rect fill="var(--ink)" x="291" y="171" width="392" height="65"/>
      <rect fill="var(--ink)" x="161" y="236" width="130" height="130"/>
      <rect fill="var(--ink)" x="683" y="236" width="130" height="130"/>
    </svg>
  </div>


  <div class="controls-slider" id="controlsSlider">
  <div class="op-group" id="opGroup">
    <button class="icon-btn op-btn" data-op="add" aria-label="Addition">
      <svg viewBox="0 0 150 150"><circle class="fill-bg" cx="75" cy="75" r="75"/><path class="fill-glyph" d="M36.0391 78.4439V70.7329H70.7387V36.0332H78.4498V70.7329H113.149V78.4439H78.4498V113.144H70.7387V78.4439H36.0391Z"/></svg>
    </button>
    <button class="icon-btn op-btn" data-op="sub" aria-label="Subtraction">
      <svg viewBox="0 0 150 150"><circle class="fill-bg" cx="75" cy="75" r="75"/><path class="fill-glyph" d="M36.0391 78.8185V71.1074H113.149V78.8185H36.0391Z"/></svg>
    </button>
    <button class="icon-btn op-btn" data-op="mul" aria-label="Multiplication">

    <button class="icon-btn diff-btn" data-tier="medium" aria-label="Medium">
      <svg viewBox="0 0 80.71 80.71"><path class="fill-bg" d="M61.3396 40.355C61.3396 28.7655 51.9445 19.3704 40.355 19.3704C28.7655 19.3704 19.3704 28.7655 19.3704 40.355C19.3704 51.9445 28.7655 61.3396 40.355 61.3396V80.71C18.0675 80.71 0 62.6425 0 40.355C0 18.0675 18.0675 0 40.355 0C62.6425 0 80.71 18.0675 80.71 40.355C80.71 62.6425 62.6425 80.71 40.355 80.71V61.3396C51.9445 61.3396 61.3396 51.9445 61.3396 40.355Z"/></svg>

  <div class="btn-row">
    <button class="icon-btn" id="backBtn" aria-label="Back">
      <svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="75" fill="var(--ink-muted)"/><path fill="var(--bright)" d="M36.0283 79.8692L33 77.207L35.8525 74.3565L66.2295 43.999L71.5732 49.3467L47.9971 72.9082L116 72.9082L116 80.1953L47.8467 80.1953L71.3975 100.906L66.4053 106.584L36.0283 79.8692Z"/></svg>
    </button>
    <button class="icon-btn" id="refreshBtn" aria-label="New problem">
      <svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="75" fill="var(--ink-muted)"/><path fill="none" stroke="var(--bright)" stroke-width="8" d="M32.1677 38.5101L53.5762 37.1367L53.5688 59.9113"/><path fill="none" stroke="var(--bright)" stroke-width="7" d="M97.5629 39.1974C105.703 43.8973 112.095 51.1161 115.775 59.7655C119.455 68.415 120.224 78.0263 117.965 87.1506C115.706 96.2749 110.542 104.418 103.252 110.351C95.9618 116.285 86.9403 119.688 77.5474 120.047C68.1545 120.406 58.8994 117.702 51.1773 112.343C43.4551 106.983 37.6845 99.2589 34.7353 90.3338C31.7862 81.4087 31.8183 71.7667 34.8269 62.8615C37.8354 53.9562 43.6574 46.2703 51.415 40.9624"/></svg>

  <div class="progress-dots" id="progressDots">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
  </div>

  <div class="equation-tap">
    <div class="equation-row">
      <div class="equation" id="equation">
        <span class="num" id="numA">--</span><span class="num" id="opSign">+</span><span class="num" id="numB">--</span><span class="num">=</span><span class="answer-slots" id="answerSlots"></span>
      </div>
    </div>
    <!-- On-screen number pad: 1-9, a gap the 3x4 grid needs, 0, delete. -->
    <div class="num-pad" id="numPad">
      <button class="icon-btn pad-key" data-digit="1" aria-label="1"><svg viewBox="0 0 150 150"><circle class="fill-bg" cx="75" cy="75" r="75"/><text class="digit" x="75" y="75">1</text></svg></button>
      <button class="icon-btn pad-key" data-digit="2" aria-label="2"><svg viewBox="0 0 150 150"><circle class="fill-bg" cx="75" cy="75" r="75"/><text class="digit" x="75" y="75">2</text></svg></button>
      <button class="icon-btn pad-key" data-digit="3" aria-label="3"><svg viewBox="0 0 150 150"><circle class="fill-bg" cx="75" cy="75" r="75"/><text class="digit" x="75" y="75">3</text></svg></button>
      <button class="icon-btn pad-key" data-digit="4" aria-label="4"><svg viewBox="0 0 150 150"><circle class="fill-bg" cx="75" cy="75" r="75"/><text class="digit" x="75" y="75">4</text></svg></button>
      <button class="icon-btn pad-key" data-digit="5" aria-label="5"><svg viewBox="0 0 150 150"><circle class="fill-bg" cx="75" cy="75" r="75"/><text class="digit" x="75" y="75">5</text></svg></button>
      <button class="icon-btn pad-key" data-digit="6" aria-label="6"><svg viewBox="0 0 150 150"><circle class="fill-bg" cx="75" cy="75" r="75"/><text class="digit" x="75" y="75">6</text></svg></button>
      <button class="icon-btn pad-key" data-digit="7" aria-label="7"><svg viewBox="0 0 150 150"><circle class="fill-bg" cx="75" cy="75" r="75"/><text class="digit" x="75" y="75">7</text></svg></button>
      <button class="icon-btn pad-key" data-digit="8" aria-label="8"><svg viewBox="0 0 150 150"><circle class="fill-bg" cx="75" cy="75" r="75"/><text class="digit" x="75" y="75">8</text></svg></button>
      <button class="icon-btn pad-key" data-digit="9" aria-label="9"><svg viewBox="0 0 150 150"><circle class="fill-bg" cx="75" cy="75" r="75"/><text class="digit" x="75" y="75">9</text></svg></button>
      <span class="pad-spacer"></span>
      <button class="icon-btn pad-key" data-digit="0" aria-label="0"><svg viewBox="0 0 150 150"><circle class="fill-bg" cx="75" cy="75" r="75"/><text class="digit" x="75" y="75">0</text></svg></button>
      <button class="icon-btn pad-key" data-key="delete" aria-label="Delete"><svg viewBox="0 0 150 150"><circle class="fill-bg" cx="75" cy="75" r="75"/><path class="del-glyph" d="M62 50H108V100H62L42 75Z M72 63L96 87 M96 63L72 87"/></svg></button>
    </div>
  </div>

  <div class="celebration" id="celebration"></div>

<script src="../../sound.js?v=20261025ze"></script>
<script>
(function(){
  "use strict";


  // iOS Safari only applies :active styles on tap if some element on the
  // page has a touch listener -- this is that listener (a no-op is enough).
  document.addEventListener('touchstart', function(){}, { passive: true });
  var TIER_MAX = { easy: 25, medium: 50, hard: 100 };

  var ROUND_SIZE = 10;
  var MAX_ATTEMPTS = 3;

  var state = {
    a: 0, b: 0, op: '+', answerValue: 0,
    input: '',
    activeOp: 'add',
    difficulty: 'easy',
    progress: 0,
    attempts: 0,
    busy: false
  };

  var els = {
    numA: document.getElementById('numA'),
    numB: document.getElementById('numB'),
    opSign: document.getElementById('opSign'),
    answerSlots: document.getElementById('answerSlots'),
    equation: document.getElementById('equation'),
    equationTap: document.querySelector('.equation-tap'),
    opGroup: document.getElementById('opGroup'),
    diffGroup: document.getElementById('diffGroup'),
    refreshBtn: document.getElementById('refreshBtn'),
    backBtn: document.getElementById('backBtn'),
    progressDots: document.querySelectorAll('#progressDots .dot'),
    celebration: document.getElementById('celebration'),
    numPad: document.getElementById('numPad'),
    controlsSlider: document.getElementById('controlsSlider')
  };

  var flashTimer = null;
  var checkTimer = null;

  function updateAppHeight(){
    var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty('--app-height', h + 'px');
  }
  updateAppHeight();
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', updateAppHeight);
    window.visualViewport.addEventListener('scroll', updateAppHeight);
  } else {
    window.addEventListener('resize', updateAppHeight);
  }

  // iOS can leave --app-height stuck at a stale reading after the tab is
  // backgrounded (app-switched away from, screen locked) and never self-
  // correct on return, since nothing else re-fires resize/scroll -- force a
  // fresh reading the moment the page becomes visible again.
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible') updateAppHeight();
  });

  // Rotating out of the phone-landscape rotate-block and back to portrait can
  // leave iOS's WebKit engine (Safari, Chrome, any iOS browser — Apple requires
  // them all to use it) rendering at the previous orientation's zoom/scale, so
  // the layout comes back oversized and spills past the screen edge. Toggling
  // the viewport meta wasn't enough to unstick it, so instead: reload outright
  // the moment the device leaves that blocked landscape state. A fresh load
  // can't inherit a stuck scale — there's nothing left to get stuck.
  var landscapeBlockMQ = window.matchMedia('(max-height:500px) and (min-width:500px) and (orientation:landscape)');
  var wasInLandscapeBlock = landscapeBlockMQ.matches;
  function onLandscapeBlockChange(e){
    if (wasInLandscapeBlock && !e.matches) {
      saveResume();
      location.reload();
    }
    wasInLandscapeBlock = e.matches;
  }
  if (landscapeBlockMQ.addEventListener) {
    landscapeBlockMQ.addEventListener('change', onLandscapeBlockChange);
  } else if (landscapeBlockMQ.addListener) {
    landscapeBlockMQ.addListener(onLandscapeBlockChange); // older Safari
  }

  // ---------- resume after the rotate-block reload ----------
  // Turning the phone back from the landscape block reloads the page (see
  // onLandscapeBlockChange). Save the game just before that reload and pick it
  // back up on the next load, so the player continues where they left off.
  // sessionStorage: this tab only, and only for this one reload.
  var RESUME_KEY = 'playandlearn.resume.math';
  var RESUME_MAX_AGE = 10 * 60 * 1000;
  function saveResume(){
    try {
      var data = snapshotGame();
      if (data) sessionStorage.setItem(RESUME_KEY, JSON.stringify({ at: Date.now(), data: data }));
    } catch (e) {}
  }
  function takeResume(){
    try {
      var raw = sessionStorage.getItem(RESUME_KEY);
      sessionStorage.removeItem(RESUME_KEY);
      if (!raw) return null;
      var saved = JSON.parse(raw);
      if (!saved || Date.now() - saved.at > RESUME_MAX_AGE) return null;
      return saved.data;
    } catch (e) { return null; }
  }

  var OP_SIGNS = { add: '+', sub: '−', mul: '×', div: '÷' };

  // Everything needed to put the same equation back on screen. A reload mid-flash
  // lands in the state the flash would have ended in: a correct answer is counted
  // and moves on to a new problem, a wrong one keeps the problem with the input
  // cleared (or moves on, if that was the last attempt).
  function snapshotGame(){
    // Round already won -- nothing left to resume, start fresh.
    if (els.celebration.style.display === 'flex') return null;
    var data = {
      activeOp: state.activeOp,
      difficulty: state.difficulty,
      progress: state.progress,
      a: state.a,
      b: state.b,
      answer: state.answerValue,
      input: state.input,
      attempts: state.attempts,
      nextProblem: false
    };
    if (state.busy) {
      data.input = '';
      if (parseInt(state.input, 10) === state.answerValue) {
        // Correct-answer flash: count it, then a new problem. If it was the
        // round's last one, the celebration would follow and reset to 0.
        data.progress = state.progress + 1;
        if (data.progress >= ROUND_SIZE) data.progress = 0;
        data.nextProblem = true;
      } else if (state.attempts >= MAX_ATTEMPTS) {
        // Wrong-answer flash on the last attempt: moves on to a new problem.
        data.nextProblem = true;
      }
    }
    return data;
  }

  function isWholeNumber(n, min, max){
    return typeof n === 'number' && n % 1 === 0 && n >= min && n <= max;
  }

  // Check everything first, then rebuild -- bad data never touches the screen.
  function restoreGame(data){
    if (!data || !OP_SIGNS.hasOwnProperty(data.activeOp)) return false;
    if (!TIER_MAX.hasOwnProperty(data.difficulty)) return false;
    if (!isWholeNumber(data.progress, 0, ROUND_SIZE - 1)) return false;
    if (!data.nextProblem) {
      var a = data.a, b = data.b, answer = data.answer;
      if (!isWholeNumber(a, 0, 10000) || !isWholeNumber(b, 0, 10000) || !isWholeNumber(answer, 0, 10000)) return false;
      var expected = data.activeOp === 'add' ? a + b :
                     data.activeOp === 'sub' ? a - b :
                     data.activeOp === 'mul' ? a * b :
                     (b > 0 ? a / b : -1);
      if (expected !== answer) return false;
      if (typeof data.input !== 'string' || !/^[0-9]*$/.test(data.input)) return false;
      if (data.input.length > String(answer).length) return false;
      if (!isWholeNumber(data.attempts, 0, MAX_ATTEMPTS - 1)) return false;
    }

    state.activeOp = data.activeOp;
    state.difficulty = data.difficulty;
    state.progress = data.progress;
    state.busy = false;
    if (data.nextProblem) {
      newProblem();
      return true;
    }
    state.a = data.a;
    state.b = data.b;
    state.answerValue = data.answer;
    state.op = OP_SIGNS[data.activeOp];
    state.input = data.input;
    state.attempts = data.attempts;
    // render() also redraws the progress dots and the active op/difficulty buttons.
    render();
    return true;
  }

  function randInt(min, max){
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function newProblem(){
    // A digit that just filled the last blank is waiting to be checked
    // against the old problem -- drop it.
    if (checkTimer) {
      clearTimeout(checkTimer);
      checkTimer = null;
      state.busy = false;
    }
    var max = TIER_MAX[state.difficulty];
    var a, b, answer, op;

    if (state.activeOp === 'add') {
      op = '+';
      a = randInt(1, max - 1);
      b = randInt(1, max - a);
      answer = a + b;
    } else if (state.activeOp === 'sub') {
      op = '−';
      a = randInt(1, max);
      b = randInt(1, a);
      answer = a - b;
    } else if (state.activeOp === 'mul') {
      op = '×';
      var capA = Math.min(12, max);
      a = randInt(1, capA);
      var capB = Math.min(12, Math.floor(max / a));
      b = randInt(1, capB);
      answer = a * b;
    } else {
      op = '÷';
      var divisor = randInt(1, Math.min(12, max));
      var capQ = Math.min(12, Math.floor(max / divisor));
      var quotient = randInt(1, capQ);
      a = divisor * quotient;
      b = divisor;
      answer = quotient;
    }

    state.a = a; state.b = b; state.answerValue = answer;
    state.op = op;
    state.input = '';
    state.attempts = 0;
    render();
  }

  function updateProgressDots(){
    els.progressDots.forEach(function(dot, i){
      dot.classList.toggle('done', i < state.progress);
    });
  }

  function restartRound(){
    state.progress = 0;
    updateProgressDots();
    newProblem();
  }

  // Each digit in its own span, so a digit can sit on its own disc.
  function digitSpans(n){
    return String(n).split('').map(function(ch){ return '<span class="d">' + ch + '</span>'; }).join('');
  }

  function render(){
    els.numA.innerHTML = digitSpans(state.a);
    els.numB.innerHTML = digitSpans(state.b);
    els.opSign.textContent = state.op;

    var digitCount = String(state.answerValue).length;
    var cursorIndex = state.input.length;
    var html = '';
    for (var i = 0; i < digitCount; i++) {
      var ch = state.input.charAt(i);
      if (ch) {
        html += '<span class="num answer-digit">' + ch + '</span>';
      } else if (i === cursorIndex) {
        html += '<span class="num answer-digit cursor">_</span>';
      } else {
        html += '<span class="num answer-digit placeholder">_</span>';
      }
    }
    els.answerSlots.innerHTML = html;
    updateProgressDots();

    els.opGroup.querySelectorAll('.op-btn').forEach(function(btn){
      var op = btn.getAttribute('data-op');
      btn.classList.toggle('active', state.activeOp === op);
    });
    els.diffGroup.querySelectorAll('.diff-btn').forEach(function(btn){
      var tier = btn.getAttribute('data-tier');
      btn.classList.toggle('active', state.difficulty === tier);
    });

    fitEquationText();
  }

  // Occasionally a particular number combination renders wider than the equation's
  // own 94vw cap, which used to wrap it onto a second line. Instead, shrink it down
  // in small steps only as far as needed to fit on one line — most equations never
  // trigger this and render at full size exactly as before.
  function fitEquationText(){
    var el = els.equation;
    // Full-width band: 94% of the screen. Half-width panel (wide screens):
    // 85% of the panel, to keep clear of its edges.
    var panel = el.parentNode.clientWidth;
    var maxWidth = panel < window.innerWidth ? panel * 0.85 : window.innerWidth * 0.94;
    var scale = 1;
    el.style.setProperty('--eq-scale', scale);
    while (el.scrollWidth > maxWidth && scale > 0.5) {
      scale -= 0.02;
      el.style.setProperty('--eq-scale', scale);
    }
  }

  function flashCorrect(){
    state.busy = true;
    PLSound.play('positive');
    clearTimeout(flashTimer);
    document.body.style.background = 'var(--success)';
    document.body.classList.add('flashing');
    flashTimer = setTimeout(function(){
      state.progress += 1;
      updateProgressDots();
      document.body.style.background = '';
      document.body.classList.remove('flashing');
      if (state.progress >= ROUND_SIZE) {
        showCelebration();
      } else {
        state.busy = false;
        newProblem();
      }
    }, 700);
  }

  // Pixel-art smiley (Figma node 198:1809) instead of the earlier curved-path
  // one -- two round eyes and a stepped-block smile.
  var CELEBRATION_FACE_SVG = '<svg class="celebration-face" viewBox="0 0 973 366" style="--final-scale:1;">' +
    '<circle fill="var(--bright)" cx="65" cy="65" r="65"/>' +
    '<circle fill="var(--bright)" cx="908" cy="65" r="65"/>' +
    '<rect fill="var(--bright)" x="161" y="171" width="130" height="130"/>' +
    '<rect fill="var(--bright)" x="683" y="171" width="130" height="130"/>' +
    '<rect fill="var(--bright)" x="291" y="301" width="392" height="65"/>' +
    '</svg>';

  function showCelebration(){
    // Nothing here re-fires a resize once the page has settled, so take a
    // fresh height before centring the full-screen face.
    updateAppHeight();
    els.celebration.innerHTML = CELEBRATION_FACE_SVG;
    PLSound.play('complete');
    els.equationTap.style.display = 'none';
    els.celebration.style.display = 'flex';
    flashTimer = setTimeout(function(){
      els.celebration.style.display = 'none';
      els.equationTap.style.display = '';
      state.progress = 0;
      state.busy = false;
      newProblem();
    }, 3000);
  }

  function flashIncorrect(){
    state.busy = true;
    PLSound.play('negative');
    clearTimeout(flashTimer);
    document.body.style.background = 'var(--incorrect)';
    document.body.classList.add('flashing');
    flashTimer = setTimeout(function(){
      document.body.style.background = '';
      document.body.classList.remove('flashing');
      state.busy = false;
      if (state.attempts >= MAX_ATTEMPTS) {
        newProblem();
      } else {
        state.input = '';
        render();
      }
    }, 700);
  }

  function submitAnswer(){
    checkTimer = null;
    var guess = parseInt(state.input, 10);
    if (guess === state.answerValue) {
      flashCorrect();
    } else {
      state.attempts += 1;
      flashIncorrect();
    }
  }

  // One digit from the pad (or a computer's keyboard). A click per digit, like
  // every other tap on the site -- except the digit that fills the last blank:
  // that tap's sound is the right/wrong one, a moment later so the digit is
  // seen in place first (never two sounds on one tap).
  function addDigit(d){
    var maxLen = String(state.answerValue).length;
    if (state.busy || state.input.length >= maxLen) return;
    state.input += d;
    render();
    if (state.input.length < maxLen) {
      PLSound.play('click');
      return;
    }
    state.busy = true;
    checkTimer = setTimeout(submitAnswer, 250);
  }

  function deleteDigit(){
    if (state.busy || !state.input) return;
    state.input = state.input.slice(0, -1);
    PLSound.play('click');
    render();
  }

  els.numPad.addEventListener('click', function(e){
    var btn = e.target.closest('.pad-key');
    if (!btn) return;
    if (btn.getAttribute('data-key') === 'delete') deleteDigit();
    else addDigit(btn.getAttribute('data-digit'));
  });

  document.addEventListener('keydown', function(e){
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^[0-9]$/.test(e.key)) addDigit(e.key);
    else if (e.key === 'Backspace' || e.key === 'Delete') deleteDigit();
    else return;
    e.preventDefault();
  });

  els.opGroup.addEventListener('click', function(e){
    var btn = e.target.closest('.op-btn');
    if (!btn) return;
    var op = btn.getAttribute('data-op');
    if (op === state.activeOp) return; // already selected — don't reset the current problem
    state.activeOp = op;
    newProblem();
  });

  els.diffGroup.addEventListener('click', function(e){
    var btn = e.target.closest('.diff-btn');
    if (!btn) return;
    var tier = btn.getAttribute('data-tier');
    if (tier === state.difficulty) return; // already selected — don't reset the current problem
    state.difficulty = tier;
    newProblem();
  });

  els.refreshBtn.addEventListener('click', restartRound);
  els.backBtn.addEventListener('click', function(){ PLSound.go('../../index.html'); });

  // First-visit only: gently peek-scroll the bottom slider tray so new users notice
  // it scrolls (there are more icons than fit on a phone screen), then ease back to
  // the correct resting view with + as the leftmost icon. Jumps to the TRUE end
  // (no partial-reveal cap -- a longer tray, e.g. Math's, was never reaching its
  // real end otherwise) immediately, before first paint, then eases back on the
  // very next frame with no added hold -- both the jump and the start of the
  // ease read as a glitchy stutter when delayed.
  function introduceTraySlider(){
    var el = els.controlsSlider;
    if (!el || window.innerWidth > 767) return;
    var STORAGE_KEY = 'math.traySliderIntroShown';
    try { if (localStorage.getItem(STORAGE_KEY)) return; } catch (e) {}
    var maxScroll = el.scrollWidth - el.clientWidth;
    if (maxScroll <= 0) return;
    var reveal = maxScroll;
    el.scrollLeft = reveal;
    var duration = 1800;
    var start = null;
    function easeInOutCubic(t){
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }
    function step(ts){
      if (start === null) start = ts;
      var elapsed = ts - start;
