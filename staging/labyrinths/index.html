<title>Labyrinths</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<style>
  :root{
    --bg:#B5651D;
    --bright:#E4E4E4;
    --ink:#202020;
    --ink-muted:rgba(32,32,32,0.4);
    --success:#0DC754;
    --incorrect:#F2383B;
    --unit: 1.1574vw;
    --icon-size: clamp(44px, 8.912vw, 154px);
    --board-size: min(88vmin, 88vw, 720px);
  }

  @media (min-width: 768px) and (max-width: 1023px) and (min-height: 501px){
    :root{
      --unit: 2.3981vw;
      --icon-size: clamp(80px, 11.4824vw, 120px);
    }
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    position:relative;
    margin:0;
    height: var(--app-height, 100vh);
    background:var(--bg);
    color:var(--bright);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select:none;
    user-select:none;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action:manipulation;
    transition: background 80ms ease;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  /* ---------- icon buttons (difficulty / back / refresh) ---------- */
  .icon-btn{
    appearance:none;
    background:none;
    border:none;
    cursor:pointer;
    width:var(--icon-size);
    height:var(--icon-size);
    aspect-ratio:1;
    border-radius:50%;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:none;
    transform: translateZ(0);
    -webkit-transform: translateZ(0);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    transition: transform 120ms ease;
  }
  .icon-btn:active{ transform: translateZ(0) scale(0.94); }
  @media (hover:hover) and (pointer:fine){
    .icon-btn:hover{ transform: translateZ(0) scale(1.035); }
  }
  .icon-btn svg{ width:100%; height:100%; display:block; }
  .icon-btn .fill-bg{ transition: fill 120ms ease; }

  .diff-group{ position:absolute; right:var(--unit); top:var(--unit); display:flex; gap:calc(var(--icon-size) * 0.1); z-index:2; }
  .diff-btn .fill-bg{ fill:var(--ink-muted); }
  .diff-btn.active .fill-bg{ fill:var(--bright); }

  .btn-row{ position:absolute; left:var(--unit); bottom:var(--unit); display:flex; gap:calc(var(--icon-size) * 0.1); z-index:2; }

  @media (min-width: 768px) and (max-width: 1023px) and (min-height: 501px){
    .diff-group, .btn-row{ gap: calc(var(--icon-size) * 0.1253); }
  }

  .controls-slider{ display:contents; }

  /* ---------- the maze ---------- */
  .board-wrap{ position:relative; width:var(--board-size); height:var(--board-size); }
  .board-wrap.busy{ pointer-events:none; }
  .maze-svg{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; display:block; }
  .wall-line{ stroke:var(--bright); stroke-width:4px; stroke-linecap:round; vector-effect:non-scaling-stroke; }

  .tap-grid{ position:absolute; inset:0; display:grid; }
  .tap-cell{ background:transparent; cursor:pointer; }

  .player-token{ transition: transform 220ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  .player-token circle{ fill:var(--bright); }
  @keyframes bump-wall{
    0%, 100%{ transform:translate(var(--tx, 0px), var(--ty, 0px)); }
    50%{ transform:translate(calc(var(--tx, 0px) + var(--bx, 0px)), calc(var(--ty, 0px) + var(--by, 0px))); }
  }
  .player-token.bump{ animation: bump-wall 180ms ease; }

  .target-ring{ fill:none; stroke:var(--bright); vector-effect:non-scaling-stroke; animation: ring-breathe 1.8s ease-in-out infinite; }
  .target-ring.r2{ animation-delay:0.3s; }
  @keyframes ring-breathe{
    0%,100%{ opacity:0.9; transform:scale(1); }
    50%{ opacity:0.5; transform:scale(1.12); }
  }

  @keyframes bounce-in{
    0%{ transform:scale(0); opacity:0; }
    100%{ transform:scale(var(--final-scale)); opacity:1; }
  }
  .celebration{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:4;
  }
  .celebration-face{
    width:min(70vmin, 700px);
    height:auto;
    animation: bounce-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  /* ---------- phone: single scrollable slider-menu bar ---------- */
  @media (max-width: 767px), (max-height: 500px){
    :root{
      --unit: 5.089vw;
      --icon-size: clamp(52px, 20.5344vw, 100px);
    }
    .controls-slider{
      display:flex;
      align-items:flex-end;
      gap: calc(var(--icon-size) * 0.1239);
      position:fixed;
      left:var(--unit);
      right:var(--unit);
      bottom:var(--unit);
      z-index:3;
      background: rgba(32,32,32,0.4);
      border-radius:999px;
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    .controls-slider::-webkit-scrollbar{ display:none; }
    .diff-group, .btn-row{ display:contents; }
    body{
      padding-top: calc(var(--unit) * 2 + var(--icon-size));
      padding-bottom: calc(var(--unit) * 2 + var(--icon-size));
    }
  }

  @media (max-height: 500px) and (min-width: 500px) and (orientation: landscape){
    :root{
      --unit: clamp(8px, 3.5vh, 14px);
      --icon-size: clamp(40px, 14vh, 64px);
    }
  }

  .rotate-block{
    display:none;
    position:fixed;
    top: calc(-1 * env(safe-area-inset-top, 0px));
    right: calc(-1 * env(safe-area-inset-right, 0px));
    bottom: calc(-1 * env(safe-area-inset-bottom, 0px));
    left: calc(-1 * env(safe-area-inset-left, 0px));
    background:var(--incorrect);
    z-index:9999;
    align-items:center;
    justify-content:center;
  }
  .rotate-block svg{ width:min(50vh, 320px); height:auto; }
  @media (max-height: 500px) and (min-width: 500px) and (orientation: landscape){
    .rotate-block{ display:flex; }
  }
</style>

  <div class="board-wrap" id="boardWrap">
    <svg class="maze-svg" id="mazeSvg" overflow="visible"></svg>
    <div class="tap-grid" id="tapGrid"></div>
  </div>

  <div class="celebration" id="celebration"></div>

<script>
(function(){
  "use strict";

  var DIR = { N: 1, E: 2, S: 4, W: 8 };
  var OPPOSITE = { 1: 4, 2: 8, 4: 1, 8: 2 };
  var DELTA = { 1: [-1, 0], 2: [0, 1], 4: [1, 0], 8: [0, -1] };
  var ALL_DIRS = [1, 2, 4, 8];

  var TIER_MAZE = {
    easy:   { n: 6,  braid: 0 },
    medium: { n: 8,  braid: 0.12 },
    hard:   { n: 10, braid: 0.25 }
  };

  var state = {
    n: 6,
    walls: null,
    player: 0,
    exit: 0,
    difficulty: 'easy',
    busy: false
  };

  var els = {
    boardWrap: document.getElementById('boardWrap'),
    mazeSvg: document.getElementById('mazeSvg'),
    tapGrid: document.getElementById('tapGrid'),
    celebration: document.getElementById('celebration'),
    diffGroup: document.getElementById('diffGroup'),
    backBtn: document.getElementById('backBtn'),
    refreshBtn: document.getElementById('refreshBtn'),
    controlsSlider: document.getElementById('controlsSlider')
  };

  function updateAppHeight(){
    var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty('--app-height', h + 'px');
  }
  updateAppHeight();
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', updateAppHeight);
    window.visualViewport.addEventListener('scroll', updateAppHeight);
  } else {
    window.addEventListener('resize', updateAppHeight);
  }

  var landscapeBlockMQ = window.matchMedia('(max-height:500px) and (min-width:500px) and (orientation:landscape)');
  var wasInLandscapeBlock = landscapeBlockMQ.matches;
  function onLandscapeBlockChange(e){
    if (wasInLandscapeBlock && !e.matches) {
      location.reload();
    }
    wasInLandscapeBlock = e.matches;
  }
  if (landscapeBlockMQ.addEventListener) {
    landscapeBlockMQ.addEventListener('change', onLandscapeBlockChange);
  } else if (landscapeBlockMQ.addListener) {
    landscapeBlockMQ.addListener(onLandscapeBlockChange);
  }

  // ---------- maze generation ----------

  function idx(r, c, n){ return r * n + c; }
  function inBounds(r, c, n){ return r >= 0 && r < n && c >= 0 && c < n; }

  function shuffle(arr){
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  // Recursive backtracking (iterative, randomized-neighbor DFS): returns a
  // Uint8Array(n*n) of per-cell open-passage bitmasks with exactly one path
  // between any two cells (a "perfect" maze, zero loops).
  function generatePerfectMaze(n){
    var walls = new Uint8Array(n * n);
    var visited = new Uint8Array(n * n);
    var stack = [0];
    visited[0] = 1;

    while (stack.length) {
      var current = stack[stack.length - 1];
      var r = Math.floor(current / n), c = current % n;
      var dirs = shuffle(ALL_DIRS.slice());
      var advanced = false;

      for (var k = 0; k < dirs.length; k++) {
        var dir = dirs[k];
        var d = DELTA[dir];
        var nr = r + d[0], nc = c + d[1];
        if (!inBounds(nr, nc, n)) continue;
        var ni = idx(nr, nc, n);
        if (visited[ni]) continue;

        walls[current] |= dir;
        walls[ni] |= OPPOSITE[dir];
        visited[ni] = 1;
        stack.push(ni);
        advanced = true;
        break;
      }
      if (!advanced) stack.pop();
    }
    return walls;
  }

  function popcount4(b){ return (b & 1) + ((b >> 1) & 1) + ((b >> 2) & 1) + ((b >> 3) & 1); }

  // Rejoins some dead ends into loops so a maze has more than one route through
  // a stretch of it, without needing a bigger (harder-to-tap) grid.
  function braid(walls, n, chance){
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        var i = idx(r, c, n);
        if (popcount4(walls[i]) !== 1) continue;
        if (Math.random() > chance) continue;

        var candidates = [];
        for (var k = 0; k < ALL_DIRS.length; k++) {
          var dir = ALL_DIRS[k];
          if (walls[i] & dir) continue;
          var d = DELTA[dir];
          var nr = r + d[0], nc = c + d[1];
          if (!inBounds(nr, nc, n)) continue;
          candidates.push({ dir: dir, ni: idx(nr, nc, n) });
        }
        if (!candidates.length) continue;

        var deadEndCands = candidates.filter(function(cd){ return popcount4(walls[cd.ni]) === 1; });
        var pool = deadEndCands.length ? deadEndCands : candidates;
        var pick = pool[Math.floor(Math.random() * pool.length)];
        walls[i] |= pick.dir;
        walls[pick.ni] |= OPPOSITE[pick.dir];
      }
    }
  }

  // ---------- rendering ----------

  var SVG_NS = 'http://www.w3.org/2000/svg';

  function renderWalls(n){
    var svg = els.mazeSvg;
    svg.setAttribute('viewBox', '0 0 ' + n + ' ' + n);
    svg.innerHTML = '';

    function line(x1, y1, x2, y2){
      var l = document.createElementNS(SVG_NS, 'line');
      l.setAttribute('x1', x1); l.setAttribute('y1', y1);
      l.setAttribute('x2', x2); l.setAttribute('y2', y2);
      l.setAttribute('class', 'wall-line');
      svg.appendChild(l);
    }

    line(0, 0, n, 0);
    line(0, n, n, n);
    line(0, 0, 0, n);
    line(n, 0, n, n);

    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        var i = idx(r, c, n);
        if (!(state.walls[i] & DIR.S) && r < n - 1) line(c, r + 1, c + 1, r + 1);
        if (!(state.walls[i] & DIR.E) && c < n - 1) line(c + 1, r, c + 1, r + 1);
      }
    }

    // exit ring (static breathing marker, same visual language as Connect the Dots)
    var er = Math.floor(state.exit / n), ec = state.exit % n;
    var ring1 = document.createElementNS(SVG_NS, 'circle');
    ring1.setAttribute('class', 'target-ring r1');
    ring1.setAttribute('cx', ec + 0.5); ring1.setAttribute('cy', er + 0.5); ring1.setAttribute('r', 0.16);
    var ring2 = document.createElementNS(SVG_NS, 'circle');
    ring2.setAttribute('class', 'target-ring r2');
    ring2.setAttribute('cx', ec + 0.5); ring2.setAttribute('cy', er + 0.5); ring2.setAttribute('r', 0.22);
    svg.appendChild(ring1);
    svg.appendChild(ring2);

    var token = document.createElementNS(SVG_NS, 'g');
    token.setAttribute('id', 'playerToken');
    token.setAttribute('class', 'player-token');
    var dot = document.createElementNS(SVG_NS, 'circle');
    dot.setAttribute('cx', 0.5); dot.setAttribute('cy', 0.5); dot.setAttribute('r', 0.32);
    token.appendChild(dot);
    svg.appendChild(token);
    els.playerToken = token;

    setTokenPosition(0, 0, true);
  }

  function buildTapGridDom(n){
    els.tapGrid.style.gridTemplateColumns = 'repeat(' + n + ', 1fr)';
    els.tapGrid.style.gridTemplateRows = 'repeat(' + n + ', 1fr)';
    els.tapGrid.innerHTML = '';
    for (var i = 0; i < n * n; i++) {
      var cell = document.createElement('div');
      cell.className = 'tap-cell';
      cell.dataset.i = i;
      cell.addEventListener('click', onCellClick);
      els.tapGrid.appendChild(cell);
    }
  }

  function setTokenPosition(r, c, instant){
    if (instant) els.playerToken.style.transition = 'none';
    els.playerToken.style.transform = 'translate(' + c + 'px, ' + r + 'px)';
    if (instant) {
      // force layout so the next real move animates instead of inheriting "none"
      els.playerToken.getBoundingClientRect();
      els.playerToken.style.transition = '';
    }
  }

  // ---------- interaction ----------

  function bumpWall(dir){
    var d = DELTA[dir];
    els.playerToken.style.setProperty('--bx', (d[1] * 0.18) + 'px');
    els.playerToken.style.setProperty('--by', (d[0] * 0.18) + 'px');
    els.playerToken.classList.add('bump');
    setTimeout(function(){ els.playerToken.classList.remove('bump'); }, 180);
  }

  function onCellClick(e){
    if (state.busy) return;
    var j = Number(e.currentTarget.dataset.i);
    if (j === state.player) return;

    var n = state.n;
    var r1 = Math.floor(state.player / n), c1 = state.player % n;
    var r2 = Math.floor(j / n), c2 = j % n;
    var dr = r2 - r1, dc = c2 - c1;

    if (Math.abs(dr) + Math.abs(dc) !== 1) return;

    var dir = dr === -1 ? DIR.N : dr === 1 ? DIR.S : dc === 1 ? DIR.E : DIR.W;
    if (!(state.walls[state.player] & dir)) {
      bumpWall(dir);
      return;
    }
    stepTo(j, r2, c2);
  }

  function stepTo(j, r, c){
    state.busy = true;
    state.player = j;
    setTokenPosition(r, c, false);
    setTimeout(function(){
      state.busy = false;
      if (j === state.exit) showCelebration();
    }, 220);
  }

  // ---------- flow ----------

  function startGame(){
    var tier = TIER_MAZE[state.difficulty];
    state.n = tier.n;
    state.walls = generatePerfectMaze(tier.n);
    braid(state.walls, tier.n, tier.braid);
    state.player = 0;
    state.exit = tier.n * tier.n - 1;
    state.busy = false;
    els.boardWrap.classList.remove('busy');
    buildTapGridDom(tier.n);
    renderWalls(tier.n);
  }

  // ---------- celebration ----------

    '<path fill="var(--bright)" d="M751.759 72.96C741.999 72.96 733.679 69.6 726.799 62.88C720.079 56.16 716.719 47.44 716.719 36.72C716.719 25.84 720.079 17.04 726.799 10.32C733.679 3.44001 741.999 0 751.759 0C761.519 0 769.759 3.44001 776.479 10.32C783.359 17.04 786.799 25.84 786.799 36.72C786.799 47.44 783.359 56.16 776.479 62.88C769.759 69.6 761.519 72.96 751.759 72.96Z"/>' +

    '</svg>';

  // A maze has no lose state -- reaching the exit is the only outcome, so this
  // always shows the win face on the shared success-green, unlike the two-outcome
  // showCelebration(isWin) other games use.
  function showCelebration(){
    updateAppHeight();
    els.celebration.innerHTML = CELEBRATION_FACE_SVG;
    document.body.style.background = 'var(--success)';
    els.boardWrap.style.display = 'none';
    els.celebration.style.display = 'flex';
    setTimeout(function(){
      els.celebration.style.display = 'none';
      els.boardWrap.style.display = '';
      document.body.style.background = '';
      startGame();
    }, 3000);
  }

  els.diffGroup.addEventListener('click', function(e){
    var btn = e.target.closest('.diff-btn');
    if (!btn) return;
    state.difficulty = btn.dataset.tier;
    els.diffGroup.querySelectorAll('.diff-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    startGame();
  });
  els.refreshBtn.addEventListener('click', startGame);
  els.backBtn.addEventListener('click', function(){ window.location.href = '../../index.html'; });

  els.diffGroup.querySelector('[data-tier="easy"]').classList.add('active');
  startGame();
})();
</script>
