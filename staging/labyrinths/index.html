<title>Labyrinths</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<style>
  :root{
    --bg:#583813;
    --wall:#E88CE5;
    --bright:#E4E4E4;
    --ink:#202020;
    --ink-muted:rgba(32,32,32,0.4);
    --success:#0DC754;
    --incorrect:#F2383B;
    --unit: 1.1574vw;
    --icon-size: clamp(44px, 8.912vw, 154px);
  }

  @media (min-width: 768px) and (max-width: 1023px) and (min-height: 501px){
    :root{
      --unit: 2.3981vw;
      --icon-size: clamp(80px, 11.4824vw, 120px);
    }
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    position:relative;
    margin:0;
    height: var(--app-height, 100vh);
    background:var(--bg);
    color:var(--bright);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select:none;
    user-select:none;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action:manipulation;
    transition: background 80ms ease;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  /* ---------- icon buttons (difficulty / back / refresh) ---------- */
  .icon-btn{
    appearance:none;
    background:none;
    border:none;
    cursor:pointer;
    width:var(--icon-size);
    height:var(--icon-size);
    aspect-ratio:1;
    border-radius:50%;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:none;
    transform: translateZ(0);
    -webkit-transform: translateZ(0);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    transition: transform 120ms ease;
  }
  .icon-btn:active{ transform: translateZ(0) scale(0.94); }
  @media (hover:hover) and (pointer:fine){
    .icon-btn:hover{ transform: translateZ(0) scale(1.035); }
  }
  .icon-btn svg{ width:100%; height:100%; display:block; }
  .icon-btn .fill-bg{ transition: fill 120ms ease; }

  .diff-group{ position:absolute; right:var(--unit); top:var(--unit); display:flex; gap:calc(var(--icon-size) * 0.1); z-index:2; }
  .diff-btn .fill-bg{ fill:var(--ink-muted); }
  .diff-btn.active .fill-bg{ fill:var(--bright); }

  .btn-row{ position:absolute; left:var(--unit); bottom:var(--unit); display:flex; gap:calc(var(--icon-size) * 0.1); z-index:2; }

  @media (min-width: 768px) and (max-width: 1023px) and (min-height: 501px){
    .diff-group, .btn-row{ gap: calc(var(--icon-size) * 0.1253); }
  }

  .controls-slider{ display:contents; }

  /* ---------- the maze ---------- */
  /* width/height are set inline by sizeBoardWrap() -- the hard tier's grid is
     rectangular (wide on desktop, tall on mobile) so a single CSS aspect
     ratio can't describe it. */
  .board-wrap{ position:relative; }
  .board-wrap.busy{ pointer-events:none; }
  .maze-svg{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; display:block; }
  .wall-line{ stroke:var(--wall); stroke-width:4px; stroke-linecap:round; vector-effect:non-scaling-stroke; }

  .tap-grid{ position:absolute; inset:0; display:grid; }
  .tap-cell{ position:relative; background:transparent; cursor:pointer; }
  .tap-cell::after{
    content:'';
    position:absolute;
    top:50%; left:50%;
    width:22%; height:22%;
    border-radius:50%;
    background:var(--bright);
    opacity:0;
    transform:translate(-50%,-50%) scale(0.6);
    transition:opacity 150ms ease, transform 150ms ease;
    pointer-events:none;
  }
  .tap-cell.reachable::after{ opacity:0.35; transform:translate(-50%,-50%) scale(1); }

  .player-token .token-face{ fill:var(--bright); }
  /* Same placeholder "eyes" motif as the Memory tiles -- a blinking pair of
     dots -- reused here as the player token's face instead of a plain
     circle. transform-box:fill-box is required for the same reason as the
     exit ring above: an SVG element's transform-origin otherwise resolves
     against the whole SVG viewport's corner, not the eye's own center. */
  .player-token .token-eye{
    fill:var(--ink);
    transform-box:fill-box;
    transform-origin:center;
    animation: token-blink 4.2s ease-in-out infinite;
  }
  @keyframes token-blink{
    0%, 92%, 100%{ transform:scaleY(1); }
    96%{ transform:scaleY(0.12); }
  }
  @keyframes bump-wall{
    0%, 100%{ transform:translate(var(--tx, 0px), var(--ty, 0px)); }
    50%{ transform:translate(calc(var(--tx, 0px) + var(--bx, 0px)), calc(var(--ty, 0px) + var(--by, 0px))); }
  }
  .player-token.bump{ animation: bump-wall 180ms ease; }

  /* transform-box:fill-box is required here -- an SVG element's transform-origin
     otherwise resolves against the whole SVG viewport's corner, not its own
     center, so the scale() below would visibly drift the ring toward/away from
     the top-left of the maze instead of just pulsing in place. */
  .target-ring{ fill:none; stroke:var(--bright); vector-effect:non-scaling-stroke; transform-box:fill-box; transform-origin:center; animation: ring-breathe 1.8s ease-in-out infinite; }
  .target-ring.r2{ animation-delay:0.3s; }
  @keyframes ring-breathe{
    0%,100%{ opacity:0.9; transform:scale(1); }
    50%{ opacity:0.5; transform:scale(1.12); }
  }

  @keyframes bounce-in{
    0%{ transform:scale(0); opacity:0; }
    100%{ transform:scale(var(--final-scale)); opacity:1; }
  }
  .celebration{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:4;
  }
  .celebration-face{
    width:min(70vmin, 700px);
    height:auto;
    animation: bounce-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  /* ---------- phone: single scrollable slider-menu bar ---------- */
  @media (max-width: 767px), (max-height: 500px){
    :root{
      --unit: 5.089vw;
      --icon-size: clamp(52px, 20.5344vw, 100px);
    }
    .controls-slider{
      display:flex;
      align-items:flex-end;
      gap: calc(var(--icon-size) * 0.1239);
      position:fixed;
      left:var(--unit);
      right:var(--unit);
      bottom:var(--unit);
      z-index:3;
      background: rgba(32,32,32,0.4);
      border-radius:999px;
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    .controls-slider::-webkit-scrollbar{ display:none; }
    .diff-group, .btn-row{ display:contents; }
    body{
      padding-bottom: calc(var(--unit) * 2 + var(--icon-size));
    }
  }

  @media (max-height: 500px) and (min-width: 500px) and (orientation: landscape){
    :root{
      --unit: clamp(8px, 3.5vh, 14px);
      --icon-size: clamp(40px, 14vh, 64px);
    }
  }

  .rotate-block{
    display:none;
    position:fixed;
    top: calc(-1 * env(safe-area-inset-top, 0px));
    right: calc(-1 * env(safe-area-inset-right, 0px));
    bottom: calc(-1 * env(safe-area-inset-bottom, 0px));
    left: calc(-1 * env(safe-area-inset-left, 0px));
    background:var(--incorrect);
    z-index:9999;
    align-items:center;
    justify-content:center;
  }
  .rotate-block svg{ width:min(50vh, 320px); height:auto; }
  @media (max-height: 500px) and (min-width: 500px) and (orientation: landscape){
    .rotate-block{ display:flex; }
  }
</style>
</head>

      </g>
      <path fill="var(--bright)" d="M751.759 72.96C741.999 72.96 733.679 69.6 726.799 62.88C720.079 56.16 716.719 47.44 716.719 36.72C716.719 25.84 720.079 17.04 726.799 10.32C733.679 3.44001 741.999 0 751.759 0C761.519 0 769.759 3.44001 776.479 10.32C783.359 17.04 786.799 25.84 786.799 36.72C786.799 47.44 783.359 56.16 776.479 62.88C769.759 69.6 761.519 72.96 751.759 72.96Z"/>

  <div class="controls-slider" id="controlsSlider">
    <div class="diff-group" id="diffGroup">
      <button class="icon-btn diff-btn" data-tier="easy" aria-label="Easy">
        <svg viewBox="0 0 150 150"><path class="fill-bg" d="M75 8C37.9969 8 8 37.9969 8 75C8 112.003 37.9969 142 75 142C112.003 142 142 112.003 142 75L150 75C150 116.421 116.421 150 75 150C33.5786 150 -1.46777e-06 116.421 -3.27835e-06 75C-5.08894e-06 33.5786 33.5786 -1.46777e-06 75 -3.27835e-06C116.421 -5.08894e-06 150 33.5786 150 75L142 75C142 37.9969 112.003 8 75 8Z"/></svg>
      </button>
      <button class="icon-btn diff-btn" data-tier="medium" aria-label="Medium">
        <svg viewBox="0 0 150 150"><path class="fill-bg" d="M114 75C114 53.4609 96.5391 36 75 36C53.4609 36 36 53.4609 36 75C36 96.5391 53.4609 114 75 114V150C33.5786 150 0 116.421 0 75C0 33.5786 33.5786 0 75 0C116.421 0 150 33.5786 150 75C150 116.421 116.421 150 75 150V114C96.5391 114 114 96.5391 114 75Z"/></svg>
      </button>
      <button class="icon-btn diff-btn" data-tier="hard" aria-label="Hard">
        <svg viewBox="0 0 150 150"><circle class="fill-bg" cx="75" cy="75" r="75"/></svg>

    </div>

    <div class="btn-row">
      <button class="icon-btn" id="backBtn" aria-label="Back">
        <svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="75" fill="var(--ink-muted)"/><path fill="var(--bright)" d="M36.0283 79.8692L33 77.207L35.8525 74.3565L66.2295 43.999L71.5732 49.3467L47.9971 72.9082L116 72.9082L116 80.1953L47.8467 80.1953L71.3975 100.906L66.4053 106.584L36.0283 79.8692Z"/></svg>
      </button>
      <button class="icon-btn" id="refreshBtn" aria-label="New game">
        <svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="75" fill="var(--ink-muted)"/><path fill="none" stroke="var(--bright)" stroke-width="8" d="M111.491 32.1671L112.864 53.5756L90.0895 53.5683"/><path fill="none" stroke="var(--bright)" stroke-width="7" d="M110.802 97.5619C106.102 105.702 98.8837 112.094 90.2343 115.774C81.5848 119.454 71.9735 120.223 62.8492 117.964C53.7249 115.705 45.5822 110.541 39.6485 103.251C33.7149 95.9607 30.312 86.9392 29.9527 77.5463C29.5935 68.1534 32.2974 58.8983 37.6569 51.1762C43.0164 43.454 50.7409 37.6834 59.666 34.7343C68.5911 31.7851 78.2331 31.8172 87.1383 34.8258C96.0436 37.8343 103.729 43.6563 109.037 51.4139"/></svg>
      </button>
    </div>
  </div>

  <div class="board-wrap" id="boardWrap">
    <svg class="maze-svg" id="mazeSvg" overflow="visible"></svg>
    <div class="tap-grid" id="tapGrid"></div>
  </div>

  <div class="celebration" id="celebration"></div>

<script>
(function(){
  "use strict";

  var DIR = { N: 1, E: 2, S: 4, W: 8 };
  var OPPOSITE = { 1: 4, 2: 8, 4: 1, 8: 2 };
  var DELTA = { 1: [-1, 0], 2: [0, 1], 4: [1, 0], 8: [0, -1] };
  var ALL_DIRS = [1, 2, 4, 8];

  // Hard is rectangular rather than a bigger square: it extends along
  // whichever axis the screen itself is long on (columns on a wide desktop
  // window, rows on a narrow phone) via hardDims() below, so it gains real
  // length/complexity without cells shrinking past a comfortable tap target
  // on the axis that's already constrained.
  var HARD_LONG = 18, HARD_SHORT = 11;

  var TIER_MAZE = {
    easy:   { cols: 10, rows: 10, braid: 0 },
    medium: { cols: 13, rows: 13, braid: 0.12 },
    hard:   { braid: 0.22 }
  };

  // Matches the CSS breakpoint the phone control tray switches on
  // (`@media (max-width: 767px), (max-height: 500px)`), so "vertical on
  // mobile" lines up with the same layout the page is already using.
  function hardDims(){
    var vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    var mobile = window.innerWidth <= 767 || vh <= 500;
    return mobile ? { cols: HARD_SHORT, rows: HARD_LONG } : { cols: HARD_LONG, rows: HARD_SHORT };
  }

  var state = {
    cols: 10,
    rows: 10,
    walls: null,
    player: 0,
    exit: 0,
    difficulty: 'easy',
    busy: false
  };

  var els = {
    boardWrap: document.getElementById('boardWrap'),
    mazeSvg: document.getElementById('mazeSvg'),
    tapGrid: document.getElementById('tapGrid'),
    celebration: document.getElementById('celebration'),
    diffGroup: document.getElementById('diffGroup'),
    backBtn: document.getElementById('backBtn'),
    refreshBtn: document.getElementById('refreshBtn'),
    controlsSlider: document.getElementById('controlsSlider')
  };

  function updateAppHeight(){
    var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty('--app-height', h + 'px');
    if (state.cols) sizeBoardWrap(state.cols, state.rows);
  }
  updateAppHeight();
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', updateAppHeight);
    window.visualViewport.addEventListener('scroll', updateAppHeight);
  } else {
    window.addEventListener('resize', updateAppHeight);
  }

  var landscapeBlockMQ = window.matchMedia('(max-height:500px) and (min-width:500px) and (orientation:landscape)');
  var wasInLandscapeBlock = landscapeBlockMQ.matches;
  function onLandscapeBlockChange(e){
    if (wasInLandscapeBlock && !e.matches) {
      location.reload();
    }
    wasInLandscapeBlock = e.matches;
  }
  if (landscapeBlockMQ.addEventListener) {
    landscapeBlockMQ.addEventListener('change', onLandscapeBlockChange);
  } else if (landscapeBlockMQ.addListener) {
    landscapeBlockMQ.addListener(onLandscapeBlockChange);
  }

  // ---------- maze generation ----------

  function idx(r, c, cols){ return r * cols + c; }
  function inBounds(r, c, cols, rows){ return r >= 0 && r < rows && c >= 0 && c < cols; }

  function shuffle(arr){
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  // Recursive backtracking (iterative, randomized-neighbor DFS): returns a
  // Uint8Array(cols*rows) of per-cell open-passage bitmasks with exactly one
  // path between any two cells (a "perfect" maze, zero loops).
  function generatePerfectMaze(cols, rows){
    var walls = new Uint8Array(cols * rows);
    var visited = new Uint8Array(cols * rows);
    var stack = [0];
    visited[0] = 1;

    while (stack.length) {
      var current = stack[stack.length - 1];
      var r = Math.floor(current / cols), c = current % cols;
      var dirs = shuffle(ALL_DIRS.slice());
      var advanced = false;

      for (var k = 0; k < dirs.length; k++) {
        var dir = dirs[k];
        var d = DELTA[dir];
        var nr = r + d[0], nc = c + d[1];
        if (!inBounds(nr, nc, cols, rows)) continue;
        var ni = idx(nr, nc, cols);
        if (visited[ni]) continue;

        walls[current] |= dir;
        walls[ni] |= OPPOSITE[dir];
        visited[ni] = 1;
        stack.push(ni);
        advanced = true;
        break;
      }
      if (!advanced) stack.pop();
    }
    return walls;
  }

  function popcount4(b){ return (b & 1) + ((b >> 1) & 1) + ((b >> 2) & 1) + ((b >> 3) & 1); }

  // Rejoins some dead ends into loops so a maze has more than one route through
  // a stretch of it, without needing a bigger (harder-to-tap) grid.
  function braid(walls, cols, rows, chance){
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var i = idx(r, c, cols);
        if (popcount4(walls[i]) !== 1) continue;
        if (Math.random() > chance) continue;

        var candidates = [];
        for (var k = 0; k < ALL_DIRS.length; k++) {
          var dir = ALL_DIRS[k];
          if (walls[i] & dir) continue;
          var d = DELTA[dir];
          var nr = r + d[0], nc = c + d[1];
          if (!inBounds(nr, nc, cols, rows)) continue;
          candidates.push({ dir: dir, ni: idx(nr, nc, cols) });
        }
        if (!candidates.length) continue;

        var deadEndCands = candidates.filter(function(cd){ return popcount4(walls[cd.ni]) === 1; });
        var pool = deadEndCands.length ? deadEndCands : candidates;
        var pick = pool[Math.floor(Math.random() * pool.length)];
        walls[i] |= pick.dir;
        walls[pick.ni] |= OPPOSITE[pick.dir];
      }
    }
  }

  // ---------- rendering ----------

  var SVG_NS = 'http://www.w3.org/2000/svg';

  function renderWalls(cols, rows){
    var svg = els.mazeSvg;
    svg.setAttribute('viewBox', '0 0 ' + cols + ' ' + rows);
    svg.innerHTML = '';

    function line(x1, y1, x2, y2){
      var l = document.createElementNS(SVG_NS, 'line');
      l.setAttribute('x1', x1); l.setAttribute('y1', y1);
      l.setAttribute('x2', x2); l.setAttribute('y2', y2);
      l.setAttribute('class', 'wall-line');
      svg.appendChild(l);
    }

    line(0, 0, cols, 0);
    line(0, rows, cols, rows);
    line(0, 0, 0, rows);
    line(cols, 0, cols, rows);

    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var i = idx(r, c, cols);
        if (!(state.walls[i] & DIR.S) && r < rows - 1) line(c, r + 1, c + 1, r + 1);
        if (!(state.walls[i] & DIR.E) && c < cols - 1) line(c + 1, r, c + 1, r + 1);
      }
    }

    // exit ring (static breathing marker, same visual language as Connect the Dots)
    var er = Math.floor(state.exit / cols), ec = state.exit % cols;
    var ring1 = document.createElementNS(SVG_NS, 'circle');
    ring1.setAttribute('class', 'target-ring r1');
    ring1.setAttribute('cx', ec + 0.5); ring1.setAttribute('cy', er + 0.5); ring1.setAttribute('r', 0.16);
    var ring2 = document.createElementNS(SVG_NS, 'circle');
    ring2.setAttribute('class', 'target-ring r2');
    ring2.setAttribute('cx', ec + 0.5); ring2.setAttribute('cy', er + 0.5); ring2.setAttribute('r', 0.22);
    svg.appendChild(ring1);
    svg.appendChild(ring2);

    var token = document.createElementNS(SVG_NS, 'g');
    token.setAttribute('id', 'playerToken');
    token.setAttribute('class', 'player-token');
    var dot = document.createElementNS(SVG_NS, 'circle');
    dot.setAttribute('class', 'token-face');
    dot.setAttribute('cx', 0.5); dot.setAttribute('cy', 0.5); dot.setAttribute('r', 0.32);
    token.appendChild(dot);
    [0.398, 0.602].forEach(function(ex){
      var eye = document.createElementNS(SVG_NS, 'circle');
      eye.setAttribute('class', 'token-eye');
      eye.setAttribute('cx', ex); eye.setAttribute('cy', 0.43); eye.setAttribute('r', 0.045);
      token.appendChild(eye);
    });
    svg.appendChild(token);
    els.playerToken = token;

    setTokenPosition(0, 0);
  }

  function buildTapGridDom(cols, rows){
    els.tapGrid.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
    els.tapGrid.style.gridTemplateRows = 'repeat(' + rows + ', 1fr)';
    els.tapGrid.innerHTML = '';
    for (var i = 0; i < cols * rows; i++) {
      var cell = document.createElement('div');
      cell.className = 'tap-cell';
      cell.dataset.i = i;
      cell.addEventListener('click', onCellClick);
      els.tapGrid.appendChild(cell);
    }
  }

  function setTokenPosition(r, c){
    els.playerToken.style.transform = 'translate(' + c + 'px, ' + r + 'px)';
  }

  // The hard tier is rectangular, so the board can't just be a square capped
  // to the viewport -- size cells so both grid axes fit their own available
  // budget, keeping cells square. Budgets are measured off the real rendered
  // icon rows/tray rather than recomputed from --unit/--icon-size, so this
  // stays correct at every breakpoint without duplicating that math.
  //
  // Desktop: same technique as othello/tictactoe's own "fill the height"
  // boards -- the board fills all available height between the top and
  // bottom icon rows (their own real position, not a fixed guess), with the
  // width capped like theirs (94vw, max 720px).
  //
  // Mobile: no top reserve at all (the board is centered between the very
  // top of the page and the tray, since body's padding-top was dropped),
  // and the board's width matches the tray's own side inset ("site margin").
  function sizeBoardWrap(cols, rows){
    var vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    var mobile = window.innerWidth <= 767 || vh <= 500;
    var widthBudget, heightBudget;

    // The 720 sanity cap only applies to the axis each layout always fills
    // (height on desktop, width on mobile) -- the other, "follower" axis is
    // left to its own natural budget so a wide/tall rectangular grid can
    // still grow to actually reach that filled axis's full size, instead of
    // being capped at 720 itself and falling short of the square tiers.
    if (mobile) {
      var trayRect = els.controlsSlider.getBoundingClientRect();
      var reserveBottom = parseFloat(getComputedStyle(document.body).paddingBottom);
      widthBudget = Math.min(window.innerWidth - trayRect.left * 2, 720);
      heightBudget = vh - reserveBottom;
    } else {
      var r = els.diffGroup.getBoundingClientRect();
      var reserve = r.top * 2 + r.height; // icon row height + gap above + matching gap below
      widthBudget = window.innerWidth * 0.94;
      heightBudget = Math.min(vh - reserve * 2, 720);
    }

    var cell = Math.min(widthBudget / cols, heightBudget / rows);
    els.boardWrap.style.width = (cell * cols) + 'px';
    els.boardWrap.style.height = (cell * rows) + 'px';
  }

  // ---------- interaction ----------

  function bumpWall(dir){
    var d = DELTA[dir];
    els.playerToken.style.setProperty('--bx', (d[1] * 0.18) + 'px');
    els.playerToken.style.setProperty('--by', (d[0] * 0.18) + 'px');
    els.playerToken.classList.add('bump');
    setTimeout(function(){ els.playerToken.classList.remove('bump'); }, 180);
  }

  function degree(cellWalls){ return popcount4(cellWalls); }

  // Starting at `fromCell` and heading in the already-confirmed-open direction
  // `dir`, keeps walking forward through plain pass-through cells (exactly 2
  // open sides) and returns every cell up to (and including) the first dead
  // end, junction (3-4 open sides), or the exit -- i.e. the next real decision
  // point -- plus the direction of that final step (so a caller can tell which
  // side of the decision point it arrived from). Tapping any dot along this
  // trail, or pressing an arrow key, travels the whole way in one move instead
  // of one tap per single cell.
  function traceCorridor(fromCell, dir){
    var cols = state.cols;
    var path = [];
    var cur = fromCell;
    while (true) {
      var d = DELTA[dir];
      var r = Math.floor(cur / cols) + d[0], c = cur % cols + d[1];
      var next = idx(r, c, cols);
      path.push(next);
      cur = next;
      if (cur === state.exit) break;
      if (degree(state.walls[cur]) !== 2) break;
      var cameFromDir = OPPOSITE[dir];
      var forward = null;
      for (var k = 0; k < ALL_DIRS.length; k++) {
        var dd = ALL_DIRS[k];
        if ((state.walls[cur] & dd) && dd !== cameFromDir) { forward = dd; break; }
      }
      if (forward === null) break;
      dir = forward;
    }
    return { path: path, dir: dir };
  }

  // For each open direction from the player, trace to the next real decision
  // point (skipping plain pass-through cells). A dead end or the exit is
  // itself the target -- there's nothing further to choose. A junction's
  // target is each branch one step beyond it, in every open direction except
  // the one just arrived from -- so the hint shows the upcoming choice itself
  // (e.g. "left or straight ahead") rather than just a single dot marking
  // that the junction is reachable. Each target carries the FULL path from
  // the player to it (through the junction, not stopping there), so tapping
  // a branch dot animates the whole way in one move.
  function reachableTargets(){
    var cols = state.cols;
    var targets = [];
    for (var k = 0; k < ALL_DIRS.length; k++) {
      var dir = ALL_DIRS[k];
      if (!(state.walls[state.player] & dir)) continue;
      var trace = traceCorridor(state.player, dir);
      var endCell = trace.path[trace.path.length - 1];
      var deg = degree(state.walls[endCell]);

      if (endCell === state.exit || deg <= 2) {
        targets.push({ cell: endCell, path: trace.path });
        continue;
      }

      var cameFromDir = OPPOSITE[trace.dir];
      var er = Math.floor(endCell / cols), ec = endCell % cols;
      for (var j = 0; j < ALL_DIRS.length; j++) {
        var branchDir = ALL_DIRS[j];
        if (branchDir === cameFromDir) continue;
        if (!(state.walls[endCell] & branchDir)) continue;
        var bd = DELTA[branchDir];
        var ni = idx(er + bd[0], ec + bd[1], cols);
        targets.push({ cell: ni, path: trace.path.concat([ni]) });
      }
    }
    return targets;
  }

  function onCellClick(e){
    if (state.busy) return;
    var j = Number(e.currentTarget.dataset.i);
    if (j === state.player) return;

    var targets = reachableTargets();
    for (var i = 0; i < targets.length; i++) {
      var tapIndex = targets[i].path.indexOf(j);
      if (tapIndex !== -1) {
        animateAlongPath(targets[i].path.slice(0, tapIndex + 1));
        return;
      }
    }

    // Not reachable via any open corridor -- if it's the immediate neighbor
    // just blocked by a wall, bump; otherwise it's not adjacent at all, so
    // there's no near-miss worth acknowledging and the tap is silently ignored.
    var cols = state.cols;
    var r1 = Math.floor(state.player / cols), c1 = state.player % cols;
    var r2 = Math.floor(j / cols), c2 = j % cols;
    var dr = r2 - r1, dc = c2 - c1;
    if (Math.abs(dr) + Math.abs(dc) === 1) {
      var blockedDir = dr === -1 ? DIR.N : dr === 1 ? DIR.S : dc === 1 ? DIR.E : DIR.W;
      bumpWall(blockedDir);
    }
  }

  // Dots mark only the single cell immediately next to the player in each
  // open direction -- never anything further down a corridor. A dot planted
  // out at the next junction previews that junction's shape (how many ways
  // it branches) before the player has actually walked there, which gives
  // away information the maze is supposed to reveal by exploring, not by
  // looking at the hints. Tapping still auto-runs the whole corridor via
  // reachableTargets()/onCellClick() -- only what's drawn on screen changes.
  function updateReachableHints(){
    var cells = els.tapGrid.children;
    for (var i = 0; i < cells.length; i++) cells[i].classList.remove('reachable');
    var cols = state.cols;
    var r = Math.floor(state.player / cols), c = state.player % cols;
    for (var k = 0; k < ALL_DIRS.length; k++) {
      var dir = ALL_DIRS[k];
      if (!(state.walls[state.player] & dir)) continue;
      var d = DELTA[dir];
      var ni = idx(r + d[0], c + d[1], cols);
      cells[ni].classList.add('reachable');
    }
  }

  // One continuous glide from the current cell through every cell in `path`
  // to the next decision point, instead of a discrete stop-start hop per
  // cell -- the token visually follows the corridor's own turns (each cell
  // center is a keyframe), but plays as a single smooth motion.
  var STEP_MS = 150;
  function animateAlongPath(path){
    if (!path.length) return;
    state.busy = true;

    var cells = [state.player].concat(path);
    var keyframes = cells.map(function(cell){
      var r = Math.floor(cell / state.cols), c = cell % state.cols;
      return { transform: 'translate(' + c + 'px, ' + r + 'px)' };
    });

    var lastCell = path[path.length - 1];
    var lastR = Math.floor(lastCell / state.cols), lastC = lastCell % state.cols;
    var duration = Math.max(220, path.length * STEP_MS);

    var anim = els.playerToken.animate(keyframes, { duration: duration, easing: 'ease-in-out' });
    anim.onfinish = function(){
      state.player = lastCell;
      setTokenPosition(lastR, lastC);
      state.busy = false;
      updateReachableHints();
      if (state.player === state.exit) showCelebration();
    };
  }

  // Arrow keys work as a bonus, unadvertised alternative to tapping -- moves
  // the whole way to the next decision point in that direction, same as
  // tapping the farthest dot in a trail.
  var KEY_DIR = { ArrowUp: DIR.N, ArrowDown: DIR.S, ArrowLeft: DIR.W, ArrowRight: DIR.E };
  document.addEventListener('keydown', function(e){
    var dir = KEY_DIR[e.key];
    if (!dir || state.busy) return;
    e.preventDefault();
    if (!(state.walls[state.player] & dir)) { bumpWall(dir); return; }
    animateAlongPath(traceCorridor(state.player, dir).path);
  });

  // ---------- flow ----------

  function startGame(){
    var tier = TIER_MAZE[state.difficulty];
    var dims = state.difficulty === 'hard' ? hardDims() : { cols: tier.cols, rows: tier.rows };
    state.cols = dims.cols;
    state.rows = dims.rows;
    state.walls = generatePerfectMaze(dims.cols, dims.rows);
    braid(state.walls, dims.cols, dims.rows, tier.braid);
    state.player = 0;
    state.exit = dims.cols * dims.rows - 1;
    state.busy = false;
    els.boardWrap.classList.remove('busy');
    sizeBoardWrap(dims.cols, dims.rows);
    buildTapGridDom(dims.cols, dims.rows);
    renderWalls(dims.cols, dims.rows);
    updateReachableHints();
  }

  // ---------- celebration ----------

  var CELEBRATION_FACE_SVG = '<svg class="celebration-face" viewBox="0 0 786.799 291.08" style="--final-scale:1;">' +
    '<path fill="var(--bright)" d="M583 101C583 127.56 578.2 152.2 568.6 174.92C558.68 197.96 545.08 218.12 527.8 235.4C510.2 253 489.88 266.6 466.84 276.2C443.8 286.12 419.16 291.08 392.92 291.08C366.36 291.08 341.72 286.12 319 276.2C295.96 266.6 275.8 253 258.52 235.4C240.92 218.12 227.32 197.96 217.72 174.92C207.8 152.2 202.84 127.56 202.84 101L223 101C223 124.68 227.48 146.76 236.44 167.24C245.08 187.72 257.24 205.64 272.92 221C288.28 236.68 306.2 248.84 326.68 257.48C347.16 266.44 369.24 270.92 392.92 270.92C416.6 270.92 438.68 266.44 459.16 257.48C479.64 248.84 497.72 236.68 513.4 221C528.76 205.64 540.92 187.72 549.88 167.24C558.52 146.76 562.84 124.68 562.84 101L583 101Z"/>' +
    '<path fill="var(--bright)" d="M751.759 72.96C741.999 72.96 733.679 69.6 726.799 62.88C720.079 56.16 716.719 47.44 716.719 36.72C716.719 25.84 720.079 17.04 726.799 10.32C733.679 3.44001 741.999 0 751.759 0C761.519 0 769.759 3.44001 776.479 10.32C783.359 17.04 786.799 25.84 786.799 36.72C786.799 47.44 783.359 56.16 776.479 62.88C769.759 69.6 761.519 72.96 751.759 72.96Z"/>' +
    '<path fill="var(--bright)" d="M35.04 72.96C25.28 72.96 16.96 69.6 10.08 62.88C3.36002 56.16 0 47.44 0 36.72C0 25.84 3.36002 17.04 10.08 10.32C16.96 3.44001 25.28 0 35.04 0C44.8 0 53.04 3.44001 59.76 10.32C66.64 17.04 70.08 25.84 70.08 36.72C70.08 47.44 66.64 56.16 59.76 62.88C53.04 69.6 44.8 72.96 35.04 72.96Z"/>' +
    '</svg>';

  // A maze has no lose state -- reaching the exit is the only outcome, so this
  // always shows the win face on the shared success-green, unlike the two-outcome
  // showCelebration(isWin) other games use.
  function showCelebration(){
    updateAppHeight();
    els.celebration.innerHTML = CELEBRATION_FACE_SVG;
    document.body.style.background = 'var(--success)';
    els.boardWrap.style.display = 'none';
    els.celebration.style.display = 'flex';
    setTimeout(function(){
      els.celebration.style.display = 'none';
      els.boardWrap.style.display = '';
      document.body.style.background = '';
      startGame();
    }, 3000);
  }

  els.diffGroup.addEventListener('click', function(e){
    var btn = e.target.closest('.diff-btn');
    if (!btn) return;
    state.difficulty = btn.dataset.tier;
    els.diffGroup.querySelectorAll('.diff-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    startGame();
  });
  els.refreshBtn.addEventListener('click', startGame);
  els.backBtn.addEventListener('click', function(){ window.location.href = '../../index.html'; });

  els.diffGroup.querySelector('[data-tier="easy"]').classList.add('active');
  startGame();
})();
</script>
