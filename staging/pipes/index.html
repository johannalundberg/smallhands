<style>
  :root{
    /* Figma node 417:5256 (layout from 412:5049): rust page, dark brown
       tiles outlined in pink, pipes cut out of the tiles in the page colour
       that turn pink when the water runs through. */
    --bg:#8E4424;
    --tile:#5C3518;
    --tile-hover:#4F2D14; /* hover/press: a step darker than --tile */
    --line:#DC51D8;
    --pipe:#8E4424;
    --water:#DC51D8;
    --success:#0B94A0; /* the solved water (teal, her pick) */
    --bright:#E4E4E4;
    --ink:#202020;
    --ink-muted:rgba(32,32,32,0.4);
    --incorrect:#F2383B;
    /* Figma frame: 1728x1117. --board-size is the most the board's squares
       may span (the height limit); --board-w the room across, which also has
       to hold the start and goal pieces either side of the board. */
    --board-size: min(76vmin, 76vw, 570px);
    --board-w: calc(100vw - 2 * var(--unit));
    --unit: 1.1574vw;
    --icon-size: clamp(44px, 8.912vw, 154px);
  }

  @media (min-width: 768px) and (max-width: 1023px) and (min-height: 501px){
    :root{
      --unit: 2.3981vw;
      --icon-size: clamp(80px, 11.4824vw, 120px);
    }
  }

  /* Tablet/desktop: size the board against the room left between the top and
     bottom icon rows, same as Unblock, Number Puzzle and Othello. 743px is
     the board's size in Unblock's Figma frame. */
  @media (min-width: 768px){
    :root{
      --v-reserve-top: calc(var(--icon-size) + 2 * var(--unit));
      --v-reserve-bottom: calc(var(--icon-size) + 2 * var(--unit));
      --board-size: min(calc(var(--app-height, 100vh) - var(--v-reserve-top) - var(--v-reserve-bottom)), 743px);
    }
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  /* The start and goal pipes may run off the screen on a phone: cut them
     at the edge instead of letting the page scroll sideways. */
  html, body{ overflow-x:hidden; overflow-x:clip; }
  body{
    position:relative;
    margin:0;
    height: var(--app-height, 100vh);
    background:var(--bg);
    color:var(--bright);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select:none;
    user-select:none;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action:manipulation;
    transition: background 80ms ease;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  /* ---------- icon buttons (difficulty / back / refresh) ---------- */
  .icon-btn{
    appearance:none;
    background:none;
    border:none;
    cursor:pointer;
    width:var(--icon-size);
    height:var(--icon-size);
    aspect-ratio:1;
    border-radius:50%;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:none;
    transform: translateZ(0);
    -webkit-transform: translateZ(0);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    transition: transform 120ms ease;
  }
  .icon-btn:active{ transform: translateZ(0) scale(0.94); }
  @media (hover:hover) and (pointer:fine){
    .icon-btn:hover{ transform: translateZ(0) scale(1.035); }
  }
  .icon-btn svg{ width:100%; height:100%; display:block; }
  .icon-btn .fill-bg{ transition: fill 120ms ease; }

  .diff-group{ position:absolute; right:var(--unit); top:var(--unit); display:flex; gap:calc(var(--icon-size) * 0.1); z-index:2; }
  .diff-btn .fill-bg{ fill:var(--ink-muted); }
  .diff-btn.active .fill-bg{ fill:var(--bright); }

  .btn-row{ position:absolute; left:var(--unit); bottom:var(--unit); display:flex; gap:calc(var(--icon-size) * 0.1); z-index:2; }

  @media (min-width: 768px) and (max-width: 1023px) and (min-height: 501px){
    .diff-group, .btn-row{ gap: calc(var(--icon-size) * 0.1253); }
  }

  .controls-slider{ display:contents; }

  .progress-dots{
    position:absolute;
    right:var(--unit);
    bottom:var(--unit);
    z-index:2;
    display:flex;
    align-items:center;
    gap: calc(var(--icon-size) * 0.08);
  }
  .progress-dots .dot{
    width: calc(var(--icon-size) * 0.25);
    height: calc(var(--icon-size) * 0.25);
    border-radius:50%;
    background: var(--ink-muted);
    transition: background 150ms ease;
  }
  .progress-dots .dot.done{ background: var(--bright); }

  /* ---------- the board ---------- */
  /* Figma node 412:5049: --n squares a side (4, 5 or 6 by level), each a
     tile with a 1px pink outline, set edge to edge, plus a 1px border round
     the board -- so every line is 2px, between tiles and round the outside
     alike, like Othello's (the sketch's own 2px-per-tile outlines doubled
     up to 4px inside). snapBoard keeps the board on whole pixels, or Safari
     rounds each edge its own way and lines come out 1px here, 2px there. --cell is one square in whole
     pixels (fractional ones made Safari draw the lines unevenly). The start
     and goal pipes stick out --stub squares on either side. --stub-room is
     how much of that the board leaves room for: all of it on tablets and
     desktops, none on phones, where the board takes the full width between
     the margins and the pipes run on off the screen edge. */
  .board-wrap{
    position:relative;
    --n: 4;
    --start-row: 0;
    --end-row: 0;
    --stub: 0.3558;
    --stub-room: var(--stub);
    --cell: min(calc(var(--board-size) / var(--n)), calc(var(--board-w) / (var(--n) + 2 * var(--stub-room))));
    width:calc(var(--cell) * var(--n) + 2px);
    height:calc(var(--cell) * var(--n) + 2px);
    border:1px solid var(--line);
    /* A pipe is 32 of the tile's 185.49 in the design (of the pipe
       drawing, which is 2px bigger than the tile -- see .pipe) -- on 4x4.
       Smaller tiles get a bigger share (--pipe-k, and the stroke-width in
       .pipe path to match), or on 6x6 the pipes and the start and goal got
       too thin to see. */
    --pipe-k: 0.17252;
    --pipe-w: calc((var(--cell) + 2px) * var(--pipe-k));
    touch-action:manipulation;
  }
  @supports (width: round(down, 10.5px, 1px)){
    .board-wrap{
      --cell: round(down, min(calc(var(--board-size) / var(--n)), calc(var(--board-w) / (var(--n) + 2 * var(--stub-room)))), 1px);
    }
  }
  .lot{
    position:absolute;
    inset:0;
    z-index:2;
  }
  .spot{
    position:absolute;
    width:var(--cell);
    height:var(--cell);
    background:var(--tile);
    border:1px solid var(--line);
    transition: background 120ms ease;
  }
  .piece{
    cursor:pointer;
    touch-action:manipulation;
    -webkit-touch-callout:none;
    transition: background 120ms ease;
  }
  /* Pressed (touch or mouse), and under a mouse pointer: the tile turns
     slightly darker. No grow or shrink -- she found size changes too much. */
  .piece:active{ background:var(--tile-hover); }
  /* A tap is over too quickly for :active to show, so each tap also starts
     the tile dark and fades it back (onTap adds .tap). */
  .piece.tap{ animation: tile-tap 320ms ease-out; }
  @keyframes tile-tap{ from{ background-color:var(--tile-hover); } }
  @media (hover:hover) and (pointer:fine){
    .piece:hover{ background:var(--tile-hover); }
  }
  /* The pipe drawing covers the whole tile, outline included, plus 1px
     more on every side, and turns around the tile's centre. A dry pipe
     stops at the tile's pink outline (the clip); a wet one runs over it and
     1px on, onto the neighbour's outline, so two wet pipes overlap there
     instead of just touching -- touching, their softened edges left a dark
     hairline at every joint. That extra 1px only ever covers pink outline. */
  .pipe{
    position:absolute;
    left:-2px;
    top:-2px;
    width:calc(var(--cell) + 2px);
    height:calc(var(--cell) + 2px);
    pointer-events:none;
    clip-path:inset(2px);
    transition: transform 180ms cubic-bezier(0.25, 0.8, 0.35, 1);
  }
  .piece.wet .pipe{ clip-path:none; }
  .pipe path{
    fill:none;
    stroke:var(--pipe);
    stroke-width:17.252;
    stroke-linecap:butt;
    stroke-linejoin:miter;
    transition: stroke 150ms ease var(--flow-delay, 0ms);
  }
  .piece.wet .pipe path{ stroke:var(--water); }
  .board-wrap[data-n="5"]{ --pipe-k: 0.195; }
  .board-wrap[data-n="5"] .pipe path, .board-wrap[data-n="5"] .flow path{ stroke-width:19.5; }
  .board-wrap[data-n="6"]{ --pipe-k: 0.22; }
  .board-wrap[data-n="6"] .pipe path, .board-wrap[data-n="6"] .flow path{ stroke-width:22; }

  /* Where the water comes in and goes out (Figma 417:5251 and 417:5253):
     short pink pipes sticking out of the board on the start and end rows,
     66 of a tile's 185.49 long. Both are pink from the start -- the right
     one marks the goal. */
  .stub{
    position:absolute;
    top:calc(var(--cell) * var(--row) + (var(--cell) - var(--pipe-w)) / 2);
    width:calc(var(--cell) * var(--stub));
    height:var(--pipe-w);
    background:var(--water);
    z-index:1;
  }
  .stub.start{ --row: var(--start-row); right:100%; }
  .stub.end{ --row: var(--end-row); left:100%; }

  /* Solved: teal water (--success) flows along the route from
     the start pipe to the goal at an even speed and stays until the next
     board. Each wet tile gets a green copy of its pipe, drawn the way the
     water runs through it (.flow, built in onSolved, not turned with the
     tile), revealed from where the water comes in over --flow-ms, starting
     the moment the tile before it is full -- so the green runs on smoothly
     instead of filling a tile at a time. (The comments below still say
     "green" for this solved water.) */
  .flow{
    position:absolute;
    left:-2px;
    top:-2px;
    width:calc(var(--cell) + 2px);
    height:calc(var(--cell) + 2px);
    pointer-events:none;
  }
  .flow path{
    fill:none;
    stroke:var(--success);
    stroke-width:17.252;
    stroke-linecap:butt;
    stroke-linejoin:miter;
    stroke-dasharray:100 101;
    stroke-dashoffset:100;
    animation: flow-in var(--flow-ms, 100ms) linear var(--glow-delay, 0ms) forwards;
  }
  @keyframes flow-in{ to{ stroke-dashoffset:0; } }
  .stub::after{
    content:'';
    position:absolute;
    inset:0;
    background:var(--success);
    transform:scaleX(0);
    transform-origin:left;
  }
  .stub.glow::after{ animation: stub-fill var(--flow-ms, 100ms) linear var(--glow-delay, 0ms) forwards; }
  @keyframes stub-fill{ to{ transform:scaleX(1); } }

  @keyframes bounce-in{
    0%{ transform:scale(0); opacity:0; }
    100%{ transform:scale(var(--final-scale)); opacity:1; }
  }
  .celebration{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:4;
  }
  .celebration-face{
    width:min(70vmin, 700px);
    height:auto;
    animation: bounce-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  /* ---------- phone: single scrollable slider-menu bar ---------- */
  @media (max-width: 767px), (max-height: 500px){
    /* Touch has no hover, so desktop's grow-on-hover feedback never fires
       here -- darken on tap instead, so pressing any icon button is
       actually visible. (The icons inside the tray deliberately don't grow:
       the tray itself is the thing that grows, see .controls-slider:active.) */
    .icon-btn:active{ transform: translateZ(0); filter: brightness(0.7); }
    .board-wrap{ --stub-room: 0; }
    /* ...and always run past the screen edge, even on 6x6 where a third of
       a tile is shorter than the margin. */
    .stub{ width:calc((100vw - var(--cell) * var(--n)) / 2 + 12px); }
    :root{
      --unit: 5.089vw;
      --icon-size: clamp(52px, 20.5344vw, 100px);
      /* Full width between the side margins, like Unblock's board (and the
         tray below it): small fingers tap the squares, so every extra pixel
         of square helps. The height limit leaves room for the progress dots
         above and the tray below. */
      --board-size: calc(var(--app-height, 100vh) - var(--unit) * 4 - var(--icon-size) * 1.25);
    }
    .controls-slider{
      display:flex;
      align-items:flex-end;
      gap: calc(var(--icon-size) * 0.1239);
      position:fixed;
      left:var(--unit);
      right:var(--unit);
      bottom:var(--unit);
      z-index:3;
      background: rgba(32,32,32,0.4);
      border-radius:999px;
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    .controls-slider::-webkit-scrollbar{ display:none; }
    /* Press feedback for the tray itself, like the icons and tiles: it grows
       slightly while touched (:active also matches while any button inside it
       is held, so tapping an icon gives both). */
    .controls-slider{ transition: transform 120ms ease; }
    .controls-slider:active{ transform: scale(1.03); }
    .diff-group, .btn-row{ display:contents; }
    .progress-dots{ left:var(--unit); top:var(--unit); right:auto; bottom:auto; }
    body{
      padding-top: calc(var(--unit) * 2 + var(--icon-size) * 0.25);
      padding-bottom: calc(var(--unit) * 2 + var(--icon-size));
    }
  }

  @media (max-height: 500px) and (min-width: 500px) and (orientation: landscape){
    :root{
      --unit: clamp(8px, 3.5vh, 14px);
      --icon-size: clamp(40px, 14vh, 64px);
    }
  }

  /* No game here is designed to work in phone landscape — rather than a half-broken
     cramped layout, block it outright with a plain "please rotate" screen. Matches
     the same phone-landscape condition already used elsewhere (a landscape tablet has
     enough height to stay excluded and keeps its normal, working layout). */
  .rotate-block{
    display:none;
    position:fixed;
    top: calc(-1 * env(safe-area-inset-top, 0px));
    right: calc(-1 * env(safe-area-inset-right, 0px));
    bottom: calc(-1 * env(safe-area-inset-bottom, 0px));
    left: calc(-1 * env(safe-area-inset-left, 0px));
    background:var(--incorrect);
    z-index:9999;
    align-items:center;
    justify-content:center;
  }
  .rotate-block svg{ width:min(50vh, 320px); height:auto; }
  @media (max-height: 500px) and (min-width: 500px) and (orientation: landscape){
    .rotate-block{ display:flex; }
  }
  /* No double-tap zoom anywhere. touch-action doesn't reach into a scrolling
     element (the mobile tray scrolls sideways), so the tray needs its own:
     two quick taps on the level buttons there zoomed the whole page in, and
     with zoom otherwise locked there was no way back out. */
  html, body, .controls-slider{ touch-action:manipulation; }
</style>

<script src="../../sound.js?v=20261025ze"></script>
<script>
(function(){
  "use strict";


  // iOS Safari only applies :active styles on tap if some element on the
  // page has a touch listener -- this is that listener (a no-op is enough).
  document.addEventListener('touchstart', function(){}, { passive: true });

  // Each level is [pieces, turns, start row, end row, fewest taps]. Pieces are
  // read row by row on a square board (4x4 easy, 5x5 medium, 6x6 hard): 'I' a
  // straight pipe, 'L' a corner, 'T' a three-way, '.' an empty square. Turns
  // are the quarter turns clockwise each piece starts at, from its resting
  // shape (I up-down, L up-right, T up-right-down). Water comes in from the
  // left on the start row and must leave on the right on the end row.
  // Made offline: a random path from start to end, the matching pieces laid
  // on it, the other squares filled, then everything scrambled. The fewest
  // taps were found by one solver and checked by a second -- every board here
  // is solvable and not already solved.
  var LEVELS = {
    easy: [
      ['.......LILLIIILL', '0000000320211133', 3, 2, 3],
      ['....L..ILIILLIIL', '0000300022210101', 2, 2, 3],
      ['IIL..IIL..LI....', '2110030100020000', 0, 2, 3],
      ['.....IL.ILILILLL', '0000023001120110', 3, 3, 3],
      ['...LLLLILIIL....', '0003221001230000', 1, 0, 3],
      ['..LI..I.ILL.ILL.', '0011000001003330', 3, 0, 3],
      ['LIILLILII..I..LL', '1232332000030003', 1, 3, 3],
      ['.LLLLILILLI.L...', '0120130111103000', 3, 1, 3],
      ['....LLI.LLLL.LLI', '0000123010210023', 2, 3, 4],
      ['..I.LLLILLLL....', '0010131133320000', 2, 1, 4],
      ['...L.LLILLILILL.', '0001003023021310', 3, 0, 4],
      ['.LIIIII.LI..ILI.', '0210101000001330', 3, 0, 4],
      ['LL..ILLILLLII.I.', '3000012133012010', 0, 2, 4],
      ['IL..IIL..ILI.LLI', '3200001000110302', 0, 2, 4],
      ['.......I.ILLIIIL', '0000000000021232', 3, 2, 5],
      ['ILIIILI..I......', '0221121003000000', 1, 0, 5],
      ['...L...II.LIIIIL', '0002000000103012', 3, 0, 5],
      ['..LLLIILIL..L...', '0030130310001000', 3, 0, 5],
      ['....L.ILLILLLILI', '0000302122113112', 2, 1, 5],
      ['L...II..LLI.LLII', '0000010003201011', 0, 3, 5],
      ['.....L.LLLLLLLLL', '0000000021010322', 2, 2, 5],
      ['ILL.ILI..LI...LI', '3200330003000003', 1, 3, 5],
      ['.....I..ILLILLLL', '0000000012303130', 2, 2, 6],

  var ROUND_SIZE = 5;
  var ROTATE_MS = 180;      // matches the .pipe transition
  var FLOW_START_MS = 120;  // water moves on once a turn is mostly done
  var FLOW_STEP_MS = 55;    // water reaching one more square

  // ---------- pipe logic ----------
  // A piece's openings as bits, one per side. A quarter turn clockwise moves
  // every opening one side on: up to right, right to down, and so on.
  var UP = 1, RIGHT = 2, DOWN = 4, LEFT = 8;
  var SIDES = [UP, RIGHT, DOWN, LEFT];
  var ROW_STEP = [-1, 0, 1, 0];
  var COL_STEP = [0, 1, 0, -1];
  var SHAPES = { I: UP | DOWN, L: UP | RIGHT, T: UP | RIGHT | DOWN };

  function turnCW(m){ return ((m << 1) | (m >> 3)) & 15; }
  function facing(side){ return turnCW(turnCW(side)); }

  function openings(type, turns){
    var m = SHAPES[type] || 0;
    for (var i = 0; i < turns % 4; i++) m = turnCW(m);
    return m;
  }

  function parseLevel(entry){
    var n = Math.round(Math.sqrt(entry[0].length));
    var turns = [];
    for (var i = 0; i < entry[1].length; i++) turns.push(Number(entry[1].charAt(i)));
    return { n: n, types: entry[0], turns: turns, startRow: entry[2], endRow: entry[3] };
  }

  // Water spreads from the start through every pair of openings that face
  // each other. dist: how many squares from the start the water got to each
  // one (-1 dry), which is also the order the water shows up in.
  function flow(level, turns){
    var n = level.n, dist = [], i;
    for (i = 0; i < n * n; i++) dist.push(-1);
    var start = level.startRow * n;
    if (openings(level.types.charAt(start), turns[start]) & LEFT) {
      dist[start] = 0;
      var queue = [start];
      while (queue.length) {
        var cell = queue.shift();
        var m = openings(level.types.charAt(cell), turns[cell]);
        var r = Math.floor(cell / n), c = cell % n;
        for (var s = 0; s < 4; s++) {
          if (!(m & SIDES[s])) continue;
          var nr = r + ROW_STEP[s], nc = c + COL_STEP[s];
          if (nr < 0 || nc < 0 || nr >= n || nc >= n) continue;
          var next = nr * n + nc;
          if (dist[next] !== -1) continue;
          if (!(openings(level.types.charAt(next), turns[next]) & facing(SIDES[s]))) continue;
          dist[next] = dist[cell] + 1;
          queue.push(next);
        }
      }
    }
    var end = level.endRow * n + n - 1;
    var solved = dist[end] !== -1 && !!(openings(level.types.charAt(end), turns[end]) & RIGHT);
    return { dist: dist, solved: solved };
  }

  function updateAppHeight(){

  // Centring can leave the board at a fraction of a pixel (173.73px down),
  // and Safari then draws its 2px lines 1px on some edges. Nudge it onto
  // whole pixels after every layout change.
  function snapBoard(){
    var wrap = document.getElementById('boardWrap');
    if (!wrap) return;
    wrap.style.translate = '';

  document.addEventListener('visibilitychange', function(){

  // the moment the device leaves that blocked landscape state. A fresh load
  // can't inherit a stuck scale — there's nothing left to get stuck.

  var wasInLandscapeBlock = landscapeBlockMQ.matches;

    if (wasInLandscapeBlock && !e.matches) {
      saveResume();
      location.reload();
    }
    wasInLandscapeBlock = e.matches;
  }
  if (landscapeBlockMQ.addEventListener) {
    landscapeBlockMQ.addEventListener('change', onLandscapeBlockChange);
  } else if (landscapeBlockMQ.addListener) {
    landscapeBlockMQ.addListener(onLandscapeBlockChange); // older Safari
  }

  // Turning the phone back from the landscape block reloads the page (see
  // onLandscapeBlockChange). Save the game just before that reload and pick it
  // back up on the next load, so the player continues where they left off.
  // sessionStorage: this tab only, and only for this one reload.
  var RESUME_KEY = 'playandlearn.resume.pipes';
  var RESUME_MAX_AGE = 10 * 60 * 1000;
  function saveResume(){
    try {
      var data = snapshotGame();
      if (data) sessionStorage.setItem(RESUME_KEY, JSON.stringify({ at: Date.now(), data: data }));
    } catch (e) {}
  }
  function takeResume(){
    try {
      var raw = sessionStorage.getItem(RESUME_KEY);
      sessionStorage.removeItem(RESUME_KEY);
      if (!raw) return null;
      var saved = JSON.parse(raw);
      if (!saved || Date.now() - saved.at > RESUME_MAX_AGE) return null;
      return saved.data;
    } catch (e) { return null; }
  }

  // turns: null means "the last level was just solved, start the next one".
  function snapshotGame(){
    if (els.celebration.style.display === 'flex') return null; // round already won, a fresh round is right
    if (!state.level) return null;
    var progress = state.progress;
    var turns = state.turns.slice();
    if (state.busy) {
      // Mid water-flow: its timeout won't survive the reload, so count the
      // solve here and let restore move on to the next level.
      progress += 1;
      if (progress >= ROUND_SIZE) return null;
      turns = null;
    }
    return {
      difficulty: state.difficulty,
      round: state.round.slice(),
      progress: progress,
      turns: turns
    };
  }

  function isWholeNumber(v, min, max){
    return typeof v === 'number' && Math.floor(v) === v && v >= min && v <= max;
  }

  // Everything is checked before touching state or the DOM, so bad data just
  // falls back to a fresh round instead of leaving a half-built board.
  function restoreGame(data){
    if (!data || typeof data !== 'object') return false;
    if (TIERS.indexOf(data.difficulty) === -1) return false;
    var pool = LEVELS[data.difficulty];
    if (!Array.isArray(data.round) || data.round.length !== ROUND_SIZE) return false;
    for (var i = 0; i < data.round.length; i++) {
      if (!isWholeNumber(data.round[i], 0, pool.length - 1)) return false;
    }
    if (!isWholeNumber(data.progress, 0, ROUND_SIZE - 1)) return false;
    if (data.turns != null) {
      var level = parseLevel(pool[data.round[data.progress]]);
      if (!Array.isArray(data.turns) || data.turns.length !== level.n * level.n) return false;
      for (var t = 0; t < data.turns.length; t++) {
        if (!isWholeNumber(data.turns[t], 0, 3)) return false;
      }
      if (flow(level, data.turns).solved) return false;
    }

    state.difficulty = data.difficulty;
    els.diffGroup.querySelectorAll('.diff-btn').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-tier') === data.difficulty);
    });
    state.round = data.round.slice();
    state.progress = data.progress;
    updateProgressDots();
    buildLevel(data.turns); // same pieces turned the same way as before the reload
    return true;
  }

  function pickRound(tier){
    var idx = [];
    for (var i = 0; i < LEVELS[tier].length; i++) idx.push(i);
    for (var k = idx.length - 1; k > 0; k--) {
      var j = Math.floor(Math.random() * (k + 1));
      var t = idx[k]; idx[k] = idx[j]; idx[j] = t;
    }
    // Levels are listed easiest first, so sorting the pick makes each round
    // ramp up a little from its first level to its last.
    return idx.slice(0, ROUND_SIZE).sort(function(a, b){ return a - b; });
  }

  // ---------- drawing ----------
  // Each piece in its resting shape on a 100x100 tile, outline included.
  // Ends run to the edge and are cut flat there, so pipes that line up meet
  // as one. The corner bends round in a quarter circle (the sketch only
  // drew straights).
  var PIPE_PATHS = {
    I: 'M50 0V100',
    L: 'M50 0A50 50 0 0 0 100 50',
    T: 'M50 0V100M50 50H100'
  };

  function spinTransform(spins){ return 'rotate(' + (spins * 90) + 'deg)'; }

  // presetTurns (optional): saved turns to use instead of the level's start --
  // only passed when resuming after the rotate-block reload.
  function buildLevel(presetTurns){
    clearTimeout(winTimer);
    var level = parseLevel(LEVELS[state.difficulty][state.round[state.progress]]);
    state.level = level;
    state.turns = presetTurns ? presetTurns.slice() : level.turns.slice();
    state.spins = state.turns.slice();
    state.pieces = [];
    state.busy = false;
    els.celebration.style.display = 'none';
    els.boardWrap.style.display = '';
    els.boardWrap.style.setProperty('--n', level.n);
    els.boardWrap.setAttribute('data-n', level.n);
    els.boardWrap.style.setProperty('--start-row', level.startRow);
    els.boardWrap.style.setProperty('--end-row', level.endRow);
    [els.startStub, els.endStub].forEach(function(stub){
      stub.classList.remove('wet', 'glow');
      stub.style.removeProperty('--flow-delay');
    });

    // A new board is built once here; taps only change a piece's transform
    // and classes after this, never its contents (rebuilt contents can swallow
    // a tap that's still in progress).
    els.lot.innerHTML = '';
    requestAnimationFrame(snapBoard); // --n may have changed the board's size
    for (var i = 0; i < level.n * level.n; i++) {
      var type = level.types.charAt(i);
      var s = document.createElement('div');
      s.className = 'spot';
      s.style.left = 'calc(var(--cell) * ' + (i % level.n) + ')';
      s.style.top = 'calc(var(--cell) * ' + Math.floor(i / level.n) + ')';
      if (PIPE_PATHS[type]) {
        s.className = 'spot piece';
        s.setAttribute('data-cell', i);
        s.setAttribute('data-own-sound', ''); // see the tap handler
        s.innerHTML = '<svg class="pipe" viewBox="0 0 100 100" style="transform:' +
          spinTransform(state.spins[i]) + '"><path d="' + PIPE_PATHS[type] + '"/></svg>';
        state.pieces.push(s);
      } else {
        state.pieces.push(null);
      }
      els.lot.appendChild(s);
    }
    paintWater(false);
  }

  // Colour every piece the water reaches. animate: newly reached pieces fill
  // one after another, outward from the start, once the turn that opened the
  // way is mostly done; pieces cut off go dry at once. Returns the flow and
  // when each newly reached piece fills (ms from now).
  function paintWater(animate){
    var f = flow(state.level, state.turns);
    var delays = [];
    var firstNew = Infinity, lastNew = 0;
    state.pieces.forEach(function(el, i){
      if (!el || f.dist[i] === -1 || el.classList.contains('wet')) return;
      firstNew = Math.min(firstNew, f.dist[i]);
      lastNew = Math.max(lastNew, f.dist[i]);
    });
    // A long run of newly reached pieces fills faster per piece, so the
    // water never takes more than about a second to get through.
    var step = Math.min(FLOW_STEP_MS, 800 / Math.max(1, lastNew - firstNew));
    state.pieces.forEach(function(el, i){
      delays.push(null);
      if (!el) return;
      var wet = f.dist[i] !== -1;
      if (wet === el.classList.contains('wet')) return;
      var delay = wet && animate ? Math.round(FLOW_START_MS + (f.dist[i] - firstNew) * step) : 0;
      if (wet) delays[i] = delay;
      el.style.setProperty('--flow-delay', delay + 'ms');
      el.classList.toggle('wet', wet);
    });
    return { flow: f, delays: delays };
  }

  function updateProgressDots(){
    els.progressDots.forEach(function(dot, i){
      dot.classList.toggle('done', i < state.progress);
    });
  }

  function restartRound(){
    clearTimeout(celebrationTimer);
    state.round = pickRound(state.difficulty);
    state.progress = 0;
    updateProgressDots();
    buildLevel();
  }

  // ---------- tap to turn ----------
  // A tap turns the piece a quarter clockwise. The drawing keeps a running
  // count of quarter turns (never wrapped back to 0), so it always turns
  // forward, and a quick run of taps just moves its target on: the drawing
  // can lag a tap behind for a moment but always lands where the piece is.
  // One sound per tap, played here: sound.js only clicks for the classes it
  // knows (.piece isn't one, and data-own-sound would stop it if it ever
  // were), so this is the tap's only sound -- the click, or the happy sound
  // instead on the tap that brings the water through. Taps while the water
  // runs out are ignored, sound and all.
  els.lot.addEventListener('animationend', function(e){
    if (e.animationName === 'tile-tap') e.target.classList.remove('tap');
  });
  els.lot.addEventListener('click', function(e){
    var el = e.target.closest && e.target.closest('.piece');
    if (!el || state.busy) return;
    var i = Number(el.getAttribute('data-cell'));
    state.turns[i] = (state.turns[i] + 1) % 4;
    state.spins[i] += 1;
    el.firstChild.style.transform = spinTransform(state.spins[i]);
    el.classList.remove('tap');
    void el.offsetWidth; // restart the darken on quick repeat taps
    el.classList.add('tap');
    if (flow(state.level, state.turns).solved) {
      onSolved();
    } else {
      PLSound.play('click');
      paintWater(true);
    }
  });

  // ---------- solved ----------
  function onSolved(){
    state.busy = true;
    PLSound.play('positive');
    var painted = paintWater(true);
    var dist = painted.flow.dist;
    var n = state.level.n, end = state.level.endRow * n + n - 1;
    // The water runs on out through the end pipe right after the last square.
    var outAt = (painted.delays[end] != null ? painted.delays[end] : FLOW_START_MS) + FLOW_STEP_MS;
    els.endStub.style.setProperty('--flow-delay', outAt + 'ms');
    els.endStub.classList.add('wet');
    // Then green water flows along the route, from the start pipe to the end
    // pipe, one square every `step` ms -- quicker per square on long paths
    // so it never drags on.
    var far = 0;
    dist.forEach(function(d){ if (d > far) far = d; });
    var step = Math.round(Math.min(110, 1100 / (far + 2)));
    winTimer = setTimeout(function(){
      els.boardWrap.style.setProperty('--flow-ms', step + 'ms');
      els.startStub.style.setProperty('--glow-delay', '0ms');
      els.startStub.classList.add('glow');
      state.pieces.forEach(function(el, i){
        if (!el || dist[i] === -1) return;
        var flow = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        flow.setAttribute('class', 'flow');
        flow.setAttribute('viewBox', '0 0 100 100');
        flow.innerHTML = flowPaths(i, dist);
        flow.style.setProperty('--glow-delay', (dist[i] + 1) * step + 'ms');
        el.appendChild(flow);
      });
      els.endStub.style.setProperty('--glow-delay', (dist[end] + 2) * step + 'ms');
      els.endStub.classList.add('glow');
      winTimer = setTimeout(function(){
        state.progress += 1;
        updateProgressDots();
        if (state.progress >= ROUND_SIZE) {
          showCelebration();
        } else {
          buildLevel();
        }
      }, (far + 3) * step + 950); // the green holds a moment before the next board
    }, outAt + 150);
  }

  // The green water's way through square i, in the board's own directions
  // (not turned with the piece): from the side the water comes in -- the
  // neighbour one step nearer the start, or the left edge for the first
  // square -- to every other opening. Straight across, round the corner
  // for a bend (the same quarter circle the pipe is drawn with), or in to
  // the middle and out for a three-way. pathLength 100 lets every path be
  // revealed with the same dash numbers.
  var SIDE_MID = {}; SIDE_MID[UP] = [50, 0]; SIDE_MID[RIGHT] = [100, 50]; SIDE_MID[DOWN] = [50, 100]; SIDE_MID[LEFT] = [0, 50];
  function flowPaths(i, dist){
    var level = state.level, n = level.n;
    var type = level.types.charAt(i), m = openings(type, state.turns[i]);
    var r = Math.floor(i / n), c = i % n, entry = 0, s;
    if (dist[i] === 0) entry = LEFT;
    for (s = 0; s < 4 && !entry; s++) {
      if (!(m & SIDES[s])) continue;
      var nr = r + ROW_STEP[s], nc = c + COL_STEP[s];
      if (nr < 0 || nc < 0 || nr >= n || nc >= n) continue;
      var j = nr * n + nc;
      if (dist[j] === dist[i] - 1 && (openings(level.types.charAt(j), state.turns[j]) & facing(SIDES[s]))) entry = SIDES[s];
    }
    var a = SIDE_MID[entry], out = '';
    for (s = 0; s < 4; s++) {
      var side = SIDES[s];
      if (side === entry || !(m & side)) continue;
      var b = SIDE_MID[side], d;
      if (side === facing(entry)) {
        d = 'M' + a + 'L' + b;
      } else if (type === 'L') {
        var cx = (entry | side) & RIGHT ? 100 : 0, cy = (entry | side) & DOWN ? 100 : 0;
        var sweep = (a[0] - cx) * (b[1] - cy) - (a[1] - cy) * (b[0] - cx) > 0 ? 1 : 0;
        d = 'M' + a + 'A50 50 0 0 ' + sweep + ' ' + b;
      } else {
        d = 'M' + a + 'L50 50L' + b;
      }
      out += '<path pathLength="100" d="' + d + '"/>';
    }
    return out;
  }

  // Pixel-art smiley (Figma node 198:1809) -- two round eyes and a
  // stepped-block smile -- in the water's colour, on the page's own background.
  var CELEBRATION_FACE_SVG = '<svg class="celebration-face" viewBox="0 0 973 366" style="--final-scale:1;">' +
    '<circle fill="var(--water)" cx="65" cy="65" r="65"/>' +
    '<circle fill="var(--water)" cx="908" cy="65" r="65"/>' +
    '<rect fill="var(--water)" x="161" y="171" width="130" height="130"/>' +
    '<rect fill="var(--water)" x="683" y="171" width="130" height="130"/>' +
    '<rect fill="var(--water)" x="291" y="301" width="392" height="65"/>' +
    '</svg>';

  function showCelebration(){
    updateAppHeight();
    els.celebration.innerHTML = CELEBRATION_FACE_SVG;
    PLSound.play('complete');
    els.boardWrap.style.display = 'none';
    els.celebration.style.display = 'flex';
    celebrationTimer = setTimeout(restartRound, 3000);
  }

  els.diffGroup.addEventListener('click', function(e){
    var btn = e.target.closest('.diff-btn');
    if (!btn) return;
    var tier = btn.getAttribute('data-tier');
    if (tier === state.difficulty) return; // already selected — keep the current puzzle
    els.diffGroup.querySelectorAll('.diff-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    state.difficulty = tier;
    restartRound();
  });

  els.refreshBtn.addEventListener('click', restartRound);
  els.backBtn.addEventListener('click', function(){ PLSound.go('../../index.html'); });

  // First-visit only: gently peek-scroll the bottom slider tray so new users notice
  // it scrolls (there are more icons than fit on a phone screen), then ease back to
  // the correct resting view with the easy-difficulty icon as the leftmost icon.
  // Jumps to the TRUE end (no partial-reveal cap -- a longer tray was never
  // reaching its real end otherwise) immediately, before first paint, then eases
  // back on the very next frame with no added hold -- both the jump and the
  // start of the ease read as a glitchy stutter when delayed.
  function introduceTraySlider(){
    var el = els.controlsSlider;
    if (!el || window.innerWidth > 767) return;
    var STORAGE_KEY = 'pipes.traySliderIntroShown';
    try { if (localStorage.getItem(STORAGE_KEY)) return; } catch (e) {}
    var maxScroll = el.scrollWidth - el.clientWidth;
    if (maxScroll <= 0) return;
    var reveal = maxScroll;
    el.scrollLeft = reveal;
    var duration = 1800;
    var start = null;
    function easeInOutCubic(t){
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }
    function step(ts){
      if (start === null) start = ts;
      var elapsed = ts - start;
      if (elapsed >= duration) {
        el.scrollLeft = 0;
        try { localStorage.setItem(STORAGE_KEY, '1'); } catch (e) {}
        return;
      }
      el.scrollLeft = reveal * (1 - easeInOutCubic(elapsed / duration));
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  introduceTraySlider();

  // Coming back from the rotate-block reload: continue the saved game.
  // Otherwise (or if the save is unusable) start a fresh easy round.
  var resumed = takeResume();
  if (!(resumed && restoreGame(resumed))) {
    els.diffGroup.querySelector('[data-tier="easy"]').classList.add('active');
    restartRound();
  }
})();
</script>
