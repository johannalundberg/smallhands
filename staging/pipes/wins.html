<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pipes — solved looks</title>
<style>
  /* Trial page: each version solves its own boards on a loop so the solved
     moment can be compared. The switch sets the water colour for all. */
  html, body{ margin:0; background:#202020; color:#E4E4E4; font-family:-apple-system, system-ui, sans-serif; }
  .bar{ display:flex; gap:8px; align-items:center; padding:16px 16px 0; font-size:14px; }
  .bar button{ appearance:none; border:0; border-radius:999px; padding:8px 14px; font:inherit; cursor:pointer; background:#3a3a3a; color:#E4E4E4; }
  .bar button.on{ background:#E4E4E4; color:#202020; }
  .grid{ display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:16px; padding:16px; max-width:1200px; }
  @media (max-width: 700px){ .grid{ grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px; padding:10px; } }
  figure{ margin:0; }
  .frame{ position:relative; aspect-ratio:393 / 852; overflow:hidden; border-radius:14px; }
  .frame iframe{ position:absolute; left:0; top:0; width:393px; height:852px; border:0; transform-origin:0 0; }
  figcaption{ padding:8px 2px 0; font-size:14px; line-height:1.3; }
  figcaption b{ display:block; }
  figcaption span{ opacity:0.65; font-size:12px; }
</style>
</head>
<body>
<div class="bar">Water:
  <button type="button" data-water="" class="on">Pink</button>
  <button type="button" data-water="blue">Light blue</button>
</div>
<div class="grid" id="grid"></div>
<script>
(function(){
  "use strict";
  var SETS = [
    ['', 'Now', 'a light shine runs along the water'],
    ['green', '1. Green route', 'the water turns green from start to goal'],
    ['fade', '2. Fade', 'everything but the water fades away'],
    ['tiles', '3. Tiles light up', 'the route’s tiles brighten one by one'],
    ['both', '4. Fade + green', 'options 1 and 2 together'],
    ['wave', '5. Green wave', 'the whole board turns green, like Sudoku']
  ];
  var grid = document.getElementById('grid');
  var water = '';
  function url(win){ return './?demo=1' + (win ? '&win=' + win : '') + (water ? '&water=' + water : ''); }
  SETS.forEach(function(set){
    var fig = document.createElement('figure');
    fig.innerHTML = '<div class="frame"><iframe title="' + set[1] + '"></iframe></div>' +
      '<figcaption><b>' + set[1] + '</b><span>' + set[2] + '</span></figcaption>';
    fig.querySelector('iframe').dataset.win = set[0];
    grid.appendChild(fig);
  });
  function load(){
    document.querySelectorAll('iframe').forEach(function(f){ f.src = url(f.dataset.win); });
  }
  document.querySelectorAll('.bar button').forEach(function(b){
    b.addEventListener('click', function(){
      water = b.dataset.water;
      document.querySelectorAll('.bar button').forEach(function(x){ x.classList.toggle('on', x === b); });
      load();
    });
  });
  function fit(){
    document.querySelectorAll('.frame').forEach(function(f){
      f.querySelector('iframe').style.transform = 'scale(' + f.clientWidth / 393 + ')';
    });
  }
  load(); fit();
  window.addEventListener('resize', fit);
})();
</script>
</body>
</html>
