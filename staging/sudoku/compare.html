<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sudoku — plain numbers vs numbers in circles</title>
<style>
  /* Trial page: the same boards (same seed) with plain numbers and with
     each number on its own disc, side by side. */
  html, body{ margin:0; height:100%; background:#7080B5; }
  .row{ display:flex; gap:8px; height:100%; padding:8px; box-sizing:border-box; }
  iframe{ flex:1; min-width:0; height:100%; border:0; border-radius:12px; }
  @media (max-width: 700px){
    .row{ flex-direction:column; }
  }
</style>
</head>
<body>
<div class="row">
  <iframe title="Plain numbers" src="./?seed=7"></iframe>
  <iframe title="Numbers in circles" src="./?style=circles&seed=7"></iframe>
</div>
</body>
</html>
