<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sudoku — shapes, numbers, dots</title>
<style>
  /* Trial page: the same boards (same seed) in all three styles, side by side. */
  html, body{ margin:0; height:100%; background:#3B2A45; }
  .row{ display:flex; gap:8px; height:100%; padding:8px; box-sizing:border-box; }
  iframe{ flex:1; min-width:0; height:100%; border:0; border-radius:12px; }
  @media (max-width: 700px){
    .row{ flex-direction:column; }
  }
</style>
</head>
<body>
<div class="row">
  <iframe title="Shapes" src="./?style=shapes&seed=7"></iframe>
  <iframe title="Numbers" src="./?style=numbers&seed=7"></iframe>
  <iframe title="Dots" src="./?style=dots&seed=7"></iframe>
</div>
</body>
</html>
