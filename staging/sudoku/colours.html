<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sudoku — colour trials</title>
<style>
  /* Trial page: the same board (same seed) in eight colour sets, each shown
     as a whole phone screen. A few squares are filled in so the player's
     discs show too. Tap a name to open that set full screen. */
  html, body{ margin:0; background:#202020; color:#E4E4E4; font-family:-apple-system, system-ui, sans-serif; }
  .grid{ display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:16px; padding:16px; }
  @media (max-width: 900px){ .grid{ grid-template-columns:repeat(2, minmax(0, 1fr)); gap:12px; padding:12px; } }
  figure{ margin:0; }
  .frame{ position:relative; aspect-ratio:393 / 852; overflow:hidden; border-radius:14px; }
  .frame iframe{ position:absolute; left:0; top:0; width:393px; height:852px; border:0; transform-origin:0 0; }
  figcaption{ padding:8px 2px 0; font-size:14px; line-height:1.3; }
  figcaption a{ color:inherit; font-weight:600; }
  figcaption span{ display:block; opacity:0.65; font-size:12px; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script>
(function(){
  "use strict";
  var SETS = [
    ['', 'Current', 'orange given, grey yours'],
    ['k1', 'Periwinkle', 'coral given, white yours'],
    ['k2', 'Violet', 'yellow given, grey yours'],
    ['k3', 'Violet', 'pink given, mint yours'],
    ['k4', 'Sky', 'cream given, yellow yours'],
    ['k5', 'Night blue', 'periwinkle given, peach yours'],
    ['k6', 'Teal', 'amber given, white yours'],
    ['k7', 'Terracotta', 'cream given, periwinkle yours']
  ];
  var grid = document.getElementById('grid');
  SETS.forEach(function(set){
    var url = './?seed=7' + (set[0] ? '&theme=' + set[0] : '');
    var fig = document.createElement('figure');
    fig.innerHTML = '<div class="frame"><iframe title="' + set[1] + '" src="' + url + '"></iframe></div>' +
      '<figcaption><a href="' + url + '" target="_blank">' + set[1] + '</a><span>' + set[2] + '</span></figcaption>';
    grid.appendChild(fig);
    var iframe = fig.querySelector('iframe');
    // Fill a few empty squares so the player's disc colour shows.
    iframe.addEventListener('load', function(){
      setTimeout(function(){
        var cells = iframe.contentDocument.querySelectorAll('.cell:not(.given)');
        for (var i = 0; i < 4 && i < cells.length; i++) cells[i].click();
      }, 400);
    });
  });
  // Scale each 393px-wide phone screen down to its column.
  function fit(){
    document.querySelectorAll('.frame').forEach(function(f){
      f.querySelector('iframe').style.transform = 'scale(' + f.clientWidth / 393 + ')';
    });
  }
  fit();
  window.addEventListener('resize', fit);
})();
</script>
</body>
</html>
