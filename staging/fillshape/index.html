<style>
  :root{
    --bg:#283347;
    --bright:#E4E4E4;
    --ink:#202020;
    --ink-muted:rgba(0,0,0,0.28); /* buttons and the shape's empty squares */
    --mat-sq:rgba(0,0,0,0.11); /* the rest of the mat: a quiet table grid */
    --face:#FFA226;
    --win:#0DC754; /* the solved board's wave: Othello's green */
    --incorrect:#F2383B;
    --unit: 1.1574vw;
    --icon-size: clamp(44px, 8.912vw, 154px);
    --v-reserve-top: calc(var(--icon-size) + 2 * var(--unit));
    --v-reserve-bottom: calc(var(--icon-size) + 2 * var(--unit));
    --gap: 3px;
    --round: 12%; /* slightly rounded squares */
    --cell: 60px; /* one mat square; fitLayout sets it */
  }

  /* The mat fills the body's padding box (fitLayout reads it): on tablet
     and desktop, between the top and bottom button rows, nearly full width. */
  body{
    padding: var(--v-reserve-top) var(--unit) var(--v-reserve-bottom);
  }

  @media (min-width: 768px) and (max-width: 1023px) and (min-height: 501px){
    :root{
      --unit: 2.3981vw;
      --icon-size: clamp(80px, 11.4824vw, 120px);
    }
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    position:relative;
    margin:0;
    height: var(--app-height, 100vh);
    background:var(--bg);
    color:var(--bright);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    overflow:hidden;
    touch-action:manipulation;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  /* ---------- icon buttons (difficulty / back / refresh) ---------- */
  .icon-btn{
    appearance:none;
    background:none;
    border:none;
    cursor:pointer;
    width:var(--icon-size);
    height:var(--icon-size);
    aspect-ratio:1;
    border-radius:50%;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:none;
    transform: translateZ(0);
    -webkit-transform: translateZ(0);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    transition: transform 120ms ease;
  }
  .icon-btn:active{ transform: translateZ(0) scale(0.94); }
  @media (hover:hover) and (pointer:fine){
    .icon-btn:hover{ transform: translateZ(0) scale(1.035); }
  }
  .icon-btn svg{ width:100%; height:100%; display:block; }
  .icon-btn .fill-bg{ transition: fill 120ms ease; }

  .diff-group{ position:absolute; right:var(--unit); top:var(--unit); display:flex; gap:calc(var(--icon-size) * 0.1); z-index:2; }
  .diff-btn .fill-bg{ fill:var(--ink-muted); }
  .diff-btn.active .fill-bg{ fill:var(--bright); }
  .diff-btn[data-tier="easy"]   { --glow:#5CC72E; }
  .diff-btn[data-tier="medium"] { --glow:#FFEA00; }
  .diff-btn[data-tier="hard"]   { --glow:#F93134; }
  .diff-btn.hint .fill-bg{ animation: level-glow-tier 1300ms ease-in-out; }
  @keyframes level-glow-tier{ 40%,60%{ fill:var(--glow); } }
  .diff-btn.pick .fill-bg{ animation: level-pick 900ms ease-out; }
  @keyframes level-pick{ 0%,30%{ fill:var(--glow); } }

  .btn-row{ position:absolute; left:var(--unit); bottom:var(--unit); display:flex; gap:calc(var(--icon-size) * 0.1); z-index:2; }

  @media (min-width: 768px) and (max-width: 1023px) and (min-height: 501px){
    .diff-group, .btn-row{ gap: calc(var(--icon-size) * 0.1253); }
  }

  .controls-slider{ display:contents; }

  /* ---------- progress dots: five boards make a round ---------- */
  .progress-dots{
    position:absolute;
    right:var(--unit);
    bottom:var(--unit);
    z-index:2;
    display:flex;
    align-items:center;
    gap: calc(var(--icon-size) * 0.08);
  }
  .progress-dots .dot{
    width: calc(var(--icon-size) * 0.25);
    height: calc(var(--icon-size) * 0.25);
    border-radius:50%;
    background: var(--ink-muted);
    transition: background 150ms ease;
  }
  .progress-dots .dot.done{ background: var(--bright); }

  /* ---------- the mat: one grid, the shape in it, the pieces on it ---------- */
  .mat{
    position:absolute;
    left:0; top:0;
    display:grid;
    gap:var(--gap);
  }
  .sq{
    width:var(--cell);
    height:var(--cell);
    background:var(--mat-sq);
    border-radius:var(--round);
  }
  .sq.shape{ background:var(--ink-muted); }
  .sq.filled{ background:var(--c); cursor:grab; }
  /* Where the dragged piece will land. */
  .sq.ghost{ background:var(--c); opacity:0.45; }
  .sq.drop{ animation: sq-drop 260ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes sq-drop{
    0%{ transform:scale(0.86); }
    100%{ transform:scale(1); }
  }
  /* A new board's pieces pop in, one piece after another (--d). */
  .sq.pop{ animation: piece-pop 380ms cubic-bezier(0.34, 1.56, 0.64, 1) both; animation-delay:var(--d, 0ms); }
  @keyframes piece-pop{
    0%{ transform:scale(0); }
    100%{ transform:scale(1); }
  }
  /* Solved: a green wave runs across the shape from its top-left corner --
     each square pops and turns green in turn (--d, set by onSolved). */
  .sq.win{
    background:var(--win);
    transition: background 120ms ease var(--d);
    animation: win-pop 320ms cubic-bezier(0.34, 1.56, 0.64, 1) var(--d) both;
  }
  @keyframes win-pop{
    0%, 100%{ transform:scale(1); }
    45%{ transform:scale(1.06); }
  }

  .piece{
    position:relative;
    width:calc(var(--cell) * var(--w) + var(--gap) * (var(--w) - 1));
    height:calc(var(--cell) * var(--h) + var(--gap) * (var(--h) - 1));
  }
  .piece i{
    position:absolute;
    width:var(--cell);
    height:var(--cell);
    left:calc((var(--cell) + var(--gap)) * var(--x));
    top:calc((var(--cell) + var(--gap)) * var(--y));
    background:var(--c);
    border-radius:var(--round);
  }

  /* A touched piece is drawn here (its mat squares look empty meanwhile):
     pressed, dragged, flying back, springing, turning or wobbling. */
  .floater{
    position:fixed;
    left:0; top:0;
    z-index:5;
    pointer-events:none;
    transform-origin:0 0;
    display:none;
  }
  .floater.on{ display:block; }
  .floater.lifting{ transition: transform 140ms ease-out; }
  .floater.placing{ transition: transform 90ms ease-out; }
  .floater.returning{ transition: transform 220ms cubic-bezier(0.34, 1.2, 0.64, 1); }
  .floater .piece{ transition: transform 120ms ease; }
  /* Press and spring, like the other games' pieces. */
  .floater .piece.pressed{ transform:scale(0.92); transition:none; }
  .floater .piece.spring{ animation: press-spring 320ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes press-spring{
    0%{ transform:scale(0.92); }
    55%{ transform:scale(1.06); }
    100%{ transform:scale(1); }
  }
  /* Hard: a tap turns the piece a quarter turn, with the same spring... */
  .floater .piece.turn{ animation: piece-turn 320ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes piece-turn{
    0%{ transform:rotate(-90deg) scale(0.92); }
    100%{ transform:rotate(0deg) scale(1); }
  }
  /* ...or, with no room to turn, a little wobble. */
  .floater .piece.wobble{ animation: piece-wobble 380ms ease-out; }
  @keyframes piece-wobble{
    0%{ transform:rotate(0deg) scale(0.92); }
    30%{ transform:rotate(-7deg) scale(1); }
    60%{ transform:rotate(5deg); }
    85%{ transform:rotate(-2deg); }
    100%{ transform:rotate(0deg); }
  }

  @keyframes bounce-in{
    0%{ transform:scale(0); opacity:0; }
    100%{ transform:scale(var(--final-scale)); opacity:1; }
  }
  .celebration{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:4;
  }
  .celebration-face{
    width:min(70vmin, 700px);
    height:auto;
    animation: bounce-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  /* ---------- phone: single scrollable slider-menu bar ---------- */
  @media (max-width: 767px), (max-height: 500px){
    .icon-btn:active{ transform: translateZ(0); filter: brightness(0.7); }
    :root{
      --unit: 5.089vw;
      --icon-size: clamp(52px, 20.5344vw, 100px);
      --gap: 2px;
    }
    .controls-slider{
      display:flex;
      align-items:flex-end;
      gap: calc(var(--icon-size) * 0.1239);
      position:fixed;
      left:var(--unit);
      right:var(--unit);
      bottom:var(--unit);
      z-index:3;
      background: rgba(32,32,32,0.4);
      border-radius:999px;
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
      --ink-muted: rgba(0,0,0,0.45);
    }
    .controls-slider::-webkit-scrollbar{ display:none; }
    .controls-slider{ transition: transform 120ms ease; }
    .controls-slider:active{ transform: scale(1.03); }
    .diff-group, .btn-row{ display:contents; }
    .progress-dots{ left:var(--unit); top:var(--unit); right:auto; bottom:auto; }
    /* Between the dots above and the tray of buttons below. */
    body{
      padding: calc(var(--unit) * 2 + var(--icon-size) * 0.25) var(--unit) calc(var(--unit) * 2 + var(--icon-size));
    }
  }

  @media (max-height: 500px) and (min-width: 500px) and (orientation: landscape){
    :root{
      --unit: clamp(8px, 3.5vh, 14px);
      --icon-size: clamp(40px, 14vh, 64px);
    }
  }

  .rotate-block{
    display:none;
    position:fixed;
    top: calc(-1 * env(safe-area-inset-top, 0px));
    right: calc(-1 * env(safe-area-inset-right, 0px));
    bottom: calc(-1 * env(safe-area-inset-bottom, 0px));
    left: calc(-1 * env(safe-area-inset-left, 0px));
    background:var(--incorrect);
    z-index:9999;
    align-items:center;
    justify-content:center;
  }
  .rotate-block svg{ width:min(50vh, 320px); height:auto; }
  @media (max-height: 500px) and (min-width: 500px) and (orientation: landscape){
    .rotate-block{ display:flex; }
  }
  html, body, .controls-slider{ touch-action:manipulation; }
  .mat{ touch-action:none; }
</style>

<script>
(function(){
  "use strict";

  document.addEventListener('touchstart', function(){}, { passive: true });

  var TIERS = ['easy', 'medium', 'hard'];
  var TAP_SLOP = 6;
  var COLORS = ['#FFA226', '#0DC754', '#707EFF', '#E570E1', '#FFD60A', '#3CC8C8', '#FF6B4A'];
  var ROUND_SIZE = 5;
  // The solved board's green wave: one diagonal of squares every
  // WAVE_STEP_MS, each popping for WAVE_POP_MS; the board then holds green
  // for WIN_HOLD_MS before the next one appears.
  var WAVE_STEP_MS = 70;
  var WAVE_POP_MS = 320;
  var WIN_HOLD_MS = 600;

  // ---- generator start ----
  // ---------- puzzles ----------
  // A board is a shape cut into pieces: '#' is part of the shape, '.' is
  // empty space. Medium and hard take turns: a square, then an outline.
  var MEDIUM_OUTLINES = [
    ['##...', '##...', '##...', '#####', '#####'],                    // L, 16
    ['#####', '#####', '.###.', '.###.', '.###.'],                    // T, 19
    ['..##..', '..##..', '######', '######', '..##..', '..##..'],     // plus, 20
    ['##...', '###..', '####.', '#####', '#####'],                    // steps, 19
    ['##.##', '##.##', '#####', '#####']                              // U, 18
  ];
  var HARD_OUTLINES = [
    ['###...', '###...', '###...', '######', '######', '######'],     // L, 27
    ['######', '######', '######', '..##..', '..##..', '..##..'],     // T, 24
    ['.####.', '.####.', '######', '######', '.####.', '.####.'],     // plus, 28
    ['##....', '###...', '####..', '#####.', '######', '######'],     // steps, 26
    ['##..##', '##..##', '##..##', '######', '######']                // U, 24
  ];
  // pieces: how many, size: squares per piece, turn: pieces start turned
  // and a tap turns them.
  var LEVELS = {
    easy:   { square: 4, outlines: [],              pieces: [4, 4], size: [3, 5], turn: false },
    medium: { square: 5, outlines: MEDIUM_OUTLINES, pieces: [5, 6], size: [2, 5], turn: false },
    hard:   { square: 6, outlines: HARD_OUTLINES,   pieces: [6, 8], size: [2, 5], turn: true }
  };
  var MAX_SAME = 2; // at most this many pieces of one shape (same way round)

  function rand(n){ return Math.floor(Math.random() * n); }
  function pick(arr){ return arr[rand(arr.length)]; }
  function shuffle(arr){
    for (var i = arr.length - 1; i > 0; i--) {
      var j = rand(i + 1), t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function range(n){ var a = []; for (var i = 0; i < n; i++) a.push(i); return a; }
  function isInt(v, lo, hi){ return typeof v === 'number' && v % 1 === 0 && v >= lo && v <= hi; }

  function normalize(cells){
    var minR = Infinity, minC = Infinity;
    cells.forEach(function(p){ minR = Math.min(minR, p[0]); minC = Math.min(minC, p[1]); });
    return cells.map(function(p){ return [p[0] - minR, p[1] - minC]; })
      .sort(function(a, b){ return a[0] - b[0] || a[1] - b[1]; });
  }
  function keyOf(cells){ return cells.map(function(p){ return p.join(','); }).join(';'); }
  function dims(cells){
    var h = 0, w = 0;
    cells.forEach(function(p){ h = Math.max(h, p[0] + 1); w = Math.max(w, p[1] + 1); });
    return { h: h, w: w };
  }
  // The cells turned k quarter turns clockwise.
  function turnCells(cells, k){
    var cur = cells;
    for (var i = 0; i < ((k % 4) + 4) % 4; i++) cur = cur.map(function(p){ return [p[1], -p[0]]; });
    return normalize(cur);
  }
  function connected(cells){
    var set = {};
    cells.forEach(function(p){ set[p[0] + ',' + p[1]] = 1; });
    if (Object.keys(set).length !== cells.length) return false; // no repeats
    var seen = {}, todo = [cells[0]], n = 0;
    seen[cells[0][0] + ',' + cells[0][1]] = 1;
    while (todo.length) {
      var p = todo.pop(); n++;
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
        var k = (p[0] + d[0]) + ',' + (p[1] + d[1]);
        if (set[k] && !seen[k]) { seen[k] = 1; todo.push([p[0] + d[0], p[1] + d[1]]); }
      });
    }
    return n === cells.length;
  }

  function squareRows(n){ var r = []; for (var i = 0; i < n; i++) r.push(new Array(n + 1).join('#')); return r; }
  function maskFromRows(rows){
    var R = rows.length, C = 0, on = [];
    rows.forEach(function(r){ C = Math.max(C, r.length); });
    for (var r = 0; r < R; r++) for (var c = 0; c < C; c++) on.push(rows[r].charAt(c) === '#' ? 1 : 0);
    return { rows: R, cols: C, on: on };
  }
  function neighbours(i, R, C){
    var r = Math.floor(i / C), c = i % C, out = [];
    if (r > 0) out.push(i - C);
    if (r < R - 1) out.push(i + C);
    if (c > 0) out.push(i - 1);
    if (c < C - 1) out.push(i + 1);
    return out;
  }

  // Cut the shape into pieces: each grows from the tightest free corner,
  // one random neighbour at a time, so no lone squares get left behind.
  // Returns null when a try goes wrong; the caller just tries again.
  function partition(mask, L){
    var R = mask.rows, C = mask.cols, total = 0, i;
    for (i = 0; i < mask.on.length; i++) total += mask.on[i];
    var nMin = Math.max(L.pieces[0], Math.ceil(total / L.size[1]));
    var nMax = Math.min(L.pieces[1], Math.floor(total / L.size[0]));
    if (nMin > nMax) return null;
    var n = nMin + rand(nMax - nMin + 1);
    var sizes = [];
    for (i = 0; i < n; i++) sizes.push(L.size[0]);
    var extra = total - n * L.size[0];
    while (extra > 0) {
      var j = rand(n);
      if (sizes[j] < L.size[1]) { sizes[j]++; extra--; }
    }
    var owner = mask.on.map(function(v){ return v ? -1 : -2; }); // -1 free, -2 not in the shape
    function freeAround(i){
      return neighbours(i, R, C).filter(function(j){ return owner[j] === -1; }).length;
    }
    function tightest(list){
      var best = [], bestN = 9;
      list.forEach(function(i){
        var f = freeAround(i);
        if (f < bestN) { bestN = f; best = [i]; } else if (f === bestN) best.push(i);
      });
      return pick(best);
    }
    var pieces = [];
    for (var k = 0; k < n; k++) {
      var free = [];
      for (i = 0; i < owner.length; i++) if (owner[i] === -1) free.push(i);
      var seed = tightest(free);
      owner[seed] = k;
      var cells = [seed];
      while (cells.length < sizes[k]) {
        var front = [], seen = {};
        cells.forEach(function(c){
          neighbours(c, R, C).forEach(function(j){
            if (owner[j] === -1 && !seen[j]) { seen[j] = 1; front.push(j); }
          });
        });
        if (!front.length) return null;
        var next = Math.random() < 0.6 ? tightest(front) : pick(front);
        owner[next] = k;
        cells.push(next);
      }
      pieces.push(cells);
      if (!freeAreasOk(owner, R, C, L.size[0])) return null;
    }
    return { owner: owner, pieces: pieces };
  }
  // Every patch of free squares must still hold at least one piece.
  function freeAreasOk(owner, R, C, minSize){
    var seen = {};
    for (var i = 0; i < owner.length; i++) {
      if (owner[i] !== -1 || seen[i]) continue;
      var todo = [i], n = 0;
      seen[i] = 1;
      while (todo.length) {
        var x = todo.pop(); n++;
        neighbours(x, R, C).forEach(function(j){
          if (owner[j] === -1 && !seen[j]) { seen[j] = 1; todo.push(j); }
        });
      }
      if (n < minSize) return false;
    }
    return true;
  }

  function tooAlike(pieces, C){
    var count = {};
    return pieces.some(function(list){
      var key = keyOf(normalize(list.map(function(i){ return [Math.floor(i / C), i % C]; })));
      count[key] = (count[key] || 0) + 1;
      return count[key] > MAX_SAME;
    });
  }

  // A different colour for every piece; with more pieces than colours, a
  // colour comes back only on pieces that don't touch.
  function colourPieces(pieces, owner, mask){
    var R = mask.rows, C = mask.cols, n = pieces.length;
    var adj = pieces.map(function(){ return {}; });
    owner.forEach(function(a, i){
      if (a < 0) return;
      neighbours(i, R, C).forEach(function(j){
        var b = owner[j];
        if (b >= 0 && b !== a) { adj[a][b] = 1; adj[b][a] = 1; }
      });
    });
    var cols;
    for (var t = 0; t < 50; t++) {
      cols = pieces.map(function(){ return -1; });
      var palette = shuffle(range(COLORS.length)), used = {};
      shuffle(range(n)).forEach(function(k){
        var near = {};
        Object.keys(adj[k]).forEach(function(j){ if (cols[j] >= 0) near[cols[j]] = 1; });
        var choice = -1;
        palette.forEach(function(c){ if (choice < 0 && !used[c] && !near[c]) choice = c; });
        if (choice < 0) {
          palette.forEach(function(c){
            if (!near[c] && (choice < 0 || (used[c] || 0) < (used[choice] || 0))) choice = c;
          });
        }
        if (choice < 0) choice = palette[0];
        cols[k] = choice;
        used[choice] = (used[choice] || 0) + 1;
      });
      var clash = false;
      for (var a = 0; a < n; a++) for (var b in adj[a]) if (cols[a] === cols[b]) clash = true;
      if (!clash) break;
    }
    pieces.forEach(function(p, k){ p.color = cols[k]; });
  }

  // Hard: about half the pieces start turned (only ones that look different
  // turned), so they have to be turned back.
  function turnSome(pieces){
    var can = pieces.filter(function(p){ return keyOf(turnCells(p.cells, 1)) !== keyOf(p.cells); });
    shuffle(can).slice(0, Math.round(pieces.length / 2)).forEach(function(p){
      p.rot = pick([1, 2, 3].filter(function(k){ return keyOf(turnCells(p.cells, k)) !== keyOf(p.cells); }));
    });
  }

  // A puzzle: the shape (rows, cols, on) and its pieces in shuffled order. Each
  // piece keeps its cells as they sit in the answer, where they sit (home),
  // and how far it is turned now (rot, quarter turns clockwise).
  function makePuzzle(level, rows){
    var L = LEVELS[level], mask = maskFromRows(rows);
    for (var t = 0; t < 5000; t++) {
      var part = partition(mask, L);
      if (!part || tooAlike(part.pieces, mask.cols)) continue;
      var pieces = part.pieces.map(function(list){
        var rc = list.map(function(i){ return [Math.floor(i / mask.cols), i % mask.cols]; });
        var minR = Infinity, minC = Infinity;
        rc.forEach(function(p){ minR = Math.min(minR, p[0]); minC = Math.min(minC, p[1]); });
        return { cells: normalize(rc), home: [minR, minC], color: 0, rot: 0, at: null };
      });
      colourPieces(pieces, part.owner, mask);
      if (L.turn) turnSome(pieces);
      return { rows: mask.rows, cols: mask.cols, on: mask.on, turn: !!L.turn, pieces: shuffle(pieces) };
    }
    return null;
  }

  // Which shape the n-th board of a level uses: squares and outlines take turns.
  function maskRowsFor(level, n, last){
    var L = LEVELS[level];
    if (!L.outlines.length || n % 2 === 0) return { rows: squareRows(L.square), outline: -1 };
    var opts = range(L.outlines.length).filter(function(i){ return i !== last; });
    var o = pick(opts);
    return { rows: L.outlines[o], outline: o };
  }

  // Checks a saved puzzle: real pieces, and their answer spots fill the
  // shape exactly (so it can always be solved).
  function validatePuzzle(pz){
    if (!pz || typeof pz !== 'object') return false;
    var R = pz.rows, C = pz.cols;
    if (!isInt(R, 1, 8) || !isInt(C, 1, 8)) return false;
    if (!Array.isArray(pz.on) || pz.on.length !== R * C) return false;
    if (!Array.isArray(pz.pieces) || !pz.pieces.length || pz.pieces.length > 12) return false;
    var total = 0, cover = [], i;
    for (i = 0; i < pz.on.length; i++) {
      if (pz.on[i] !== 0 && pz.on[i] !== 1) return false;
      total += pz.on[i];
      cover.push(-1);
    }
    var covered = 0;
    for (var k = 0; k < pz.pieces.length; k++) {
      var p = pz.pieces[k];
      if (!p || typeof p !== 'object' || !Array.isArray(p.cells)) return false;
      if (p.cells.length < 2 || p.cells.length > 5) return false;
      if (!p.cells.every(function(q){ return Array.isArray(q) && q.length === 2 && isInt(q[0], 0, 4) && isInt(q[1], 0, 4); })) return false;
      if (keyOf(normalize(p.cells)) !== keyOf(p.cells) || !connected(p.cells)) return false;
      if (!isInt(p.color, 0, COLORS.length - 1) || !isInt(p.rot, 0, 3)) return false;
      if (!Array.isArray(p.home) || !isInt(p.home[0], 0, R - 1) || !isInt(p.home[1], 0, C - 1)) return false;
      for (var j = 0; j < p.cells.length; j++) {
        var r = p.home[0] + p.cells[j][0], c = p.home[1] + p.cells[j][1];
        if (r >= R || c >= C) return false;
        var x = r * C + c;
        if (!pz.on[x] || cover[x] !== -1) return false;
        cover[x] = k;
        covered++;
      }
    }
    return covered === total;
  }

  // ---------- mat layout ----------
  // The mat is one grid filling the play area. fitLayout tries square
  // sizes from MAX_CELL down; at each size the mat is as many squares as
  // fit, the shape goes in the middle (or at the top, in a tall area) and
  // the loose pieces are packed around it. The first size where it all
  // fits wins.
  var MAX_CELL = 90;
  var MIN_CELL = 12;

  // items: per piece { w, h, inside: [row, col] within the shape, or null
  // (loose) }. Returns the square size, the mat size, the shape's top-left
  // on the mat (sr, sc) and every piece's top-left (pos).
  function planLayout(availW, availH, gap, mask, items){
    // A wide area keeps the pieces beside the shape, a tall one below it;
    // the other way is only tried if nothing fits at any size.
    var ways = availW >= availH ? ['centre', 'top'] : ['top', 'centre'];
    for (var w = 0; w < ways.length; w++) {
      for (var cell = MAX_CELL; cell >= MIN_CELL; cell--) {
        var step = cell + gap;
        var cols = Math.floor((availW + gap) / step), rows = Math.floor((availH + gap) / step);
        if (cols < mask.cols || rows < mask.rows) continue;
        var plan = arrange(ways[w], cols, rows, mask, items, true);
        if (plan) { plan.cell = cell; plan.ok = true; plan.way = ways[w]; return plan; }
      }
    }
    // Never needed on a real screen: the smallest squares, pieces wherever
    // there's room.
    cell = MIN_CELL;
    cols = Math.max(mask.cols, Math.floor((availW + gap) / (cell + gap)));
    rows = Math.max(mask.rows, Math.floor((availH + gap) / (cell + gap)));
    plan = arrange('centre', cols, rows, mask, items, false);
    plan.cell = cell;
    plan.ok = false;
    return plan;
  }

  function region(r0, c0, h, w){ return { r0: r0, c0: c0, h: h, w: w, y: 0, x: 0, sh: 0, area: 0, items: [] }; }

  // Shelf packing: pieces go left to right in a row (a shelf), one free
  // square apart; a piece that doesn't fit starts a new shelf one free
  // square below. Returns false if the piece doesn't fit at all.
  function shelfPlace(reg, k, w, h){
    if (w > reg.w || h > reg.h) return false;
    if (reg.sh && reg.x + w <= reg.w && reg.y + h <= reg.h) {
      reg.items.push({ k: k, r: reg.y, c: reg.x, w: w, h: h, shelf: reg.y });
      reg.x += w + 1;
      reg.sh = Math.max(reg.sh, h);
    } else {
      var y = reg.sh ? reg.y + reg.sh + 1 : 0;
      if (y + h > reg.h) return false;
      reg.y = y; reg.x = w + 1; reg.sh = h;
      reg.items.push({ k: k, r: y, c: 0, w: w, h: h, shelf: y });
    }
    reg.area += w * h;
    return true;
  }

  // 'centre': shape in the middle, pieces left and right of it (split
  // evenly), then above and below it. 'top': shape at the top centre,
  // pieces below it, then beside it. Regions keep one free square from
  // the shape.
  function arrange(way, cols, rows, mask, items, packed){
    var R = mask.rows, C = mask.cols;
    var sc = Math.floor((cols - C) / 2);
    var sr = way === 'top' ? 0 : Math.floor((rows - R) / 2);
    var main, extra;
    if (way === 'top') {
      main = [region(R + 1, 0, rows - R - 1, cols)];
      extra = [region(0, 0, R, sc - 1), region(0, sc + C + 1, R, cols - sc - C - 1)];
    } else {
      main = [region(0, 0, rows, sc - 1), region(0, sc + C + 1, rows, cols - sc - C - 1)];
      extra = [region(0, sc, sr - 1, C), region(sr + R + 1, sc, rows - sr - R - 1, C)];
    }
    var pos = [], loose = [];
    items.forEach(function(it, k){
      if (it.inside) pos[k] = [sr + it.inside[0], sc + it.inside[1]];
      else loose.push(k);
    });
    // Tallest first, so each shelf is as tall as its first piece.
    loose.sort(function(a, b){ return items[b].h - items[a].h || items[b].w - items[a].w || a - b; });

    if (!packed) {
      // Last resort: first free spot anywhere outside the shape.
      var used = [];
      for (var i = 0; i < rows * cols; i++) {
        var r = Math.floor(i / cols), c = i % cols;
        used.push(r >= sr && r < sr + R && c >= sc && c < sc + C ? 1 : 0);
      }
      loose.forEach(function(k){
        var it = items[k], spot = null;
        for (var r = 0; r + it.h <= rows && !spot; r++) {
          for (var c = 0; c + it.w <= cols && !spot; c++) {
            var free = true;
            for (var y = r; y < r + it.h && free; y++) for (var x = c; x < c + it.w; x++) if (used[y * cols + x]) { free = false; break; }
            if (free) spot = [r, c];
          }
        }
        spot = spot || [0, 0];
        for (var y = spot[0]; y < spot[0] + it.h; y++) for (var x = spot[1]; x < spot[1] + it.w; x++) used[y * cols + x] = 1;
        pos[k] = spot;
      });
      return { cols: cols, rows: rows, sr: sr, sc: sc, pos: pos };
    }

    for (var n = 0; n < loose.length; n++) {
      var k = loose[n], it = items[k];
      var regs = main.slice().sort(function(a, b){ return a.area - b.area; }).concat(extra);
      var done = false;
      for (var j = 0; j < regs.length && !done; j++) done = shelfPlace(regs[j], k, it.w, it.h);
      if (!done) return null;
    }
    // Centre each shelf across its region, and the shelves within it.
    main.concat(extra).forEach(function(reg){
      if (!reg.items.length) return;
      var shelves = {}, bottom = 0;
      reg.items.forEach(function(p){
        var s = shelves[p.shelf] = shelves[p.shelf] || { w: 0, h: 0 };
        s.w = Math.max(s.w, p.c + p.w);
        s.h = Math.max(s.h, p.h);
        bottom = Math.max(bottom, p.shelf + p.h);
      });
      var dy = Math.floor((reg.h - bottom) / 2);
      reg.items.forEach(function(p){
        var s = shelves[p.shelf];
        pos[p.k] = [reg.r0 + dy + p.r + Math.floor((s.h - p.h) / 2), reg.c0 + Math.floor((reg.w - s.w) / 2) + p.c];
      });
    });
    return { cols: cols, rows: rows, sr: sr, sc: sc, pos: pos };
  }

  // Hard's tap-to-turn: the spots to try, nearest first (within 2 squares).
  var TURN_TRIES = [];
  for (var tr = -2; tr <= 2; tr++) for (var tc = -2; tc <= 2; tc++) TURN_TRIES.push([tr, tc]);
  TURN_TRIES.sort(function(a, b){ return (a[0] * a[0] + a[1] * a[1]) - (b[0] * b[0] + b[1] * b[1]); });
  // Rounds halves away from zero, so turning a piece four times brings it
  // back to the very same squares.
  function halfRound(x){ return x < 0 ? -Math.round(-x) : Math.round(x); }
  // ---- generator end ----

  var state = {
    difficulty: 'easy',
    progress: 0,      // boards solved this round
    mask: null,       // the shape: { rows, cols, on }
    turn: false,      // hard: pieces turn
    pieces: [],       // { cells, home, color, rot, at, pos: {r, c} on the mat }
    mat: null,        // { cols, rows, sr, sc }: the shape's top-left is (sr, sc)
    cell: 0,
    gap: 0,
    occ: [],          // per mat square: the piece on it, or -1
    hidden: {},       // pieces the floater is drawing right now
    busy: false,      // a piece landing, or the solved wave
    solved: false,
    count: { easy: 0, medium: 0, hard: 0 },       // boards so far per level
    lastOutline: { easy: -1, medium: -1, hard: -1 }
  };

  var els = {
    mat: document.getElementById('mat'),
    floater: document.getElementById('floater'),
    progressDots: document.querySelectorAll('#progressDots .dot'),
    celebration: document.getElementById('celebration'),
    diffGroup: document.getElementById('diffGroup'),
    backBtn: document.getElementById('backBtn'),
    refreshBtn: document.getElementById('refreshBtn'),
    controlsSlider: document.getElementById('controlsSlider')
  };
  var sqEls = [];

  function updateAppHeight(){
    var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty('--app-height', h + 'px');
  }
  updateAppHeight();
  function onViewportChange(){ updateAppHeight(); scheduleFit(); }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onViewportChange);
    window.visualViewport.addEventListener('scroll', updateAppHeight);
  }
  window.addEventListener('resize', onViewportChange);
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible') onViewportChange();
  });

  var landscapeBlockMQ = window.matchMedia('(max-height:500px) and (min-width:500px) and (orientation:landscape)');
  var wasInLandscapeBlock = landscapeBlockMQ.matches;
  function onLandscapeBlockChange(e){
    if (wasInLandscapeBlock && !e.matches) {
      saveResume();
      location.reload();
    }
    wasInLandscapeBlock = e.matches;
  }
  if (landscapeBlockMQ.addEventListener) {
    landscapeBlockMQ.addEventListener('change', onLandscapeBlockChange);
  } else if (landscapeBlockMQ.addListener) {
    landscapeBlockMQ.addListener(onLandscapeBlockChange);
  }

  // ---------- rules ----------
  function curCells(p){ return turnCells(p.cells, p.rot); }
  // A piece fits where every square is on the mat and free.
  function fitsAt(cells, r, c){
    var m = state.mat;
    for (var i = 0; i < cells.length; i++) {
      var rr = r + cells[i][0], cc = c + cells[i][1];
      if (rr < 0 || rr >= m.rows || cc < 0 || cc >= m.cols) return false;
      if (state.occ[rr * m.cols + cc] !== -1) return false;
    }
    return true;
  }
  function squaresOf(cells, r, c){
    return cells.map(function(q){ return (r + q[0]) * state.mat.cols + c + q[1]; });
  }
  function pieceSquares(k){
    var p = state.pieces[k];
    return squaresOf(curCells(p), p.pos.r, p.pos.c);
  }
  function isShape(r, c){
    var m = state.mask, rr = r - state.mat.sr, cc = c - state.mat.sc;
    return rr >= 0 && rr < m.rows && cc >= 0 && cc < m.cols && m.on[rr * m.cols + cc] === 1;
  }
  // [row, col] of a piece within the shape if it lies wholly in it, else null.
  function shapeOffset(p){
    if (!state.mat || !p.pos) return null;
    var inside = curCells(p).every(function(q){ return isShape(p.pos.r + q[0], p.pos.c + q[1]); });
    return inside ? [p.pos.r - state.mat.sr, p.pos.c - state.mat.sc] : null;
  }
  // Solved when every shape square is covered (the pieces add up to the
  // shape exactly, so they're then all in it).
  function isSolved(){
    var m = state.mask;
    for (var i = 0; i < m.on.length; i++) {
      if (!m.on[i]) continue;
      var r = state.mat.sr + Math.floor(i / m.cols), c = state.mat.sc + i % m.cols;
      if (state.occ[r * state.mat.cols + c] === -1) return false;
    }
    return true;
  }

  // ---------- rendering ----------
  function buildMatDom(){
    var m = state.mat;
    els.mat.innerHTML = '';
    els.mat.style.gridTemplateColumns = 'repeat(' + m.cols + ', var(--cell))';
    els.mat.style.gridTemplateRows = 'repeat(' + m.rows + ', var(--cell))';
    sqEls = [];
    for (var r = 0; r < m.rows; r++) {
      for (var c = 0; c < m.cols; c++) {
        var sq = document.createElement('div');
        sq.className = isShape(r, c) ? 'sq shape' : 'sq';
        els.mat.appendChild(sq);
        sqEls.push(sq);
      }
    }
  }
  function renderSq(i){
    var el = sqEls[i], k = state.occ[i];
    el.classList.remove('ghost', 'win', 'pop');
    if (k === -1 || state.hidden[k]) {
      el.classList.remove('filled');
      el.style.removeProperty('--c');
    } else {
      el.classList.add('filled');
      el.style.setProperty('--c', COLORS[state.pieces[k].color]);
    }
  }
  function renderPiece(k){ pieceSquares(k).forEach(renderSq); }
  function renderMat(){ for (var i = 0; i < sqEls.length; i++) renderSq(i); }
  els.mat.addEventListener('animationend', function(e){
    var el = e.target;
    if (e.animationName === 'sq-drop') el.classList.remove('drop');
    if (e.animationName === 'piece-pop') el.classList.remove('pop');
  });

  function pieceEl(cells, color){
    var d = dims(cells);
    var el = document.createElement('div');
    el.className = 'piece';
    el.style.setProperty('--w', d.w);
    el.style.setProperty('--h', d.h);
    el.style.setProperty('--c', COLORS[color]);
    cells.forEach(function(q){
      var b = document.createElement('i');
      b.style.setProperty('--x', q[1]);
      b.style.setProperty('--y', q[0]);
      el.appendChild(b);
    });
    return el;
  }

  // ---------- layout ----------
  // Fits the mat to the body's padding box. Pieces lying wholly inside
  // the shape keep their place in it; the rest are packed around it again.
  var lastFit = '';
  function fitLayout(force){
    if (!state.mask) return;
    var b = document.body, cs = getComputedStyle(b);
    var padL = parseFloat(cs.paddingLeft), padT = parseFloat(cs.paddingTop);
    var availW = b.clientWidth - padL - parseFloat(cs.paddingRight);
    var availH = b.clientHeight - padT - parseFloat(cs.paddingBottom);
    var gap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap')) || 3;
    var key = availW + 'x' + availH + ':' + gap;
    if (!force && key === lastFit) return;
    lastFit = key;
    // A piece mid-drag (or mid-turn) goes back where it came from first.
    cancelDrag();
    finishFly();
    var items = state.pieces.map(function(p){
      var d = dims(curCells(p));
      return { w: d.w, h: d.h, inside: state.mat ? shapeOffset(p) : p.at };
    });
    var plan = planLayout(availW, availH, gap, state.mask, items);
    state.mat = { cols: plan.cols, rows: plan.rows, sr: plan.sr, sc: plan.sc };
    state.cell = plan.cell;
    state.gap = gap;
    state.occ = [];
    for (var i = 0; i < plan.cols * plan.rows; i++) state.occ.push(-1);
    state.pieces.forEach(function(p, k){
      p.at = null;
      p.pos = { r: plan.pos[k][0], c: plan.pos[k][1] };
      pieceSquares(k).forEach(function(x){ state.occ[x] = k; });
    });
    document.documentElement.style.setProperty('--cell', plan.cell + 'px');
    buildMatDom();
    renderMat();
    var mw = plan.cols * plan.cell + (plan.cols - 1) * gap;
    var mh = plan.rows * plan.cell + (plan.rows - 1) * gap;
    els.mat.style.left = Math.floor(padL + (availW - mw) / 2) + 'px';
    els.mat.style.top = Math.floor(padT + (availH - mh) / 2) + 'px';
  }
  var fitQueued = false;
  function scheduleFit(){
    if (fitQueued) return;
    fitQueued = true;
    requestAnimationFrame(function(){ fitQueued = false; fitLayout(false); });
  }

  // ---------- game flow ----------
  var celebrationTimer = null, winTimer = null, boardToken = 0;

  function updateProgressDots(){
    saveProgress();
    els.progressDots.forEach(function(dot, i){
      dot.classList.toggle('done', i < state.progress);
    });
  }

  // Puts a puzzle on the mat. Pieces with .at ([row, col] in the shape)
  // start there; the others are packed around the shape.
  function showPuzzle(pz, pop){
    boardToken++;
    clearTimeout(winTimer);
    clearTimeout(celebrationTimer);
    cancelDrag();
    finishFly();
    els.floater.className = 'floater';
    els.floater.innerHTML = '';
    els.celebration.style.display = 'none';
    els.mat.style.display = '';
    state.mask = { rows: pz.rows, cols: pz.cols, on: pz.on.slice() };
    state.turn = !!pz.turn;
    state.pieces = pz.pieces;
    state.mat = null;
    state.hidden = {};
    state.busy = false;
    state.solved = false;
    fitLayout(true);
    if (pop) {
      state.pieces.forEach(function(p, k){
        if (shapeOffset(p)) return;
        pieceSquares(k).forEach(function(i){
          sqEls[i].style.setProperty('--d', (k * 50) + 'ms');
          sqEls[i].classList.add('pop');
        });
      });
    }
  }

  // Refresh, level switch and the next board all come here. The dots are
  // kept; only a finished round starts them over.
  function newBoard(){
    if (state.progress >= ROUND_SIZE) state.progress = 0;
    updateProgressDots();
    var level = state.difficulty;
    var m = maskRowsFor(level, state.count[level]++, state.lastOutline[level]);
    if (m.outline >= 0) state.lastOutline[level] = m.outline;
    var pz = makePuzzle(level, m.rows) || makePuzzle(level, squareRows(LEVELS[level].square));
    showPuzzle(pz, true);
  }

  // ---------- solved ----------
  function onSolved(){
    state.busy = true;
    state.solved = true;
    state.progress += 1; // counted straight away, so leaving now can't lose it
    saveProgress();
    PLSound.play('positive');
    // A green wave across the shape, one diagonal at a time from its top left.
    var m = state.mask;
    for (var i = 0; i < m.on.length; i++) {
      if (!m.on[i]) continue;
      var r = Math.floor(i / m.cols), c = i % m.cols;
      var el = sqEls[(state.mat.sr + r) * state.mat.cols + state.mat.sc + c];
      el.style.setProperty('--d', (r + c) * WAVE_STEP_MS + 'ms');
      el.classList.remove('drop', 'pop');
      el.classList.add('win');
    }
    var token = boardToken;
    winTimer = setTimeout(function(){
      if (token !== boardToken) return;
      updateProgressDots();
      if (state.progress >= ROUND_SIZE) showCelebration();
      else newBoard();
    }, (m.rows + m.cols - 2) * WAVE_STEP_MS + WAVE_POP_MS + WIN_HOLD_MS);
  }

  var CELEBRATION_FACE_SVG = '<svg class="celebration-face" viewBox="0 0 973 366" style="--final-scale:1;">' +
    '<circle fill="var(--face)" cx="65" cy="65" r="65"/>' +
    '<circle fill="var(--face)" cx="908" cy="65" r="65"/>' +
    '<rect fill="var(--face)" x="161" y="171" width="130" height="130"/>' +
    '<rect fill="var(--face)" x="683" y="171" width="130" height="130"/>' +
    '<rect fill="var(--face)" x="291" y="301" width="392" height="65"/>' +
    '</svg>';

  // Five boards: the smiley for 3 seconds, then the dots start over.
  function showCelebration(){
    updateAppHeight();
    els.celebration.innerHTML = CELEBRATION_FACE_SVG;
    PLSound.play('complete');
    els.mat.style.display = 'none';
    els.celebration.style.display = 'flex';
    celebrationTimer = setTimeout(newBoard, 3000);
  }

  // ---------- drag ----------
  // A touched piece moves into the floater (its mat squares look empty)
  // until it lands, flies back, or finishes its spring, turn or wobble.
  var drag = null;
  var ghost = { cells: [], key: '' };
  var flying = null; // { k, t }: the floater is still showing piece k

  function matGeom(){
    var rect = els.mat.getBoundingClientRect();
    return { left: rect.left, top: rect.top, cell: state.cell, gap: state.gap, step: state.cell + state.gap };
  }
  function setFloater(x, y){
    els.floater.style.transform = 'translate(' + x + 'px,' + y + 'px)';
  }
  // Draws piece k in the floater at mat square (r, c).
  function showInFloater(k, r, c){
    var p = state.pieces[k], g = matGeom();
    state.hidden[k] = true;
    renderPiece(k);
    var f = els.floater, pe = pieceEl(curCells(p), p.color);
    f.innerHTML = '';
    f.appendChild(pe);
    f.className = 'floater on';
    setFloater(g.left + c * g.step, g.top + r * g.step);
    return pe;
  }
  // The floater hands piece k back to the mat.
  function finishFly(){
    if (!flying) return;
    var k = flying.k;
    clearTimeout(flying.t);
    flying = null;
    delete state.hidden[k];
    if (state.pieces[k] && state.pieces[k].pos) renderPiece(k);
    els.floater.className = 'floater';
    els.floater.innerHTML = '';
  }
  function settleLater(k, ms){ flying = { k: k, t: setTimeout(finishFly, ms) }; }

  els.mat.addEventListener('pointerdown', function(e){
    finishFly();
    if (drag || state.busy) return;
    var i = sqEls.indexOf(e.target.closest('.sq'));
    var k = i < 0 ? -1 : state.occ[i];
    if (k < 0) return;
    if (e.button != null && e.button > 0) return;
    // Mouse only: on touch, the tap must stay a tap so iOS lets sound start.
    if (e.pointerType === 'mouse') e.preventDefault();
    PLSound.play('click');
    var p = state.pieces[k];
    drag = {
      k: k,
      from: { r: p.pos.r, c: p.pos.c },
      pointerId: e.pointerId,
      touch: e.pointerType !== 'mouse',
      startX: e.clientX,
      startY: e.clientY,
      started: false
    };
    drag.pe = showInFloater(k, p.pos.r, p.pos.c);
    drag.pe.classList.add('pressed');
    try { els.mat.setPointerCapture(e.pointerId); } catch (err) {}
    els.mat.addEventListener('pointermove', onMove);
    els.mat.addEventListener('pointerup', onUp);
    els.mat.addEventListener('pointercancel', onCancel);
  });

  function detach(){
    if (!drag) return;
    els.mat.removeEventListener('pointermove', onMove);
    els.mat.removeEventListener('pointerup', onUp);
    els.mat.removeEventListener('pointercancel', onCancel);
    try { els.mat.releasePointerCapture(drag.pointerId); } catch (err) {}
  }

  function startLift(e){
    var d = drag, p = state.pieces[d.k], g = matGeom();
    d.started = true;
    d.geom = g;
    d.cells = curCells(p);
    var dm = dims(d.cells);
    d.fullW = dm.w * g.cell + (dm.w - 1) * g.gap;
    d.fullH = dm.h * g.cell + (dm.h - 1) * g.gap;
    d.originX = g.left + d.from.c * g.step;
    d.originY = g.top + d.from.r * g.step;
    // Mouse keeps the spot that was grabbed; a finger holds the piece
    // above itself so it stays in sight.
    d.grabX = d.startX - d.originX;
    d.grabY = d.startY - d.originY;
    d.lift = g.cell * 1.1;
    // Its squares are free while it's carried (it may land on them again).
    squaresOf(d.cells, d.from.r, d.from.c).forEach(function(i){ state.occ[i] = -1; });
    d.pe.classList.remove('pressed');
    var f = els.floater;
    void f.offsetWidth;
    f.classList.add('lifting');
    clearTimeout(d.liftT);
    d.liftT = setTimeout(function(){ f.classList.remove('lifting'); }, 150);
    moveTo(e);
  }

  function targetXY(e){
    var d = drag;
    if (d.touch) return { x: e.clientX - d.fullW / 2, y: e.clientY - d.fullH - d.lift };
    return { x: e.clientX - d.grabX, y: e.clientY - d.grabY };
  }

  function moveTo(e){
    var d = drag, t = targetXY(e);
    setFloater(t.x, t.y);
    var g = d.geom;
    var c = Math.round((t.x - g.left) / g.step);
    var r = Math.round((t.y - g.top) / g.step);
    if (fitsAt(d.cells, r, c)) { d.r = r; d.c = c; showGhost(d.cells, state.pieces[d.k].color, r, c); }
    else { d.r = null; clearGhost(); }
  }

  function showGhost(cells, color, r, c){
    var key = r + ',' + c;
    if (ghost.key === key) return;
    clearGhost();
    ghost.key = key;
    ghost.cells = squaresOf(cells, r, c);
    ghost.cells.forEach(function(i){
      sqEls[i].classList.add('ghost');
      sqEls[i].style.setProperty('--c', COLORS[color]);
    });
  }
  function clearGhost(){
    ghost.cells.forEach(function(i){
      if (!sqEls[i]) return;
      sqEls[i].classList.remove('ghost');
      renderSq(i);
    });
    ghost.cells = [];
    ghost.key = '';
  }

  function onMove(e){
    if (!drag || e.pointerId !== drag.pointerId) return;
    if (!drag.started) {
      if (Math.abs(e.clientX - drag.startX) + Math.abs(e.clientY - drag.startY) <= TAP_SLOP) return;
      startLift(e);
      return;
    }
    moveTo(e);
  }

  function onUp(e){
    if (!drag || e.pointerId !== drag.pointerId) return;
    var d = drag;
    detach();
    drag = null;
    if (!d.started) { tapped(d); return; }
    clearTimeout(d.liftT);
    clearGhost();
    var f = els.floater;
    f.classList.remove('lifting');
    if (d.r != null && fitsAt(d.cells, d.r, d.c) && !state.busy) {
      state.busy = true;
      f.classList.add('placing');
      setFloater(d.geom.left + d.c * d.geom.step, d.geom.top + d.r * d.geom.step);
      var token = boardToken;
      setTimeout(function(){
        if (token !== boardToken) return;
        state.busy = false;
        place(d.k, d.r, d.c);
      }, 90);
    } else {
      flyBack(d);
    }
  }

  function place(k, r, c){
    var p = state.pieces[k];
    p.pos = { r: r, c: c };
    pieceSquares(k).forEach(function(i){ state.occ[i] = k; });
    delete state.hidden[k];
    els.floater.className = 'floater';
    els.floater.innerHTML = '';
    pieceSquares(k).forEach(function(i){
      renderSq(i);
      var el = sqEls[i];
      el.classList.remove('drop'); void el.offsetWidth; el.classList.add('drop');
    });
    if (isSolved()) onSolved();
  }

  // A tap: press and spring. On hard it also turns the piece a quarter
  // turn clockwise about its middle -- nudged up to 2 squares if that
  // spot is taken, or a wobble if there's no room. (The click on
  // pointerdown is its sound.)
  function tapped(d){
    var k = d.k, p = state.pieces[k];
    d.pe.classList.remove('pressed');
    void d.pe.offsetWidth;
    if (!state.turn) { d.pe.classList.add('spring'); settleLater(k, 330); return; }
    var spot = turnSpot(k);
    if (!spot) { d.pe.classList.add('wobble'); settleLater(k, 390); return; }
    var old = pieceSquares(k);
    old.forEach(function(i){ state.occ[i] = -1; });
    p.rot = (p.rot + 1) % 4;
    p.pos = spot;
    pieceSquares(k).forEach(function(i){ state.occ[i] = k; });
    old.forEach(renderSq);
    var pe = showInFloater(k, spot.r, spot.c);
    pe.classList.add('turn');
    settleLater(k, 330);
  }
  // Where piece k lands turned once more, or null if there's no room.
  function turnSpot(k){
    var p = state.pieces[k], cur = curCells(p), next = turnCells(p.cells, p.rot + 1);
    var a = dims(cur), b = dims(next);
    var r0 = p.pos.r + halfRound((a.h - b.h) / 2), c0 = p.pos.c + halfRound((a.w - b.w) / 2);
    var own = pieceSquares(k), spot = null;
    own.forEach(function(i){ state.occ[i] = -1; });
    for (var t = 0; t < TURN_TRIES.length && !spot; t++) {
      var r = r0 + TURN_TRIES[t][0], c = c0 + TURN_TRIES[t][1];
      if (fitsAt(next, r, c)) spot = { r: r, c: c };
    }
    own.forEach(function(i){ state.occ[i] = k; });
    return spot;
  }

  // Off the mat, or onto another piece: back where it was picked up.
  function flyBack(d){
    squaresOf(d.cells, d.from.r, d.from.c).forEach(function(i){ state.occ[i] = d.k; });
    var f = els.floater;
    f.classList.add('returning');
    setFloater(d.originX, d.originY);
    settleLater(d.k, 230);
  }

  function onCancel(e){
    if (!drag || e.pointerId !== drag.pointerId) return;
    cancelDrag();
  }
  // A drag that never got its pointerup (an OS gesture took the touch,
  // the tab was hidden, the screen changed size): the piece goes back.
  function cancelDrag(){
    if (!drag) return;
    var d = drag;
    detach();
    drag = null;
    clearGhost();
    if (d.started) {
      clearTimeout(d.liftT);
      els.floater.classList.remove('lifting');
      flyBack(d);
    } else {
      settleLater(d.k, 0);
      finishFly();
    }
  }
  window.addEventListener('blur', cancelDrag);
  document.addEventListener('visibilitychange', function(){ if (document.hidden) cancelDrag(); });

  // ---------- buttons ----------
  els.diffGroup.addEventListener('click', function(e){
    var btn = e.target.closest('.diff-btn');
    if (!btn) return;
    state.difficulty = btn.dataset.tier;
    markActive();
    newBoard();
  });
  els.refreshBtn.addEventListener('click', function(){ newBoard(); });
  els.backBtn.addEventListener('click', function(){ PLSound.go('../../'); });

  function markActive(){
    els.diffGroup.querySelectorAll('.diff-btn').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-tier') === state.difficulty);
    });
  }

  function introduceTraySlider(){
    var el = els.controlsSlider;
    if (!el || window.innerWidth > 767) return;
    var STORAGE_KEY = 'fillshape.traySliderIntroShown';
    try { if (localStorage.getItem(STORAGE_KEY)) return; } catch (e) {}
    var maxScroll = el.scrollWidth - el.clientWidth;
    if (maxScroll <= 0) return;
    var reveal = maxScroll;
    el.scrollLeft = reveal;
    var duration = 1800;
    var start = null;
    function easeInOutCubic(t){
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }
    function step(ts){
      if (start === null) start = ts;
      var elapsed = ts - start;
      if (elapsed >= duration) {
        el.scrollLeft = 0;
        try { localStorage.setItem(STORAGE_KEY, '1'); } catch (e) {}
        return;
      }
      el.scrollLeft = reveal * (1 - easeInOutCubic(elapsed / duration));
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  introduceTraySlider();

  // ---------- resume after the rotate-block reload ----------
  var RESUME_KEY = 'playandlearn.resume.fillshape';
  var RESUME_MAX_AGE = 10 * 60 * 1000;
  function saveResume(){
    try {
      var data = snapshotGame();
      if (data) sessionStorage.setItem(RESUME_KEY, JSON.stringify({ at: Date.now(), data: data }));
    } catch (e) {}
  }
  function takeResume(){
    try {
      var raw = sessionStorage.getItem(RESUME_KEY);
      sessionStorage.removeItem(RESUME_KEY);
      if (!raw) return null;
      var saved = JSON.parse(raw);
      if (!saved || Date.now() - saved.at > RESUME_MAX_AGE) return null;
      return saved.data;
    } catch (e) { return null; }
  }

  // The shape, every piece (cells, colour, turn, and where it sits in the
  // shape -- or null when it's loose: loose pieces are packed again on
  // restore, as mat squares change with the screen), the level and the
  // dots. A piece mid-drag counts as where it was picked up. A solved
  // board (wave or smiley showing) resumes as the next board.
  function snapshotGame(){
    if (!state.mat) return null;
    var data = {
      difficulty: state.difficulty,
      progress: state.progress >= ROUND_SIZE ? 0 : state.progress,
      count: state.count,
      puzzle: null
    };
    if (state.solved || els.celebration.style.display === 'flex') return data;
    data.puzzle = {
      rows: state.mask.rows,
      cols: state.mask.cols,
      on: state.mask.on.slice(),
      turn: state.turn,
      pieces: state.pieces.map(function(p){
        return { cells: p.cells, home: p.home, color: p.color, rot: p.rot, at: shapeOffset(p) };
      })
    };
    return data;
  }

  function restoreGame(data){
    if (!data || typeof data !== 'object') return false;
    if (TIERS.indexOf(data.difficulty) === -1) return false;
    if (!isInt(data.progress, 0, ROUND_SIZE - 1)) return false;
    var pz = data.puzzle;
    if (pz != null && !validatePuzzle(pz)) return false;
    var copy = null;
    if (pz) {
      copy = {
        rows: pz.rows, cols: pz.cols, on: pz.on.slice(), turn: !!pz.turn,
        pieces: pz.pieces.map(function(p){
          return { cells: p.cells.map(function(q){ return q.slice(); }), home: p.home.slice(), color: p.color, rot: p.rot, at: null, pos: null };
        })
      };
      // Pieces that were in the shape go back there; they must still fit.
      var occ = copy.on.map(function(){ return -1; });
      for (var k = 0; k < copy.pieces.length; k++) {
        var at = pz.pieces[k].at;
        if (at == null) continue;
        if (!Array.isArray(at) || !isInt(at[0], 0, copy.rows - 1) || !isInt(at[1], 0, copy.cols - 1)) return false;
        var cells = turnCells(copy.pieces[k].cells, copy.pieces[k].rot);
        for (var j = 0; j < cells.length; j++) {
          var r = at[0] + cells[j][0], c = at[1] + cells[j][1], x = r * copy.cols + c;
          if (r >= copy.rows || c >= copy.cols || !copy.on[x] || occ[x] !== -1) return false;
          occ[x] = k;
        }
        copy.pieces[k].at = [at[0], at[1]];
      }
      if (copy.pieces.every(function(p){ return p.at; })) copy = null; // already solved: next board
    }
    state.difficulty = data.difficulty;
    state.progress = data.progress;
    if (data.count && typeof data.count === 'object') {
      TIERS.forEach(function(t){ if (isInt(data.count[t], 0, 1e9)) state.count[t] = data.count[t]; });
    }
    if (copy) {
      updateProgressDots();
      showPuzzle(copy, true);
    } else {
      newBoard();
    }
    return true;
  }

  // Remember the chosen level and the progress dots between visits: leaving the game,
  // playing another one or coming back another day keeps them.
  var SAVE_KEY = null;
  function saveProgress(){
    if (!SAVE_KEY) return; // not set up yet (nothing loaded to overwrite)
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({ difficulty: state.difficulty, progress: state.progress || 0 }));
    } catch (e) {}
  }
  function loadProgress(){
    try {
      var d = JSON.parse(localStorage.getItem('playandlearn.saved.fillshape') || 'null');
      if (!d || TIERS.indexOf(d.difficulty) === -1) return null;
      if (typeof d.progress !== 'number' || d.progress % 1 !== 0 || d.progress < 0 || d.progress >= ROUND_SIZE) d.progress = 0;
      return d;
    } catch (e) { return null; }
  }
  var saved = loadProgress();
  window.addEventListener('pagehide', saveProgress);
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'hidden') saveProgress();
  });

  var resumed = takeResume();
  SAVE_KEY = 'playandlearn.saved.fillshape';
  if (resumed && restoreGame(resumed)) {
    markActive();
  } else {
    if (saved) { state.difficulty = saved.difficulty; state.progress = saved.progress; }
    markActive();
    newBoard();
  }
})();
</script>
<script>
/* Level hint: the three levels light up green, yellow and red in turn, once
   on the whole site. ?levelhint replays. */
(function(){
  var g = document.getElementById('diffGroup'); if (!g) return;
  var KEY = 'playandlearn.levelHintShown';
  var force = /[?&]levelhint\b/.test(location.search), played = false;
  function shown(){
    try {
      if (localStorage.getItem(KEY)) return true;
      for (var i = 0; i < localStorage.length; i++) {
        if (/\.levelHintShown$/.test(localStorage.key(i))) return true;
      }
    } catch (e) {}
    return false;
  }
  function play(delay){
    if (played || (!force && shown())) return;
    played = true;
    try { localStorage.setItem(KEY, '1'); } catch (e) {}
    setTimeout(function(){
      ['easy','medium','hard'].forEach(function(t, i){
        setTimeout(function(){
          var b = g.querySelector('[data-tier="' + t + '"]'); if (!b) return;
          b.classList.remove('hint'); void b.offsetWidth; b.classList.add('hint');
          setTimeout(function(){ b.classList.remove('hint'); }, 1350);
        }, i * 500);
      });
    }, delay || 0);
  }
  g.addEventListener('click', function(e){
    var b = e.target.closest('.diff-btn'); if (!b) return;
    b.classList.remove('pick'); void b.offsetWidth; b.classList.add('pick');
    clearTimeout(b._pickT);
    b._pickT = setTimeout(function(){ b.classList.remove('pick'); }, 950);
  });
  window.PLLevelHint = play;
  if (!document.currentScript.hasAttribute('data-after-first-solve')) {
    play(window.innerWidth <= 767 ? 2200 : 900);
  }
})();
</script>
