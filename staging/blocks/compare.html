<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Blocks: darker background trial</title>
<style>
  /* Trial page (not part of the site): toned-down versions of Blocks' blue,
     side by side at phone size on the same sample board. Nothing saves. */
  html, body{ margin:0; min-height:100%; background:#141414; }
  body{
    display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:center; gap:28px 16px; padding:20px; box-sizing:border-box;
    font:13px/1.3 -apple-system, system-ui, sans-serif; color:#9a9a9a;
  }
  figure{ margin:0; display:flex; flex-direction:column; align-items:center; gap:8px; }
  figcaption{ max-width:calc(390px * var(--k)); text-align:center; }
  figcaption span{ display:block; color:#777; }
  .frame{
    width:calc(390px * var(--k)); height:calc(844px * var(--k));
    border-radius:calc(36px * var(--k)); overflow:hidden; box-shadow:0 0 0 2px #333;
  }
  iframe{ width:390px; height:844px; border:0; display:block; transform:scale(var(--k)); transform-origin:0 0; }
  :root{ --k: 0.5; }
  b{ color:#ddd; font-weight:600; }
</style>
</head>
<body>
  <figure><div class="frame"><iframe data-src="./?bg=0"></iframe></div><figcaption><b>0 Now: clay grey</b><span>#766C65 · darker squares</span></figcaption></figure>
  <figure><div class="frame"><iframe data-src="./?bg=1"></iframe></div><figcaption><b>1 Clay, deeper</b><span>#655C56</span></figcaption></figure>
  <figure><div class="frame"><iframe data-src="./?bg=2"></iframe></div><figcaption><b>2 Clay, deep</b><span>#574F4A</span></figcaption></figure>
  <figure><div class="frame"><iframe data-src="./?bg=3"></iframe></div><figcaption><b>3 Rosewood</b><span>#5E4A4A</span></figcaption></figure>
  <figure><div class="frame"><iframe data-src="./?bg=4"></iframe></div><figcaption><b>4 Dusty plum</b><span>#5A4652</span></figcaption></figure>
  <figure><div class="frame"><iframe data-src="./?bg=5"></iframe></div><figcaption><b>5 Aubergine</b><span>#4A3A4A</span></figcaption></figure>
  <figure><div class="frame"><iframe data-src="./?bg=6"></iframe></div><figcaption><b>6 Deep mauve</b><span>#634A5A</span></figcaption></figure>
  <figure><div class="frame"><iframe data-src="./?bg=7"></iframe></div><figcaption><b>7 Dark terracotta</b><span>#6B4238</span></figcaption></figure>
  <figure><div class="frame"><iframe data-src="./?bg=8"></iframe></div><figcaption><b>8 Oxblood</b><span>#5A2E2E</span></figcaption></figure>
  <figure><div class="frame"><iframe data-src="./?bg=9"></iframe></div><figcaption><b>9 Deep denim</b><span>#34405E</span></figcaption></figure>
  <figure><div class="frame"><iframe data-src="./?bg=10"></iframe></div><figcaption><b>10 Ink blue</b><span>#2A3350</span></figcaption></figure>
  <figure><div class="frame"><iframe data-src="./?bg=11"></iframe></div><figcaption><b>11 Forest</b><span>#2E4A36</span></figcaption></figure>
  <figure><div class="frame"><iframe data-src="./?bg=12"></iframe></div><figcaption><b>12 Moss</b><span>#475238</span></figcaption></figure>
<script>
  // Fit all frames in one row if the window allows, and load them one by one.
  (function(){
    var frames = Array.prototype.slice.call(document.querySelectorAll('iframe[data-src]'));
    var n = frames.length;
    function fit(){
      // Pick the number of rows that makes the frames biggest.
      var best = 0.2;
      for (var rows = 1; rows <= 3; rows++) {
        var cols = Math.ceil(n / rows);
        var k = Math.min(1, (window.innerHeight - 40 - 90 * rows) / (844 * rows), (window.innerWidth - 16 * (cols + 1) - 40) / (390 * cols));
        if (k > best) best = k;
      }
      document.documentElement.style.setProperty('--k', best);
    }
    fit();
    window.addEventListener('resize', fit);
    function next(i){
      if (i >= n) return;
      var f = frames[i], done = false;
      function go(){ if (!done) { done = true; next(i + 1); } }
      f.addEventListener('load', go);
      setTimeout(go, 4000);
      f.src = f.getAttribute('data-src');
    }
    next(0);
  })();
</script>
</body>
</html>
