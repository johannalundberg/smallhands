<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Blocks: phone width trial</title>
<style>
  /* Trial page (not part of the site): the board-to-mat spacing at two real
     phone heights -- Safari with its bars (390x664) and the home-screen app
     (390x797). Same sample board; nothing saves. */
  html, body{ margin:0; min-height:100%; background:#141414; }
  body{ padding:20px; box-sizing:border-box; font:13px/1.3 -apple-system, system-ui, sans-serif; color:#9a9a9a; }
  .grid{ display:grid; grid-template-columns:repeat(3, max-content); gap:20px 16px; justify-content:center; align-items:start; }
  .head{ text-align:center; color:#ddd; font-weight:600; }
  .rowlabel{ grid-column:1 / -1; color:#777; text-align:center; margin-top:4px; }
  figure{ margin:0; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .frame{ width:calc(390px * var(--k)); border-radius:calc(30px * var(--k)); overflow:hidden; box-shadow:0 0 0 2px #333; }
  .frame.s{ height:calc(664px * var(--k)); } .frame.a{ height:calc(797px * var(--k)); }
  iframe{ width:390px; border:0; display:block; transform:scale(var(--k)); transform-origin:0 0; }
  iframe.s{ height:664px; } iframe.a{ height:797px; }
  :root{ --k:0.4; }
</style>
</head>
<body>
<div class="grid" id="grid">
  <div class="head">Now: a full empty row</div><div class="head">Half an empty row</div><div class="head">No empty row</div>
  <div class="rowlabel">Safari with its bars (390 × 664)</div>
  <figure><div class="frame s"><iframe class="s" data-src="./?space=1"></iframe></div></figure>
  <figure><div class="frame s"><iframe class="s" data-src="./?space=05"></iframe></div></figure>
  <figure><div class="frame s"><iframe class="s" data-src="./?space=0"></iframe></div></figure>
  <div class="rowlabel">Home-screen app (390 × 797)</div>
  <figure><div class="frame a"><iframe class="a" data-src="./?space=1"></iframe></div></figure>
  <figure><div class="frame a"><iframe class="a" data-src="./?space=05"></iframe></div></figure>
  <figure><div class="frame a"><iframe class="a" data-src="./?space=0"></iframe></div></figure>
</div>
<script>
  (function(){
    var frames = Array.prototype.slice.call(document.querySelectorAll('iframe[data-src]'));
    function fit(){
      var k = Math.min(1, (window.innerWidth - 40 - 32) / (390 * 3), (window.innerHeight - 140) / (664 + 797));
      document.documentElement.style.setProperty('--k', Math.max(0.25, k));
    }
    fit(); window.addEventListener('resize', fit);
    function next(i){
      if (i >= frames.length) return;
      var f = frames[i], done = false;
      function go(){ if (!done) { done = true; next(i + 1); } }
      f.addEventListener('load', go); setTimeout(go, 4000);
      f.src = f.getAttribute('data-src');
    }
    next(0);
  })();
</script>
</body>
</html>
