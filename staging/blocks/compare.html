<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Blocks: look trial</title>
<style>
  /* Trial page (not part of the site): piece colours on Unblock's blue
     #5F44FF, at phone size. Trial frames never save. */
  html, body{ margin:0; height:100%; background:#141414; }
  body{
    display:flex; align-items:center; justify-content:center; gap:24px;
    font:14px/1.3 -apple-system, system-ui, sans-serif; color:#9a9a9a;
  }
  figure{ margin:0; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .frame{
    width:calc(390px * var(--k)); height:calc(844px * var(--k));
    border-radius:calc(36px * var(--k)); overflow:hidden;
    box-shadow:0 0 0 2px #333;
  }
  iframe{
    width:390px; height:844px; border:0; display:block;
    transform:scale(var(--k)); transform-origin:0 0;
  }
  :root{ --k: 0.5; }
  b{ color:#ddd; font-weight:600; }
</style>
</head>
<body>
  <figure><div class="frame"><iframe src="./?look=blue-earthy"></iframe></div><figcaption><b>A</b> earthy: sand, mustard, orange, blush, sage teal</figcaption></figure>
  <figure><div class="frame"><iframe src="./?look=blue-warm"></iframe></div><figcaption><b>B</b> warm bright: cream, sun, orange, pink, mint</figcaption></figure>
  <figure><div class="frame"><iframe src="./?look=blue-dark"></iframe></div><figcaption><b>C</b> light + dark: cream, sun, orange, sage teal, espresso</figcaption></figure>
  <figure><div class="frame"><iframe src="./?look=unblock"></iframe></div><figcaption><b>D</b> Unblock's own colours</figcaption></figure>
<script>
  // Fit all the phone frames into the window, as big as they can be.
  (function(){
    var n = document.querySelectorAll('.frame').length;
    function fit(){
      var k = Math.min(1, (window.innerHeight - 70) / 844, (window.innerWidth - 24 * (n + 1)) / (390 * n));
      document.documentElement.style.setProperty('--k', Math.max(0.2, k));
    }
    fit();
    window.addEventListener('resize', fit);
  })();
</script>
</body>
</html>
