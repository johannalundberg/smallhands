<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Blocks: background trial</title>
<style>
  /* Trial page (not part of the site): eight background colours for Blocks,
     each in a phone-sized frame. The frames show your saved game but don't
     save anything, so playing in them is safe. */
  html, body{ margin:0; min-height:100%; background:#141414; }
  body{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(calc(390px * var(--k)), 1fr));
    gap:28px 20px; padding:24px; box-sizing:border-box;
    font:13px/1.3 -apple-system, system-ui, sans-serif; color:#9a9a9a;
  }
  figure{ margin:0; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .frame{
    width:calc(390px * var(--k)); height:calc(844px * var(--k));
    border-radius:calc(36px * var(--k)); overflow:hidden;
    box-shadow:0 0 0 2px #333;
  }
  iframe{
    width:390px; height:844px; border:0; display:block;
    transform:scale(var(--k)); transform-origin:0 0;
  }
  :root{ --k: 0.5; }
  b{ color:#ddd; font-weight:600; }
</style>
</head>
<body>
  <figure><div class="frame"><iframe src="./?bg=1"></iframe></div><figcaption><b>1</b> wine #4A1F2E</figcaption></figure>
  <figure><div class="frame"><iframe src="./?bg=2"></iframe></div><figcaption><b>2</b> terracotta #7A3B2E</figcaption></figure>
  <figure><div class="frame"><iframe src="./?bg=3"></iframe></div><figcaption><b>3</b> plum #5C1A4F</figcaption></figure>
  <figure><div class="frame"><iframe src="./?bg=4"></iframe></div><figcaption><b>4</b> mauve #7A5C6E</figcaption></figure>
  <figure><div class="frame"><iframe src="./?bg=5"></iframe></div><figcaption><b>5</b> dusk violet #4B4466</figcaption></figure>
  <figure><div class="frame"><iframe src="./?bg=6"></iframe></div><figcaption><b>6</b> indigo #2B2670</figcaption></figure>
  <figure><div class="frame"><iframe src="./?bg=7"></iframe></div><figcaption><b>7</b> ocean #12355B</figcaption></figure>
  <figure><div class="frame"><iframe src="./?bg=8"></iframe></div><figcaption><b>8</b> stone #5A5552</figcaption></figure>
</body>
</html>
