<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Blocks: background trial</title>
<style>
  /* Trial page (not part of the site): her two picks from the warm round,
     mahogany and rust, side by side at phone size. The frames show the
     saved game but don't save anything, so playing in them is safe. */
  html, body{ margin:0; height:100%; background:#141414; }
  body{
    display:flex; align-items:center; justify-content:center; gap:48px;
    font:14px/1.3 -apple-system, system-ui, sans-serif; color:#9a9a9a;
  }
  figure{ margin:0; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .frame{
    width:calc(390px * var(--k)); height:calc(844px * var(--k));
    border-radius:calc(36px * var(--k)); overflow:hidden;
    box-shadow:0 0 0 2px #333;
  }
  iframe{
    width:390px; height:844px; border:0; display:block;
    transform:scale(var(--k)); transform-origin:0 0;
  }
  :root{ --k: min(1, calc((100vh - 70px) / 844px)); }
  b{ color:#ddd; font-weight:600; }
</style>
</head>
<body>
  <figure><div class="frame"><iframe src="./?bg=1"></iframe></div><figcaption><b>1</b> mahogany #5E2219</figcaption></figure>
  <figure><div class="frame"><iframe src="./?bg=7"></iframe></div><figcaption><b>7</b> rust #A0441E</figcaption></figure>
</body>
</html>
