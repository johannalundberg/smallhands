<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Blocks: look trial</title>
<style>
  /* Trial page (not part of the site): Blocks now next to two toned-down
     looks, at phone size. Only the first frame (the real game) saves. */
  html, body{ margin:0; height:100%; background:#141414; }
  body{
    display:flex; align-items:center; justify-content:center; gap:32px;
    font:14px/1.3 -apple-system, system-ui, sans-serif; color:#9a9a9a;
  }
  figure{ margin:0; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .frame{
    width:calc(390px * var(--k)); height:calc(844px * var(--k));
    border-radius:calc(36px * var(--k)); overflow:hidden;
    box-shadow:0 0 0 2px #333;
  }
  iframe{
    width:390px; height:844px; border:0; display:block;
    transform:scale(var(--k)); transform-origin:0 0;
  }
  :root{ --k: min(1, calc((100vh - 70px) / 844px)); }
  b{ color:#ddd; font-weight:600; }
</style>
</head>
<body>
  <figure><div class="frame"><iframe src="./"></iframe></div><figcaption><b>1</b> now: indigo, vivid pieces</figcaption></figure>
  <figure><div class="frame"><iframe src="./?look=earthy"></iframe></div><figcaption><b>2</b> indigo, earthy pieces</figcaption></figure>
  <figure><div class="frame"><iframe src="./?look=earthy-blue"></iframe></div><figcaption><b>3</b> Unblock blue, earthy pieces</figcaption></figure>
</body>
</html>
