<style>
  :root{
    --bg:#6284FF; /* Figma 425:955 */
    --bright:#E4E4E4;
    --shape:#2A231D; /* Figma 425:955: dark brown on the blue page */
    --ink:#202020;
    --ink-muted:rgba(32,32,32,0.5); /* Figma 425:955 buttons */
    --success:#1B690F; /* Figma 425:955 */
    --incorrect:#B42323; /* Figma 425:955 */
    --unit: 1.1574vw;
    --icon-size: clamp(44px, 8.912vw, 154px);
    --v-reserve-top: calc(var(--icon-size) + 2 * var(--unit));
    --v-reserve-bottom: calc(var(--icon-size) + 2 * var(--unit));
    /* Flat value rather than a viewport-scaled one -- card size itself is
       capped at a flat 460px too, so the gap should stay flat alongside it. */
    --cluster-gap: 60px;
  }

  @media (min-width: 768px) and (max-width: 1023px) and (min-height: 501px){
    :root{
      --unit: 2.3981vw;
      --icon-size: clamp(80px, 11.4824vw, 120px);
    }
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    position:relative;
    margin:0;
    height: var(--app-height, 100vh);
    background:var(--bg);
    color:var(--bright);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select:none;
    user-select:none;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action:manipulation;
    transition: background 80ms ease;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  /* ---------- icon buttons (difficulty / back / refresh) ---------- */
  .icon-btn{
    appearance:none;
    background:none;
    border:none;
    cursor:pointer;
    width:var(--icon-size);
    height:var(--icon-size);
    aspect-ratio:1;
    border-radius:50%;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:none;
    transform: translateZ(0);
    -webkit-transform: translateZ(0);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    transition: transform 120ms ease;
  }
  .icon-btn:active{ transform: translateZ(0) scale(0.94); }
  @media (hover:hover) and (pointer:fine){
    .icon-btn:hover{ transform: translateZ(0) scale(1.035); }
  }
  .icon-btn svg{ width:100%; height:100%; display:block; }
  .icon-btn .fill-bg{ transition: fill 120ms ease; }

  .diff-group{ position:absolute; right:var(--unit); top:var(--unit); display:flex; gap:calc(var(--icon-size) * 0.1); z-index:2; }
  .diff-btn .fill-bg{ fill:var(--ink-muted); }
  .diff-btn.active .fill-bg{ fill:var(--bright); }

  .btn-row{ position:absolute; left:var(--unit); bottom:var(--unit); display:flex; gap:calc(var(--icon-size) * 0.1); z-index:2; }

  @media (min-width: 768px) and (max-width: 1023px) and (min-height: 501px){
    .diff-group, .btn-row{ gap: calc(var(--icon-size) * 0.1253); }
  }

  .controls-slider{ display:contents; }

  /* ---------- round progress ---------- */
  .progress-dots{
    position:absolute;
    right:var(--unit);
    bottom:var(--unit);
    z-index:2;
    display:flex;
    align-items:center;
    gap: calc(var(--icon-size) * 0.08);
  }
  .progress-dots .dot{
    width: calc(var(--icon-size) * 0.25);
    height: calc(var(--icon-size) * 0.25);
    border-radius:50%;
    background: rgba(32,32,32,0.4); /* Figma 425:955 dots */
    transition: background 150ms ease;
  }
  .progress-dots .dot.done{ background: var(--bright); }

  /* ---------- the cluster row ---------- */
  .board-wrap{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  .cluster-row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap: var(--cluster-gap);
  }
  /* Each card's size comes from BOTH the width 3 cards need to share AND the
     height actually left between the top/bottom icon rows, taking whichever
     is smaller -- the same min() shape Othello's own .board rule uses, baked
     in from the start rather than retrofitted after an iPad landscape
     overflow (the bug Number Puzzle and Tic-Tac-Toe both needed a follow-up
     fix for). Card count is always 3; difficulty scales the composition's
     visual complexity instead (see TIER_CONFIG in the script). */
  .cluster-card{
    flex:none;
    width: min(
      calc((94vw - 2 * var(--cluster-gap)) / 3),
      calc(var(--app-height, 100vh) - var(--v-reserve-top) - var(--v-reserve-bottom)),
      460px
    );
    aspect-ratio:1;
    background:none;
    cursor:pointer;
    transition: transform 120ms ease;
  }
  .cluster-card:active{ transform:scale(0.96); }
  @media (hover:hover) and (pointer:fine){
    .cluster-card:hover{ transform:scale(1.035); }
  }
  /* Same jump as Memory's found-a-pair feedback (tile-pop): bounce up
     bigger then settle, on both a correct and a wrong tap -- only the
     shape color (below) tells the two apart, there's no card background. */
  .cluster-card.pop{ animation: cluster-pop 420ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes cluster-pop{
    0%{ transform:scale(1); }
    45%{ transform:scale(1.12); }
    75%{ transform:scale(0.98); }
    100%{ transform:scale(1); }
  }
  .cluster-card svg{ width:100%; height:100%; display:block; overflow:visible; }
  /* 1px heavier than Labyrinths. .wall-line (her call: thin lines read too
     light on the 6284FF blue). The square isn't a card frame, it's just one of the shape
     types, so it and every other shape share one stroke convention. */
  .cluster-shape{ fill:none; stroke:var(--shape); stroke-width:4.5px; vector-effect:non-scaling-stroke; }
  .cluster-card.wrong .cluster-shape{ stroke:var(--incorrect); }
  .cluster-card.correct .cluster-shape{ stroke:var(--success); }

  @keyframes bounce-in{
    0%{ transform:scale(0); opacity:0; }
    100%{ transform:scale(var(--final-scale)); opacity:1; }
  }
  .celebration{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:4;
  }
  .celebration-face{
    width:min(70vmin, 700px);
    height:auto;
    animation: bounce-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  /* ---------- phone: single scrollable slider-menu bar ---------- */
  @media (max-width: 767px), (max-height: 500px){
    :root{
      --unit: 5.089vw;
      --icon-size: clamp(52px, 20.5344vw, 100px);
      /* Progress dots move to top here (see below), and read smaller than a
         full icon row, so the top reserve only needs to match their own
         height -- matches Number Puzzle's own mobile reserve split exactly. */
      --v-reserve-top: calc(var(--unit) * 2 + var(--icon-size) * 0.25);
      --v-reserve-bottom: calc(var(--unit) * 2 + var(--icon-size));
      /* Cards stack in one column on phone (per the mobile sketch) instead
         of sitting 3 across, with much less room needed between them than
         the desktop row (there's no left/right neighbor to guard against). */
      --cluster-gap: 16px;
    }
    /* Touch has no hover, so desktop's grow-on-hover feedback never fires
       here -- darken on tap instead, so pressing any icon button is
       actually visible. (The icons inside the tray deliberately don't grow:
       the tray itself is the thing that grows, see .controls-slider:active.) */
    .icon-btn:active{ transform: translateZ(0); filter: brightness(0.7); }
    .cluster-shape{ stroke-width:3px; }
    .cluster-row{ flex-direction:column; }
    .cluster-card{
      width: min(
        56vw,
        calc((var(--app-height, 100vh) - var(--v-reserve-top) - var(--v-reserve-bottom) - 2 * var(--cluster-gap)) / 3),
        230px
      );
    }
    .controls-slider{
      display:flex;
      align-items:flex-end;
      gap: calc(var(--icon-size) * 0.1239);
      position:fixed;
      left:var(--unit);
      right:var(--unit);
      bottom:var(--unit);
      z-index:3;
      background: rgba(0,0,0,0.22);
      border-radius:999px;
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    .controls-slider::-webkit-scrollbar{ display:none; }
    /* Press feedback for the tray itself, like the icons and tiles: it grows
       slightly while touched (:active also matches while any button inside it
       is held, so tapping an icon gives both). */
    .controls-slider{ transition: transform 120ms ease; }
    .controls-slider:active{ transform: scale(1.03); }
    .diff-group, .btn-row{ display:contents; }
    .progress-dots{ left:var(--unit); top:var(--unit); right:auto; bottom:auto; }
    body{
      padding-top: var(--v-reserve-top);
      padding-bottom: var(--v-reserve-bottom);
    }
  }

  @media (max-height: 500px) and (min-width: 500px) and (orientation: landscape){
    :root{
      --unit: clamp(8px, 3.5vh, 14px);
      --icon-size: clamp(40px, 14vh, 64px);
    }
  }

  .rotate-block{
    display:none;
    position:fixed;
    top: calc(-1 * env(safe-area-inset-top, 0px));
    right: calc(-1 * env(safe-area-inset-right, 0px));
    bottom: calc(-1 * env(safe-area-inset-bottom, 0px));
    left: calc(-1 * env(safe-area-inset-left, 0px));
    background:var(--incorrect);
    z-index:9999;
    align-items:center;
    justify-content:center;
  }
  .rotate-block svg{ width:min(50vh, 320px); height:auto; }
  @media (max-height: 500px) and (min-width: 500px) and (orientation: landscape){
    .rotate-block{ display:flex; }
  }
  /* No double-tap zoom anywhere. touch-action doesn't reach into a scrolling
     element (the mobile tray scrolls sideways), so the tray needs its own:
     two quick taps on the level buttons there zoomed the whole page in, and
     with zoom otherwise locked there was no way back out. */
  html, body, .controls-slider{ touch-action:manipulation; }

<script>
(function(){
  "use strict";


  // iOS Safari only applies :active styles on tap if some element on the
  // page has a touch listener -- this is that listener (a no-op is enough).
  document.addEventListener('touchstart', function(){}, { passive: true });
  // Six types so there's always at least one "spare" left over for the
  // swap mutation, even at the hard tier's higher inner-shape count.
  var SHAPES = ['square', 'rect', 'triangle', 'circle', 'diamond', 'oval'];
  var CLUSTER_COUNT = 3;
  // Every cluster gets one "anchor" shape -- always the same type, size and
  // dead-center position across all 3 cards every round -- so all 3 always
  // read as the same overall size and stay visually centered, no matter how
  // the smaller shapes nested inside it are randomized. The anchor itself
  // never mutates; only the inner shapes vary and carry the odd-one-out
  // difference. Difficulty scales the inner-shape count (more = harder to
  // spot), not cluster count, which is always 3.
  // Most of what reads as "gap between clusters" is actually empty space
  // inside each card, not the CSS gap between cards -- so this needs to be
  // large enough that the shapes actually fill their own card, or shrinking
  // --cluster-gap has little visible effect.
  var ANCHOR_SIZE = 82;
  // rect/oval/square all have straight, parallel edges that read as a
  // container/frame around the other shapes once scaled up to anchor size,
  // rather than a member of the cluster -- excluded from anchor duty (still
  // fine as smaller inner shapes, where they visibly overlap like everything
  // else). Only triangle/circle/diamond don't carry that "box" reading.
  var ANCHOR_SHAPES = ['triangle', 'circle', 'diamond'];
  // shapeSvg()'s "size" parameter maps to a different rendered bounding box
  // per type (e.g. a rotated square's bounding box is size*sqrt(2) on a
  // side) -- each factor here is the LARGEST of a type's own width/height
  // multipliers, which caps its bounding box (both dimensions) at
  // ANCHOR_SIZE, so the gap between clusters stays identical regardless of
  // which type gets picked as the anchor.
  var BOUNDING_FACTOR = { diamond: Math.SQRT2, circle: 1, triangle: 1 };
  function anchorSizeFor(type){
    return ANCHOR_SIZE / BOUNDING_FACTOR[type];
  }
  // The old "medium" is now the easiest tier (2 inner shapes was already a
  // reasonable floor). Hard keeps the same inner-shape count as medium
  // (more shapes than that reads as clutter, not difficulty) and instead
  // gets harder through subtlety: a near-uniform size range removes the
  // "the odd one is just a different size" shortcut, and subtleSwap (see
  // SIMILAR_TYPES below) prefers swapping in a shape that closely
  // resembles what it replaced instead of a totally different one.
  // Inner sizes scaled up by the same factor as ANCHOR_SIZE's own increase
  // (68 -> 82) so the anchor-to-inner size RATIO stays what it was --
  // otherwise a bigger anchor next to unchanged-size inner shapes reads as
  // a container again, regardless of shape type.
  // Hard's earlier "messy" problem came from a wide size range at a high
  // inner count (lots of differently-sized shapes tangling together), not
  // from the count alone -- now that hard's sizes are tight and uniform,
  // it can afford more shapes than medium again for a real difficulty step.
  var TIER_CONFIG = {
    easy:   { inner: 2, jitter: 14, sizeMin: 31, sizeMax: 48 },
    medium: { inner: 3, jitter: 18, sizeMin: 31, sizeMax: 51 },
    hard:   { inner: 4, jitter: 24, sizeMin: 39, sizeMax: 43, subtleSwap: true }
  };
  // Pairs that are easy to mistake for one another at a glance -- used only
  // when a tier's subtleSwap is on, to make the swap mutation's difference
  // genuinely harder to spot rather than just busier.
  var SIMILAR_TYPES = {
    square: 'diamond', diamond: 'square',
    circle: 'oval', oval: 'circle',
    rect: 'oval', triangle: 'diamond'
  };
  // Sets per round: 7 -- with two tries per set and a miss sending the
  // dots back to zero, 10 in a row was a lot for a young child.
  var ROUND_SIZE = 7;
  // Two tries per set of cards. A second wrong tap sends the progress dots
  // back to zero and starts the round over with new cards, so tapping all
  // three to find the right one doesn't pay off.
  var MAX_TRIES = 2;

  var state = {
    difficulty: 'easy',
    clusters: null,
    correctIndex: -1,
    progress: 0,
    wrongTries: 0,  // wrong taps on the current set of cards
    busy: false
  };

  var els = {
    boardWrap: document.getElementById('boardWrap'),
    clusterRow: document.getElementById('clusterRow'),
    celebration: document.getElementById('celebration'),
    diffGroup: document.getElementById('diffGroup'),
    backBtn: document.getElementById('backBtn'),
    refreshBtn: document.getElementById('refreshBtn'),
    controlsSlider: document.getElementById('controlsSlider'),
    progressDots: Array.prototype.slice.call(document.querySelectorAll('#progressDots .dot'))
  };

  function updateAppHeight(){
    var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty('--app-height', h + 'px');
  }
  updateAppHeight();
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', updateAppHeight);
    window.visualViewport.addEventListener('scroll', updateAppHeight);
  } else {
    window.addEventListener('resize', updateAppHeight);
  }

  // iOS can leave --app-height stuck at a stale reading after the tab is
  // backgrounded (app-switched away from, screen locked) and never self-
  // correct on return, since nothing else re-fires resize/scroll -- force a
  // fresh reading the moment the page becomes visible again.
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible') updateAppHeight();
  });

  var landscapeBlockMQ = window.matchMedia('(max-height:500px) and (min-width:500px) and (orientation:landscape)');
  var wasInLandscapeBlock = landscapeBlockMQ.matches;
  function onLandscapeBlockChange(e){
    if (wasInLandscapeBlock && !e.matches) {
      saveResume();
      location.reload();
    }
    wasInLandscapeBlock = e.matches;
  }
  if (landscapeBlockMQ.addEventListener) {
    landscapeBlockMQ.addEventListener('change', onLandscapeBlockChange);
  } else if (landscapeBlockMQ.addListener) {
    landscapeBlockMQ.addListener(onLandscapeBlockChange);
  }

  // ---------- round generation ----------

  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function makeShape(type, size, cfg){
    return {
      type: type,
      x: 50 + (Math.random() * 2 - 1) * cfg.jitter,
      y: 50 + (Math.random() * 2 - 1) * cfg.jitter,
      size: size
    };
  }

  // Random data for one round (every card's shapes + which card is odd),
  // kept separate from the DOM so a resumed game can re-render the exact
  // same round.
  function generateRound(){
    var cfg = TIER_CONFIG[state.difficulty];
    var anchorType = shuffle(ANCHOR_SHAPES)[0];
    var pool = shuffle(SHAPES.filter(function(t){ return t !== anchorType; }));
    var innerTypes = pool.slice(0, cfg.inner);
    var remaining = pool.slice(cfg.inner);
    var spareType = remaining[0];
    if (cfg.subtleSwap) {
      for (var k = 0; k < innerTypes.length; k++) {
        var similar = SIMILAR_TYPES[innerTypes[k]];
        if (similar && remaining.indexOf(similar) !== -1) { spareType = similar; break; }
      }
    }
    // Fix each shape TYPE's size once for the whole round -- a shape that
    // recurs across clusters has to be recognizably the *same* shape (only
    // its position changes, which is what makes each cluster a different
    // composition), or the "spot the odd one" comparison breaks down.
    var sizeByType = {};
    innerTypes.concat([spareType]).forEach(function(t){
      sizeByType[t] = cfg.sizeMin + Math.random() * (cfg.sizeMax - cfg.sizeMin);
    });
    var oddIndex = Math.floor(Math.random() * CLUSTER_COUNT);
    // A missing shape is an easy tell (fewer outlines, spottable at a
    // glance) -- subtleSwap tiers always use the harder swap instead, so
    // hard doesn't get an occasional "free" easy round.
    var mutation = cfg.subtleSwap ? 'swap' : (Math.random() < 0.5 ? 'swap' : 'missing');

    var clusters = [];
    for (var i = 0; i < CLUSTER_COUNT; i++) {
      var anchor = { type: anchorType, x: 50, y: 50, size: anchorSizeFor(anchorType) };
      var types = shuffle(innerTypes);
      var inner = types.map(function(t){ return makeShape(t, sizeByType[t], cfg); });
      if (i === oddIndex && inner.length) {
        if (mutation === 'swap') {
          var swapIdx = Math.floor(Math.random() * inner.length);
          var old = inner[swapIdx];
          inner[swapIdx] = { type: spareType, x: old.x, y: old.y, size: sizeByType[spareType] };
        } else {
          inner.splice(Math.floor(Math.random() * inner.length), 1);
        }
      }
      clusters.push([anchor].concat(inner));
    }
    return { clusters: clusters, correctIndex: oddIndex };
  }

  function renderRound(round){
    state.wrongTries = 0; // fresh tries for every new set of cards
    state.clusters = round.clusters;
    state.correctIndex = round.correctIndex;
    renderClusters();
  }

  function buildRound(){
    renderRound(generateRound());
  }

  // ---------- rendering ----------

  function shapeSvg(shape){
    var cx = shape.x, cy = shape.y, s = shape.size;
    if (shape.type === 'square') {
      return '<rect class="cluster-shape" x="' + (cx - s / 2) + '" y="' + (cy - s / 2) + '" width="' + s + '" height="' + s + '"/>';
    }
    if (shape.type === 'diamond') {
      return '<rect class="cluster-shape" x="' + (cx - s / 2) + '" y="' + (cy - s / 2) + '" width="' + s + '" height="' + s + '" transform="rotate(45 ' + cx + ' ' + cy + ')"/>';
    }
    if (shape.type === 'rect') {
      return '<rect class="cluster-shape" x="' + (cx - s * 0.6) + '" y="' + (cy - s * 0.35) + '" width="' + (s * 1.2) + '" height="' + (s * 0.7) + '"/>';
    }
    if (shape.type === 'circle') {
      return '<circle class="cluster-shape" cx="' + cx + '" cy="' + cy + '" r="' + (s / 2) + '"/>';
    }
    if (shape.type === 'oval') {
      return '<ellipse class="cluster-shape" cx="' + cx + '" cy="' + cy + '" rx="' + (s * 0.6) + '" ry="' + (s * 0.36) + '"/>';
    }
    // triangle
    var p1 = cx + ',' + (cy - s * 0.55);
    var p2 = (cx - s / 2) + ',' + (cy + s * 0.4);
    var p3 = (cx + s / 2) + ',' + (cy + s * 0.4);
    return '<polygon class="cluster-shape" points="' + p1 + ' ' + p2 + ' ' + p3 + '"/>';
  }

  function renderClusters(){
    els.clusterRow.innerHTML = '';
    state.clusters.forEach(function(shapes, i){
      var card = document.createElement('div');
      card.className = 'cluster-card';
      card.dataset.index = i;
      // Every card tap already plays positive or negative -- skip the click
      // so two sounds never land at once.
      card.setAttribute('data-own-sound', '');
      card.innerHTML = '<svg viewBox="0 0 100 100">' + shapes.map(shapeSvg).join('') + '</svg>';
      card.addEventListener('click', onCardTap);
      els.clusterRow.appendChild(card);
    });
  }

  function updateProgressDots(){
    els.progressDots.forEach(function(dot, i){
      dot.classList.toggle('done', i < state.progress);
    });
  }

  // ---------- interaction ----------

  function onCardTap(e){
    if (state.busy) return;
    var i = Number(e.currentTarget.dataset.index);
    if (i === state.correctIndex) {
      flashCorrect(e.currentTarget);
    } else {
      flashWrong(e.currentTarget);
    }
  }

  function flashWrong(card){
    state.busy = true;
    state.wrongTries++;
    var out = state.wrongTries >= MAX_TRIES;
    PLSound.play('negative');
    card.classList.add('wrong', 'pop');
    setTimeout(function(){
      card.classList.remove('wrong', 'pop');
      if (out) {
        // Out of tries: the sad face, then the dots empty and the round
        // starts over (busy stays on until then).
        showSad();
        return;
      }
      state.busy = false;
    }, out ? 700 : 420);
  }

  function flashCorrect(card){
    state.busy = true;
    PLSound.play('positive');
    card.classList.add('correct', 'pop');
    setTimeout(function(){
      state.progress++;
      updateProgressDots();
      if (state.progress >= ROUND_SIZE) {
        showCelebration();
      } else {
        buildRound();
      }
      state.busy = false;
    }, 420);
  }

  // ---------- celebration ----------

  var CELEBRATION_FACE_SVG = '<svg class="celebration-face" viewBox="0 0 973 366" style="--final-scale:1;">' +
    '<circle fill="var(--shape)" cx="65" cy="65" r="65"/>' +
    '<circle fill="var(--shape)" cx="908" cy="65" r="65"/>' +
    '<rect fill="var(--shape)" x="161" y="171" width="130" height="130"/>' +
    '<rect fill="var(--shape)" x="683" y="171" width="130" height="130"/>' +
    '<rect fill="var(--shape)" x="291" y="301" width="392" height="65"/>' +
    '</svg>';

  // Pixel-art sad face (Figma node 198:1914), the same one Tic-Tac-Toe shows
  // when the computer wins: the happy face's eyes, its mouth blocks
  // rearranged (bar on top, corners hanging below).
  var SAD_FACE_SVG = '<svg class="celebration-face" viewBox="0 0 973 366" style="--final-scale:1;">' +
    '<circle fill="var(--shape)" cx="65" cy="65" r="65"/>' +
    '<circle fill="var(--shape)" cx="908" cy="65" r="65"/>' +
    '<rect fill="var(--shape)" x="291" y="171" width="392" height="65"/>' +
    '<rect fill="var(--shape)" x="161" y="236" width="130" height="130"/>' +
    '<rect fill="var(--shape)" x="683" y="236" width="130" height="130"/>' +
    '</svg>';

  // Out of tries: the sad face for 3s with the 'tryagain' sound (as
  // Tic-Tac-Toe does when the computer wins), then the round starts over
  // from zero dots.
  function showSad(){
    updateAppHeight();
    els.celebration.innerHTML = SAD_FACE_SVG;
    PLSound.play('tryagain');
    els.boardWrap.style.display = 'none';
    els.celebration.style.display = 'flex';
    setTimeout(function(){
      els.celebration.style.display = 'none';
      els.boardWrap.style.display = '';
      startGame();
    }, 3000);
  }

  function showCelebration(){
    updateAppHeight();
    els.celebration.innerHTML = CELEBRATION_FACE_SVG;
    PLSound.play('complete');
    els.boardWrap.style.display = 'none';
    els.celebration.style.display = 'flex';
    setTimeout(function(){
      els.celebration.style.display = 'none';
      els.boardWrap.style.display = '';
      startGame();
    }, 3000);
  }

  // ---------- lifecycle ----------

  function startGame(){
    state.progress = 0;
    state.busy = false;
    updateProgressDots();
    buildRound();
  }

  // ---------- resume after the rotate-block reload ----------
  // Turning the phone back from the landscape block reloads the page (see
  // onLandscapeBlockChange). Save the game just before that reload and pick it
  // back up on the next load, so the player continues where they left off.
  // sessionStorage: this tab only, and only for this one reload.
  var RESUME_KEY = 'playandlearn.resume.oddoneout';
  var RESUME_MAX_AGE = 10 * 60 * 1000;
  function saveResume(){
    try {
      var data = snapshotGame();
      if (data) sessionStorage.setItem(RESUME_KEY, JSON.stringify({ at: Date.now(), data: data }));
    } catch (e) {}
  }
  function takeResume(){
    try {
      var raw = sessionStorage.getItem(RESUME_KEY);
      sessionStorage.removeItem(RESUME_KEY);
      if (!raw) return null;
      var saved = JSON.parse(raw);
      if (!saved || Date.now() - saved.at > RESUME_MAX_AGE) return null;
      return saved.data;
    } catch (e) { return null; }
  }

  // Difficulty, progress and the current round's exact cards. Null while the
  // win celebration shows -- a fresh game is what comes next anyway.
  function snapshotGame(){
    if (els.celebration.style.display === 'flex') return null;
    if (!state.clusters) return null;
    var progress = state.progress;
    var round = { clusters: state.clusters, correctIndex: state.correctIndex };
    // Caught mid "correct" feedback, before the next round was built: count
    // the answer and let restore deal a new round (null = generate one).
    if (state.busy && els.clusterRow.querySelector('.cluster-card.correct')) {
      progress++;
      if (progress >= ROUND_SIZE) return null;
      round = null;
    }
    return { difficulty: state.difficulty, progress: progress, round: round };
  }

  function isNum(v){ return typeof v === 'number' && isFinite(v); }
  function isValidRound(round){
    if (!round || !Array.isArray(round.clusters) || round.clusters.length !== CLUSTER_COUNT) return false;
    var ci = round.correctIndex;
    if (typeof ci !== 'number' || ci % 1 !== 0 || ci < 0 || ci >= CLUSTER_COUNT) return false;
    return round.clusters.every(function(shapes){
      return Array.isArray(shapes) && shapes.length > 0 && shapes.every(function(sh){
        return sh && SHAPES.indexOf(sh.type) !== -1 &&
          isNum(sh.x) && isNum(sh.y) && isNum(sh.size);
      });
    });
  }

  // Everything is checked before anything is touched, so bad data falls
  // back to a normal fresh start without leaving a half-built board.
  function restoreGame(data){
    if (!data || !TIER_CONFIG.hasOwnProperty(data.difficulty)) return false;
    var p = data.progress;
    if (typeof p !== 'number' || p % 1 !== 0 || p < 0 || p >= ROUND_SIZE) return false;
    if (data.round !== null && !isValidRound(data.round)) return false;
    var btn = els.diffGroup.querySelector('[data-tier="' + data.difficulty + '"]');
    if (!btn) return false;

    state.difficulty = data.difficulty;
    state.progress = p;
    state.busy = false;
    els.diffGroup.querySelectorAll('.diff-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    updateProgressDots();
    renderRound(data.round || generateRound());
    return true;
  }

  els.diffGroup.addEventListener('click', function(e){
    var btn = e.target.closest('.diff-btn');
    if (!btn) return;
    if (state.busy) return; // mid tap-feedback -- let it finish before switching
    var tier = btn.dataset.tier;
    if (tier === state.difficulty) return; // already selected -- don't reset the current round
    state.difficulty = tier;
    els.diffGroup.querySelectorAll('.diff-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    buildRound(); // new composition for the new tier, but keep progress (matches Math/Number Puzzle)
  });
  els.refreshBtn.addEventListener('click', startGame);
  els.backBtn.addEventListener('click', function(){ PLSound.go('../index.html'); });

  // First-visit only: gently peek-scroll the bottom slider tray so new users notice
  // it scrolls (there are more icons than fit on a phone screen), then ease back to
  // the correct resting view with + as the leftmost icon. Jumps to the TRUE end
  // (no partial-reveal cap -- a longer tray, e.g. Math's, was never reaching its
  // real end otherwise) immediately, before first paint, then eases back on the
  // very next frame with no added hold -- both the jump and the start of the
  // ease read as a glitchy stutter when delayed.
  function introduceTraySlider(){
    var el = els.controlsSlider;
    if (!el || window.innerWidth > 767) return;
    var STORAGE_KEY = 'oddoneout.traySliderIntroShown';
    try { if (localStorage.getItem(STORAGE_KEY)) return; } catch (e) {}
    var maxScroll = el.scrollWidth - el.clientWidth;
    if (maxScroll <= 0) return;
    var reveal = maxScroll;
    el.scrollLeft = reveal;
    var duration = 1800;
    var start = null;
    function easeInOutCubic(t){
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }
    function step(ts){
      if (start === null) start = ts;
      var elapsed = ts - start;
      if (elapsed >= duration) {
        el.scrollLeft = 0;
        try { localStorage.setItem(STORAGE_KEY, '1'); } catch (e) {}
        return;
      }
      el.scrollLeft = reveal * (1 - easeInOutCubic(elapsed / duration));
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  introduceTraySlider();

  var resumed = takeResume();
  if (!(resumed && restoreGame(resumed))) {
    els.diffGroup.querySelector('[data-tier="easy"]').classList.add('active');
    startGame();
  }
})();
</script>
</body>
</html>
